# 将剪藏（CutShelter）MCP 桥接入 DSH Web UI —— 配置示例
#
# 用法：
#   1. 启动剪藏后端（Spring Boot，默认 http://127.0.0.1:8081）
#   2. 安装依赖：cd integrations/dsh/mcp-server && npm install
#               cd integrations/dsh/plugins/clip-capture && npm install
#   3. 用本覆盖层启动 DSH（--patch 叠加到 web profile）：
#        npx @deepseek-ai/dsh web --patch ./integrations/dsh/cordis.example.yml
#      或（源码运行）：
#        pnpm dsh web --patch ./integrations/dsh/cordis.example.yml
#   4. 打开 http://127.0.0.1:3080，Agent 将看到 mcp__cut_shelter__* 工具
#      以及 clip_session 工具（Phase 1：会话成果自动落库）
#
# 注意：
#   - command 必须是 node 的绝对路径（Windows 下为 node.exe，用 `where node` 查）；
#     本文件按本机（C:\nvm4w\nodejs\node.exe）填写，换机器需改。
#   - 端口默认 3081：因为 3080 通常已被日常 DSH 实例占用，避免冲突。
#   - 本桥无鉴权，仅绑定本机 8081 后端，不要暴露到公网。

- id: webserver
  config:
    host: 127.0.0.1
    port: 3081
# 若 3081 也被占用，改其他端口后重启即可。

# 新增插件统一放 insert 块（顶层 id 条目是"替换已有条目"语义，对不存在的新插件无效）
- insert:
    - id: mcp-cut-shelter
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cut_shelter
        transport: stdio
        command: 'C:/nvm4w/nodejs/node.exe'
        args:
          - 'L:/归档/30_Projects (行动项目)/31_Work (主要工作)/code/ai_coding/integrations/dsh/mcp-server/server.mjs'
        env:
          CUTSHELTER_BASE_URL: http://127.0.0.1:8081
          CUTSHELTER_TIMEOUT_MS: '60000'

    # Phase 1：clip_session 工具（会话成果自动落库）——本地插件，先 npm install。
    # 注意：Windows 上插件 name 必须是 file:// URL（盘符路径 L:/... 会被 ESM 当成 l: 协议报错）。
    - id: clip-capture
      name: 'file:///L:/%E5%BD%92%E6%A1%A3/30_Projects%20(%E8%A1%8C%E5%8A%A8%E9%A1%B9%E7%9B%AE)/31_Work%20(%E4%B8%BB%E8%A6%81%E5%B7%A5%E4%BD%9C)/code/ai_coding/integrations/dsh/plugins/clip-capture/index.mjs'
      config:
        baseUrl: http://127.0.0.1:8081
