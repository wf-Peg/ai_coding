<!DOCTYPE html>
<html lang="zh-CN" data-theme="notion">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>碎碎记 - 设置</title>

  <!-- 主题令牌：仅提供全局骨架（标题栏/容器/状态条）用色；引导卡片由 guide-core 自管 -->
  <link rel="stylesheet" href="../frontend/styles/design-tokens.css">
  <!-- 共享上手引导渲染器（自包含、注入样式、跟随 data-theme） -->
  <script src="../frontend/js/guide-core.js"></script>

  <style>
    /* ===== 全局重置与骨架（全部引用 --app-* 令牌） ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--app-bg, #f7f7f5); color: var(--app-text, #2f3437); overflow: hidden;
    }

    /* ===== 自定义标题栏（无边框窗口） ===== */
    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 12px;
      background: var(--app-primary, #2383e2); color: #fff;
      user-select: none;
    }
    .titlebar-drag {
      -webkit-app-region: drag;
      display: flex; align-items: center; gap: 8px; flex: 1;
      height: 100%;
    }
    .titlebar-icon { font-size: 16px; }
    .titlebar-title { font-size: 13px; font-weight: 500; }
    .titlebar-controls {
      -webkit-app-region: no-drag;
      display: flex; align-items: center; gap: 6px;
    }
    .titlebar-btn {
      width: 30px; height: 30px; border: none; background: transparent;
      border-radius: 6px; color: rgba(255,255,255,0.9); font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .titlebar-btn:hover { background: rgba(255,255,255,0.18); }

    /* ===== 主内容区域（引导卡由 guide-core 渲染） ===== */
    .container { height: calc(100vh - 44px); overflow-y: auto; }

    /* ===== 顶部状态条（复用旧 status-bar 语义，令牌化） ===== */
    .status-bar {
      margin: 0 24px 8px; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; display: none;
    }
    .status-bar.success { display: block; background: var(--app-success-soft, rgba(35,139,99,.1)); color: var(--app-success, #238b63); border: 1px solid var(--app-success, #238b63); }
    .status-bar.error { display: block; background: var(--app-danger-soft, rgba(209,67,67,.1)); color: var(--app-danger, #d14343); border: 1px solid var(--app-danger, #d14343); }
    .status-bar.loading { display: block; background: var(--app-primary-soft, rgba(35,131,226,.1)); color: var(--app-primary, #2383e2); border: 1px solid var(--app-primary, #2383e2); }

    /* ===== 启动遮罩层 ===== */
    .startup-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: color-mix(in srgb, var(--app-bg, #f7f7f5) 92%, transparent);
      z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    }
    .startup-overlay.active { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--app-border-strong, #d2d2cd);
      border-top-color: var(--app-primary, #2383e2);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .startup-text { font-size: 15px; color: var(--app-text-secondary, #6b6f76); font-weight: 500; text-align: center; }
    .startup-step { font-size: 13px; color: var(--app-text-muted, #92969d); text-align: center; max-width: 300px; }

    /* ===== 相对 guide-core 的容器留白 ===== */
    #onboardRoot { padding: 20px 0 8px; }
  </style>
</head>
<body>

  <!-- ==================== 自定义标题栏 ==================== -->
  <div class="titlebar">
    <div class="titlebar-drag">
      <span class="titlebar-icon">✨</span>
      <span class="titlebar-title" id="headerTitle">碎碎记 - 初始设置</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="themeToggle" title="切换浅色/深色">🌓</button>
      <button class="titlebar-btn" id="titlebarClose" title="关闭">✕</button>
    </div>
  </div>

  <!-- ==================== 引导卡渲染区 / 状态条 ==================== -->
  <div class="container">
    <div id="onboardRoot"></div>
    <div class="status-bar" id="statusBar"></div>
  </div>

  <!-- ==================== 启动遮罩层 ==================== -->
  <div class="startup-overlay" id="startupOverlay">
    <div class="spinner"></div>
    <div class="startup-text">正在启动服务...</div>
    <div class="startup-step" id="startupStep">准备中</div>
  </div>

  <!-- ==================== 页面逻辑脚本 ==================== -->
  <script>
    /**
     * 等待 electronAPI 就绪后再执行业务逻辑
     * 与旧版一致：轮询 window.electronAPI，最多等 5 秒。
     */
    function waitForAPI(callback) {
      if (window.electronAPI) { callback(window.electronAPI); return; }
      var attempts = 0;
      var timer = setInterval(function () {
        attempts++;
        if (window.electronAPI) { clearInterval(timer); callback(window.electronAPI); }
        else if (attempts > 100) { clearInterval(timer); showStatus('electronAPI not available', 'error'); }
      }, 50);
    }

    var isFirstRun = false;
    var loadedConfig = null;
    var recommendedPath = '';
    // 首装的推荐路径：由「一键填充推荐路径」显式写入，默认不自动回填（保证「唯一必填」成立）
    var spec = null;

    function showStatus(message, type) {
      var bar = document.getElementById('statusBar');
      bar.textContent = message;
      bar.style.display = 'block';
      bar.className = 'status-bar ' + type;
    }
    function showStartupOverlay(step) {
      document.getElementById('startupOverlay').classList.add('active');
      document.getElementById('startupStep').textContent = step || '准备中';
    }
    function hideStartupOverlay() {
      document.getElementById('startupOverlay').classList.remove('active');
    }

    /** 浅/深主题切换（config 窗口独立，不走主窗口广播） */
    function applyPersistedTheme() {
      var saved = null;
      try { saved = localStorage.getItem('config_theme'); } catch (e) {}
      var theme = saved && (saved === 'dark' || saved === 'notion') ? saved : 'notion';
      document.documentElement.setAttribute('data-theme', theme);
    }
    function toggleTheme() {
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'notion' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try { localStorage.setItem('config_theme', cur); } catch (e) {}
      // 重绘引导卡（令牌作用域跟随 data-theme）
      if (window.CutShelterGuide && spec) {
        window.CutShelterGuide.render(document.getElementById('onboardRoot'), spec);
        bindSpecEvents();
      }
    }

    function storeStatus() {
      var val = (document.getElementById('gStoragePath') || {}).value || '';
      spec.cards[0].status = { text: val.trim() ? '已就绪' : '未设置', tone: val.trim() ? 'ok' : 'danger' };
    }

    /** 渲染完后绑定卡片内控件事件（冰洁：存储路径/填充/浏览/AI/端口） */
    function bindSpecEvents() {
      var api = window.electronAPI;

      var pathInput = document.getElementById('gStoragePath');
      var browseBtn = document.getElementById('gBrowseBtn');
      var fillBtn = document.getElementById('gFillBtn');

      function refreshSpec() {
        storeStatus();
        // 重刷卡片状态药丸
        var cardDom = spec.cards[0]._dom;
        if (cardDom) {
          var st = cardDom.querySelector('.g-status');
          if (st) {
            st.className = (spec.cards[0].status.tone === 'ok' ? 'g-status ok' : 'g-status danger');
            var span = st.querySelector('span:last-child');
            if (span) span.textContent = spec.cards[0].status.text;
          }
        }
        // 同步主按钮可用性
        if (spec._primaryBtn) {
          spec._primaryBtn.disabled = !window.CutShelterGuide.resolveCanProceed(spec);
        }
      }

      if (pathInput) pathInput.addEventListener('input', refreshSpec);
      if (browseBtn) browseBtn.addEventListener('click', async function () {
        try {
          var dir = await api.selectDirectory();
          if (dir) { pathInput.value = dir; refreshSpec(); }
        } catch (e) { showStatus('选择目录失败: ' + e.message, 'error'); }
      });
      if (fillBtn) fillBtn.addEventListener('click', function () {
        if (recommendedPath) { pathInput.value = recommendedPath; refreshSpec(); }
        else showStatus('暂无可用的推荐路径，请手动浏览选择', 'error');
      });
    }

    function buildSpec() {
      spec = {
        title: '欢迎使用碎碎记',
        subtitle: '配好存储目录即可开始，AI 可稍后再添加。',
        stepText: '第 1 步 · 共 2 步',
        progress: [{ state: 'current' }, { state: 'pending' }],
        footerNote: '内容 100% 存本机 · 随时可用任何工具打开迁移',
        primaryAction: {
          id: 'gPrimaryAction',
          label: isFirstRun ? '开始使用' : '保存并重启',
          onClick: onSaveClick
        },
        cards: [
          {
            id: 'store', icon: '📂', label: '工作区存储路径',
            required: true, badge: '必填', badgeOpt: false,
            desc: '所有剪藏、整理、周报数据存放的根目录。',
            status: { text: '未设置', tone: 'danger' },
            open: true,
            fieldsHtml: function () {
              return '' +
                '<div class="g-field">' +
                  '<label class="g-label">存储总目录</label>' +
                  '<div class="g-path-row">' +
                    '<input type="text" id="gStoragePath" placeholder="选择数据存放根目录">' +
                    '<button type="button" id="gBrowseBtn" class="g-btn ghost" style="padding:8px 14px;">浏览</button>' +
                  '</div>' +
                  (recommendedPath
                    ? '<button type="button" id="gFillBtn" class="g-btn ghost" style="margin-top:8px;width:100%;">一键填充推荐路径</button>'
                    : '') +
                  '<div class="g-hint">子目录 clip-storage / clip-organized / weekly-report 将自动派生</div>' +
                '</div>';
            },
            actions: function () { return ''; }
          },
          {
            id: 'ai', icon: '🧠', label: '主 AI 模型 · API Key',
            required: false, badge: '稍后配置', badgeOpt: true,
            desc: '为整理、问答、写作等提供 AI 能力，可稍后在设置中补配。',
            status: { text: '稍后配置', tone: 'muted' },
            open: false,
            fieldsHtml: function () {
              return '' +
                '<div class="g-field">' +
                  '<label class="g-label">服务商</label>' +
                  '<select id="gProvider">' +
                    '<option value="dashscope">阿里云 DashScope</option>' +
                    '<option value="deepseek">DeepSeek</option>' +
                    '<option value="custom">自定义 OpenAI 兼容</option>' +
                  '</select>' +
                '</div>' +
                '<div class="g-field">' +
                  '<label class="g-label">API Key</label>' +
                  '<input type="password" id="gApiKey" placeholder="sk-…" autocomplete="off">' +
                '</div>';
            },
            actions: function () {
              return '<button type="button" class="g-btn danger" data-g-skip="ai">跳过，稍后配置</button>';
            }
          },
          {
            id: 'adv', icon: '🔌', label: '服务端口（高级）',
            required: false, badgeOpt: false,
            desc: '默认 后端 8081 / 前端 3001；一般无需修改。',
            status: { text: '使用默认', tone: 'muted' },
            open: false,
            fieldsHtml: function () {
              return '' +
                '<div class="g-field"><label class="g-label">后端端口</label>' +
                  '<input type="number" id="backendPort" value="8081" min="1024" max="65535"></div>' +
                '<div class="g-field"><label class="g-label">前端端口</label>' +
                  '<input type="number" id="frontendPort" value="3001" min="1024" max="65535"></div>';
            },
            actions: function () { return ''; }
          }
        ]
      };
      return spec;
    }

    function onSaveClick() {
      var api = window.electronAPI;
      var backendPort = parseInt((document.getElementById('backendPort') || {}).value, 10) || 8081;
      var frontendPort = parseInt((document.getElementById('frontendPort') || {}).value, 10) || 3001;
      var storagePath = ((document.getElementById('gStoragePath') || {}).value || '').trim();

      // 表单校验：唯一必填 = 存储路径；端口仅做相等兜底
      if (!storagePath) { showStatus('请选择工作区存储路径', 'error'); return; }
      if (backendPort === frontendPort) { showStatus('前端和后端端口不能相同', 'error'); return; }

      // 合并已有配置，保留当前页面未展示的项
      var newConfig = Object.assign({}, loadedConfig || {}, {
        backendPort: backendPort,
        frontendPort: frontendPort,
        storagePath: storagePath,
        configured: true
      });

      // AI Key 值才写对应 provider 字段，其余置空避免串值
      var provider = (document.getElementById('gProvider') || {}).value || 'dashscope';
      var apiKey = ((document.getElementById('gApiKey') || {}).value || '').trim();
      newConfig.activeProvider = provider;
      newConfig.dashscopeApiKey = '';
      newConfig.deepseekApiKey = '';
      newConfig.customApiKey = '';
      newConfig.customBaseUrl = '';
      if (apiKey) {
        if (provider === 'dashscope') newConfig.dashscopeApiKey = apiKey;
        else if (provider === 'deepseek') newConfig.deepseekApiKey = apiKey;
        else newConfig.customApiKey = apiKey;
      }

      var btn = document.getElementById('gPrimaryAction');
      btn.disabled = true;

      if (isFirstRun) {
        showStartupOverlay('正在保存配置...');
        api.configDone(newConfig);
      } else {
        showStartupOverlay('正在保存配置并重启服务...');
        api.restartBackend(newConfig).then(function (result) {
          if (result && result.success) {
            showStartupOverlay('启动成功！');
            setTimeout(function () { hideStartupOverlay(); window.close(); }, 1000);
          } else {
            hideStartupOverlay();
            showStatus('重启失败: ' + ((result && result.message) || '未知错误'), 'error');
            btn.disabled = false;
          }
        }).catch(function (e) {
          hideStartupOverlay();
          showStatus('操作失败: ' + (e.message || '未知错误'), 'error');
          btn.disabled = false;
        });
      }
    }

    waitForAPI(function (api) {

      api.onLoadConfig(function (config) {
        loadedConfig = config;
        recommendedPath = (config && config.storagePath) || '';
        document.getElementById('backendPort').value = config.backendPort || 8081;
        document.getElementById('frontendPort').value = config.frontendPort || 3001;
        renderGuide();
      });

      api.onFirstRun(function () {
        isFirstRun = true;
        document.getElementById('headerTitle').textContent = '碎碎记 - 初始设置';
        document.getElementById('titlebarClose').style.display = 'none';
        renderGuide();
      });

      api.onStartupProgress(function (msg) { showStartupOverlay(msg); });
      api.onStartupError(function (msg) {
        hideStartupOverlay();
        showStatus('启动失败: ' + msg, 'error');
        document.getElementById('gPrimaryAction').disabled = false;
      });

      document.getElementById('titlebarClose').addEventListener('click', function () { window.close(); });
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);

      applyPersistedTheme();
      renderGuide();
    });

    function renderGuide() {
      if (!window.CutShelterGuide) { showStatus('引导组件加载失败，请重新打开设置', 'error'); return; }
      var host = document.getElementById('onboardRoot');
      window.CutShelterGuide.render(host, buildSpec());
      bindSpecEvents();
    }
  </script>
</body>
</html>
