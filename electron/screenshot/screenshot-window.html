<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>截图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; }
  #mask { position: fixed; inset: 0; pointer-events: none; }
  #sel { position: fixed; border: 1px solid #3f8cff; background: rgba(63,140,255,0.12); display: none; pointer-events: none; }
  #sel .handle { position: absolute; width: 10px; height: 10px; background: #3f8cff; border-radius: 2px; }
  #sel .size-label {
    position: absolute; left: 0; top: -22px;
    background: rgba(0,0,0,0.72); color: #fff; font-size: 12px;
    padding: 2px 8px; border-radius: 4px; white-space: nowrap;
  }
  #toolbar {
    position: fixed; display: none; gap: 6px; z-index: 10;
    background: rgba(30,30,30,0.92); border-radius: 10px; padding: 6px 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4); align-items: center;
  }
  #toolbar button {
    border: none; background: transparent; color: #e5e7eb; font-size: 13px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
    font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.12); }
  #toolbar button.primary { background: #3f8cff; color: #fff; }
  #toolbar button.primary:hover { background: #2f72d8; }
  #toolbar .sep { width: 1px; height: 20px; background: rgba(255,255,255,0.2); }
  #hint {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #fff; font-size: 13px;
    padding: 6px 16px; border-radius: 999px; z-index: 5; pointer-events: none;
    font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
  }
</style>
</head>
<body>
<img id="bg" alt="">
<canvas id="mask" width="0" height="0"></canvas>
<div id="hint">拖拽选择截图区域，Esc 取消</div>
<div id="sel"><div class="size-label" id="sizeLabel"></div></div>
<div id="toolbar">
  <button class="primary" id="btnCopy">✓ 复制</button>
  <button id="btnSave">💾 保存</button>
  <button id="btnOcr">🔤 OCR</button>
  <button id="btnPaste">📌 贴图</button>
  <div class="sep"></div>
  <button id="btnCancel">✕ 取消</button>
</div>
<script>
  const { ipcRenderer } = require('electron');
  const bg = document.getElementById('bg');
  const mask = document.getElementById('mask');
  const sel = document.getElementById('sel');
  const sizeLabel = document.getElementById('sizeLabel');
  const toolbar = document.getElementById('toolbar');
  const hint = document.getElementById('hint');

  let display = null;
  let start = null;      // 拖拽起点
  let selRect = null;    // {x,y,w,h} 当前选区
  let selecting = false;
  let SCALE = 1;

  ipcRenderer.on('screenshot:init', (e, payload) => {
    display = payload.display;
    SCALE = (window.devicePixelRatio || 1) / (display.scaleFactor || 1);
    bg.src = payload.bg;
    bg.onload = () => {
      mask.width = bg.naturalWidth; mask.height = bg.naturalHeight;
      mask.style.width = '100%'; mask.style.height = '100%';
      drawMask(null);
    };
  });

  function drawMask(rect) {
    const ctx = mask.getContext('2d');
    const W = mask.width, H = mask.height;
    ctx.clearRect(0, 0, W, H);
    // 半透明遮罩（选区外压暗）
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    if (!rect) { ctx.fillRect(0, 0, W, H); return; }
    ctx.fillRect(0, 0, W, rect.y);
    ctx.fillRect(0, rect.y + rect.h, W, H - rect.y - rect.h);
    ctx.fillRect(0, rect.y, rect.x, rect.h);
    ctx.fillRect(rect.x + rect.w, rect.y, W - rect.x - rect.w, rect.h);
  }

  function updateSel(rect) {
    sel.style.display = rect ? 'block' : 'none';
    if (!rect) return;
    sel.style.left = rect.x + 'px';
    sel.style.top = rect.y + 'px';
    sel.style.width = rect.w + 'px';
    sel.style.height = rect.h + 'px';
    sizeLabel.textContent = Math.round(rect.w / SCALE) + ' × ' + Math.round(rect.h / SCALE);
    // 工具栏跟随选区
    const tbW = toolbar.offsetWidth || 220;
    let tx = rect.x + rect.w - tbW;
    let ty = rect.y + rect.h + 10;
    if (ty + 50 > window.innerHeight) ty = rect.y - 44;
    if (tx < 8) tx = 8;
    toolbar.style.left = tx + 'px';
    toolbar.style.top = ty + 'px';
    toolbar.style.display = 'flex';
    hint.style.display = 'none';
  }

  window.addEventListener('mousedown', (e) => {
    if (e.target.closest('#toolbar')) return;
    start = { x: e.clientX, y: e.clientY };
    selecting = true;
    selRect = { x: e.clientX, y: e.clientY, w: 0, h: 0 };
  });

  window.addEventListener('mousemove', (e) => {
    if (!selecting || !start) return;
    const x = Math.min(e.clientX, start.x);
    const y = Math.min(e.clientY, start.y);
    selRect = { x, y, w: Math.abs(e.clientX - start.x), h: Math.abs(e.clientY - start.y) };
    // canvas 坐标（与 bg 原始像素对应）
    const cs = { x: x * SCALE, y: y * SCALE, w: selRect.w * SCALE, h: selRect.h * SCALE };
    drawMask(cs);
    updateSel(selRect);
  });

  window.addEventListener('mouseup', () => {
    if (!selecting) return;
    selecting = false;
    if (selRect && selRect.w > 3 && selRect.h > 3) {
      // 完成选区，工具栏显示
    } else {
      selRect = null;
      drawMask(null);
      updateSel(null);
      toolbar.style.display = 'none';
      hint.style.display = '';
    }
  });

  function confirm(action) {
    if (!selRect) return;
    ipcRenderer.invoke('screenshot:confirm', {
      rect: { x: selRect.x * SCALE, y: selRect.y * SCALE, width: selRect.w * SCALE, height: selRect.h * SCALE },
      action: action
    });
  }

  document.getElementById('btnCopy').addEventListener('click', () => confirm('copy'));
  document.getElementById('btnSave').addEventListener('click', () => confirm('save'));
  document.getElementById('btnOcr').addEventListener('click', () => confirm('ocr'));
  document.getElementById('btnPaste').addEventListener('click', () => confirm('paste'));
  document.getElementById('btnCancel').addEventListener('click', () => ipcRenderer.invoke('screenshot:cancel'));

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); ipcRenderer.invoke('screenshot:cancel'); }
    else if (e.key === 'Enter' && selRect) { confirm('copy'); }
    else if (e.key.toLowerCase() === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); confirm('save'); }
  });
</script>
</body>
</html>
