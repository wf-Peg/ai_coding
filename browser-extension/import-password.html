<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>保存密码到密码库</title>
<link rel="stylesheet" href="styles/theme-notion.css">
<style>
  :root {
    --vault-primary: #6366f1;
    --vault-primary-dark: #4f46e5;
    --vault-bg: #f7f7f5;
    --vault-card: #ffffff;
    --vault-border: #e8e8e6;
    --vault-text: #2f3437;
    --vault-text-secondary: #6b6f76;
    --vault-text-muted: #8a8f98;
    --vault-danger: #e03e3e;
    --vault-danger-light: #fdeeee;
    --vault-success: #1f9d66;
    --vault-success-light: #eaf8f2;
    --vault-warning-bg: #fef3c7;
    --vault-warning-border: #fde68a;
    --vault-warning-text: #92400e;
  }
  html[data-theme="dark"] {
    --vault-bg: #1e1e1e;
    --vault-card: #2d2d2d;
    --vault-border: #3e3e3e;
    --vault-text: #d4d4d4;
    --vault-text-secondary: #9a9a9a;
    --vault-text-muted: #6a6a6a;
    --vault-danger-light: #3a1a1a;
    --vault-success-light: #1a3a2a;
    --vault-warning-bg: #3a2f10;
    --vault-warning-border: #5a4a20;
    --vault-warning-text: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: "IBM Plex Sans", "Noto Sans SC", -apple-system, sans-serif;
    background: var(--vault-bg);
    color: var(--vault-text);
    font-size: 13px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 18px;
    color: var(--vault-text);
  }
  .header svg { width: 18px; height: 18px; color: var(--vault-primary); }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--vault-text-secondary);
    margin-bottom: 5px;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--vault-border);
    border-radius: 8px;
    background: var(--vault-card);
    color: var(--vault-text);
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--vault-primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
  }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 36px; }
  .toggle-pwd {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--vault-text-muted);
  }
  .toggle-pwd:hover { color: var(--vault-text); }
  .toggle-pwd svg { width: 16px; height: 16px; }
  .field-hint { font-size: 11px; color: var(--vault-text-muted); margin-top: 3px; }
  .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--vault-border);
  }
  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-cancel {
    background: transparent;
    border-color: var(--vault-border);
    color: var(--vault-text-secondary);
  }
  .btn-cancel:hover { background: var(--vault-bg); }
  .btn-primary {
    background: var(--vault-primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--vault-primary-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .alert {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alert-warning {
    background: var(--vault-warning-bg);
    border: 1px solid var(--vault-warning-border);
    color: var(--vault-warning-text);
  }
  .alert-error {
    background: var(--vault-danger-light);
    color: var(--vault-danger);
  }
  .alert-success {
    background: var(--vault-success-light);
    color: var(--vault-success);
  }
  .alert svg { width: 16px; height: 16px; flex-shrink: 0; }
  .alert a { color: inherit; text-decoration: underline; cursor: pointer; }
  .hidden { display: none !important; }
  .success-view { text-align: center; padding: 30px 0; }
  .success-icon {
    width: 48px; height: 48px; margin: 0 auto 12px;
    border-radius: 50%;
    background: var(--vault-success-light);
    display: flex; align-items: center; justify-content: center;
  }
  .success-icon svg { width: 24px; height: 24px; color: var(--vault-success); }
  .success-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .success-sub { font-size: 12px; color: var(--vault-text-secondary); }
</style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    保存密码到密码库
  </div>

  <!-- 表单视图 -->
  <div id="formView">
    <div id="lockAlert" class="alert alert-warning hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01M5 19h14a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0L3.3 16A2 2 0 0 0 5 19z"/></svg>
      <span>密码库未解锁，请先解锁后再保存。<a id="openVaultLink">前往密码库解锁</a></span>
    </div>

    <div class="field">
      <label>网站名称</label>
      <input type="text" id="titleInput" placeholder="如：GitHub">
    </div>
    <div class="field">
      <label>网址</label>
      <input type="text" id="urlInput" placeholder="https://...">
      <div class="field-hint">从当前标签页自动填充，可编辑</div>
    </div>
    <div class="field">
      <label>用户名</label>
      <input type="text" id="usernameInput" placeholder="用户名或邮箱" autocomplete="off">
    </div>
    <div class="field">
      <label>密码</label>
      <div class="password-wrap">
        <input type="password" id="passwordInput" placeholder="密码" autocomplete="new-password">
        <button type="button" class="toggle-pwd" id="togglePwd" title="显示/隐藏密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <textarea id="notesInput" rows="2" placeholder="如：这是工作账号"></textarea>
    </div>
    <div class="field">
      <label>标签（可选）</label>
      <input type="text" id="tagsInput" placeholder="用逗号分隔，如：工作,重要">
    </div>

    <div id="errorAlert" class="alert alert-error hidden"></div>

    <div class="actions">
      <button class="btn btn-cancel" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">保存密码</button>
    </div>
  </div>

  <!-- 成功视图 -->
  <div id="successView" class="hidden">
    <div class="success-view">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="success-title">密码已保存到密码库</div>
      <div class="success-sub">窗口将在 1.5 秒后自动关闭</div>
    </div>
  </div>

  <script src="import-password.js"></script>
</body>
</html>
