<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="../frontend/libs/ace/ace.js"></script>
<script>
(function () {
  if (!window.define && window.ace && window.ace.define) window.define = window.ace.define;
  if (!window.require && window.ace && window.ace.require) window.require = window.ace.require;
})();
</script>
<script src="../frontend/libs/ace/ext-language_tools.js"></script>
</head>
<body>
<div id="ed" style="width:600px;height:200px;"></div>
<script>
  var editor = ace.edit('ed');
  editor.setOptions({
    enableBasicAutocompletion: true,
    enableLiveAutocompletion: true,
    enableSnippets: true
  });
  editor.session.setMode('ace/mode/text');

  var langTools = ace.require('ace/ext/language_tools');
  // 关键：identifierRegexps 必须是“单字符匹配”正则（ACE 会逐字符回溯检测），
  // 之前的 `\[\[...` 多字符正则导致单个 `[` 无法匹配，getCompletionPrefix 返回空串，
  // 进而 live autocomplete 不触发、gather 也不调用本 completer。
  var completer = {
    identifierRegexps: [/[\[\]a-zA-Z0-9\u4e00-\u9fff._\/\-]/],
    getCompletions: function(editor, session, pos, prefix, callback) {
      var line = session.getLine(pos.row).slice(0, pos.column);
      var fullLine = session.getLine(pos.row);
      var m = (line.match(/\[\[([^\[\]]*)$/) || fullLine.match(/\[\[([^\[\]]*)/));
      console.log('[[GC]] called prefix=' + JSON.stringify(prefix) + ' line=' + JSON.stringify(line) + ' m=' + JSON.stringify(m && m[1]));
      if (!m) { callback(null, []); return; }
      var q = m[1].toLowerCase();
      var data = ['剪藏功能设计', '知识管理方案', 'Obsidian双链', '工作台规则'];
      var out = data.filter(function(n){ return n.toLowerCase().indexOf(q) !== -1; });
      console.log('[[GC]] returning ' + out.length + ' items');
      // caption 需包含 `[[` 前缀，否则会被 ACE 的 setFilter 过滤掉
      callback(null, out.map(function(n){ return { caption: '[[' + n + ']]', value: '[[' + n + ']]', meta: '知识库' }; }));
    }
  };
  langTools.addCompleter(completer);

  function after(ms, fn){ setTimeout(fn, ms); }

  // 通过 insertstring 命令模拟真实键盘输入（才能触发 live autocomplete 的 afterExec）
  editor.setValue('', -1);
  editor.focus();
  after(50, function(){ editor.execCommand('insertstring', {text:'['}); });
  after(150, function(){ editor.execCommand('insertstring', {text:'['}); });
  after(500, function(){
    var c = editor.completer;
    console.log('[[LIVE]] completer=' + (!!c) + ' popupOpen=' + (!!(c && c.popup && c.popup.isOpen)));
  });
  after(1200, function(){
    var c = editor.completer;
    var vals = [];
    if (c && c.completions && c.completions.getAll) { vals = c.completions.getAll().map(function(x){return x.value;}); }
    else if (c && Array.isArray(c.completions)) { vals = c.completions.map(function(x){return x.value;}); }
    console.log('[[LIVE_LATE]] popupOpen=' + (!!(c && c.popup && c.popup.isOpen)) + ' completions=' + JSON.stringify(vals) + ' text=' + JSON.stringify(editor.getValue()));
  });
</script>
</body>
</html>
