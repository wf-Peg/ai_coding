<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据观测 - CutShelter</title>
  <link rel="stylesheet" href="styles/design-tokens.css">
  <link rel="stylesheet" href="styles/ui-common.css">
  <style>
    :root { --obs-bg: var(--app-bg, #f6f8fb); --obs-card: var(--app-surface, #fff); --obs-text: var(--app-text, #1f2937); --obs-muted: var(--app-text-secondary, #6b7280); --obs-border: var(--app-border, #e5e7eb); --obs-accent: var(--app-primary, #3f8cff); --obs-good: var(--app-success, #19a974); --obs-warn: var(--app-warning, #d98b18); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px; background: var(--obs-bg); color: var(--obs-text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
    .shell { max-width: 1180px; margin: 0 auto; }
    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 25px; letter-spacing: -.02em; }
    .subtitle { margin: 0; color: var(--obs-muted); }
    .actions { display: flex; align-items: center; gap: 10px; }
    button { border: 1px solid var(--obs-border); border-radius: 9px; padding: 9px 14px; color: var(--obs-text); background: var(--obs-card); cursor: pointer; font: inherit; transition: var(--app-duration-normal) ease; }
    button:hover { border-color: var(--obs-accent); color: var(--obs-accent); transform: translateY(-1px); }
    button.primary { border-color: var(--obs-accent); background: var(--obs-accent); color: #fff; }
    button:disabled { opacity: .55; cursor: wait; transform: none; }
    .status { min-height: 20px; color: var(--obs-muted); text-align: right; font-size: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat, .panel { border: 1px solid var(--obs-border); border-radius: 14px; background: var(--obs-card); box-shadow: 0 4px 18px rgba(20, 32, 55, .04); }
    .stat { padding: 17px; }
    .stat-label { color: var(--obs-muted); font-size: 12px; }
    .stat-value { margin-top: 5px; font-size: 25px; font-weight: 700; }
    .stat-note { color: var(--obs-muted); font-size: 11px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(310px, .85fr); gap: 16px; }
    .panel { padding: 20px; margin-bottom: 16px; }
    .panel h2 { display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; font-size: 16px; }
    .panel h2 small { color: var(--obs-muted); font-size: 11px; font-weight: 400; }
    .bar-row { display: grid; grid-template-columns: 96px minmax(60px, 1fr) 30px; align-items: center; gap: 9px; margin: 10px 0; }
    .bar-label { overflow: hidden; color: var(--obs-muted); text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 8px; overflow: hidden; border-radius: 99px; background: color-mix(in srgb, var(--obs-border) 70%, transparent); }
    .bar-fill { height: 100%; min-width: 4px; border-radius: inherit; background: linear-gradient(90deg, var(--obs-accent), #8b7cff); }
    .bar-count { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { padding: 22px 8px; color: var(--obs-muted); text-align: center; }
    .index-list { display: grid; gap: 9px; }
    .index-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; border: 1px solid var(--obs-border); border-radius: 10px; }
    .index-name { font-weight: 600; }
    .index-meta { color: var(--obs-muted); font-size: 11px; }
    .index-count { min-width: 42px; color: var(--obs-accent); text-align: right; font-size: 18px; font-weight: 700; }
    .event-list { display: grid; gap: 0; }
    .event { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--obs-border); }
    .event:last-child { border-bottom: 0; }
    .event-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--obs-good); }
    .event-type { font-weight: 600; }
    .event-detail, .event-time { color: var(--obs-muted); font-size: 11px; }
    .event-time { white-space: nowrap; }
    .callout { display: flex; align-items: flex-start; gap: 10px; padding: 13px; border-radius: 11px; background: color-mix(in srgb, var(--obs-accent) 9%, var(--obs-card)); color: var(--obs-muted); }
    .path { overflow: hidden; margin-top: 12px; padding: 9px 10px; border: 1px dashed var(--obs-border); border-radius: 8px; color: var(--obs-muted); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }

    /* ── 趋势面板 ── */
    .trends-stats { display: flex; gap: 16px; margin-bottom: 16px; }
    .trend-stat { flex: 1; }
    .trend-stat-label { display: block; color: var(--obs-muted); font-size: 11px; }
    .trend-stat-value { font-size: 22px; font-weight: 700; }
    .trend-warn { color: var(--obs-warn); }
    .trend-chart { display: flex; align-items: flex-end; gap: 3px; min-height: 120px; padding: 10px 0; }
    .trend-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .trend-day { color: var(--obs-muted); font-size: 9px; white-space: nowrap; margin-top: 4px; }
    .trend-track { width: 100%; max-width: 24px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; background: color-mix(in srgb, var(--obs-border) 50%, transparent); border-radius: 3px 3px 0 0; min-height: 4px; }
    .trend-fill { width: 100%; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--obs-accent), #8b7cff); transition: height var(--app-duration-slow) ease; min-height: 2px; }
    .trend-val { color: var(--obs-muted); font-size: 9px; font-variant-numeric: tabular-nums; }

    /* ── 工作台数据流 ── */
    .ws-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
    .ws-summary-item { text-align: center; padding: 10px 6px; border: 1px solid var(--obs-border); border-radius: 10px; }
    .ws-summary-label { display: block; color: var(--obs-muted); font-size: 11px; }
    .ws-summary-value { font-size: 20px; font-weight: 700; }
    .panel-section { margin-top: 12px; }
    .section-title { color: var(--obs-muted); font-size: 12px; margin-bottom: 6px; }

    /* ── 建议漏斗 ── */
    .funnel-summary { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-size: 12px; color: var(--obs-muted); }
    .funnel-body { display: grid; gap: 8px; }
    .funnel-row { display: grid; grid-template-columns: 52px minmax(50px, 1fr) 28px; align-items: center; gap: 9px; }
    .funnel-label { color: var(--obs-muted); font-size: 12px; }
    .funnel-track { height: 8px; overflow: hidden; border-radius: 99px; background: color-mix(in srgb, var(--obs-border) 70%, transparent); }
    .funnel-fill { display: block; height: 100%; min-width: 3px; border-radius: inherit; transition: width var(--app-duration-slow) ease; }
    .funnel-count { text-align: right; font-variant-numeric: tabular-nums; }

    /* ── 诊断摘要 ── */
    .diag-list { display: grid; gap: 6px; }
    .diag-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--obs-border); border-radius: 8px; }
    .diag-icon { width: 18px; text-align: center; font-size: 13px; }
    .diag-ok { color: var(--obs-good); }
    .diag-missing { color: var(--obs-warn); }
    .diag-info { flex: 1; min-width: 0; }
    .diag-name { font-weight: 600; font-size: 12px; }
    .diag-meta { color: var(--obs-muted); font-size: 10px; }
    .diag-time { color: var(--obs-muted); font-size: 10px; white-space: nowrap; }

    .diag-toggle { border:none; background:transparent; color:var(--obs-accent); cursor:pointer; font:inherit; font-size:12px; padding:4px 8px; border-radius:6px; transition:var(--app-duration-fast) ease; }
    .diag-toggle:hover { background:color-mix(in srgb, var(--obs-accent) 12%, transparent); }
    @media (max-width: 850px) { body { padding: 18px; } .stats { grid-template-columns: repeat(3, 1fr); } .grid { grid-template-columns: 1fr; } .ws-summary { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 520px) { .hero { display: block; } .actions { margin-top: 14px; } .stats { grid-template-columns: repeat(2, 1fr); } .bar-row { grid-template-columns: 76px minmax(40px, 1fr) 25px; } }
    html[data-theme="dark"] .stat, html[data-theme="dark"] .panel, html[data-theme="dark"] button { box-shadow: none; }

    /* ── 全局弹窗样式 ── */
    .obs-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:2000; }
    .obs-modal-content { background:var(--obs-card); border-radius:14px; width:90%; max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,0.18); animation:obsSlideIn var(--app-duration-slow) ease-out; }
    .obs-modal-header { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--obs-border); }
    .obs-modal-header h3 { margin:0; font-size:1.1rem; font-weight:600; color:var(--obs-text); }
    .obs-modal-close { background:transparent; border:none; color:var(--obs-muted); font-size:1.5rem; cursor:pointer; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:6px; transition:var(--app-duration-normal) ease; }
    .obs-modal-close:hover { color:var(--obs-text); background:color-mix(in srgb, var(--obs-border) 50%, transparent); }
    .obs-modal-body { padding:24px; }
    .obs-modal-body p { margin:0; font-size:0.95rem; line-height:1.6; color:var(--obs-text); }
    .obs-modal-footer { display:flex; gap:12px; justify-content:flex-end; padding:20px 24px; border-top:1px solid var(--obs-border); }
    .obs-modal-footer button { flex:1; min-width:120px; }
    .obs-btn-primary { border-color:var(--obs-accent); background:var(--obs-accent); color:#fff; border-radius:9px; padding:10px 20px; font-weight:600; cursor:pointer; transition:var(--app-duration-normal) ease; border:1px solid transparent; }
    .obs-btn-primary:hover { filter:brightness(1.1); transform:translateY(-1px); }
    .obs-btn-secondary { border:1px solid var(--obs-border); border-radius:9px; padding:10px 20px; background:var(--obs-card); color:var(--obs-text); font-weight:500; cursor:pointer; transition:var(--app-duration-normal) ease; }
    .obs-btn-secondary:hover { border-color:var(--obs-accent); color:var(--obs-accent); transform:translateY(-1px); }
    @keyframes obsSlideIn { from { opacity:0; transform:translateY(-16px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }

    /* ── 全局滚动条 ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--obs-border); border-radius: 999px; transition: background var(--app-duration-normal) ease; }
    ::-webkit-scrollbar-thumb:hover { background: var(--obs-muted); }
    * { scrollbar-width: thin; scrollbar-color: var(--obs-border) transparent; }

    /* ── 异常日志面板 ── */
    .exception-panel { margin-top: 16px; }
    .exception-stats { display: flex; gap: 12px; margin-bottom: 14px; }
    .exception-stat { flex: 1; padding: 12px; border: 1px solid var(--obs-border); border-radius: 10px; text-align: center; }
    .exception-stat-label { display: block; color: var(--obs-muted); font-size: 11px; margin-bottom: 4px; }
    .exception-stat-value { font-size: 22px; font-weight: 700; color: var(--obs-warn); }
    .exception-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .exception-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .exception-filters select, .exception-filters input { border: 1px solid var(--obs-border); border-radius: 7px; padding: 6px 10px; background: var(--obs-card); color: var(--obs-text); font: inherit; font-size: 12px; }
    .exception-filters input[type="date"] { width: 140px; }
    .exception-btn { border: 1px solid var(--obs-border); border-radius: 7px; padding: 6px 12px; background: var(--obs-card); color: var(--obs-text); cursor: pointer; font: inherit; font-size: 12px; transition: var(--app-duration-fast) ease; }
    .exception-btn:hover { border-color: var(--obs-accent); color: var(--obs-accent); }
    .exception-btn-danger { color: var(--obs-warn); }
    .exception-btn-danger:hover { border-color: var(--obs-warn); color: var(--obs-warn); }
    .exception-trend { display: flex; align-items: flex-end; gap: 3px; min-height: 50px; margin-bottom: 12px; padding: 6px 0; }
    .exception-trend-bar { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .exception-trend-label { color: var(--obs-muted); font-size: 9px; margin-top: 2px; white-space: nowrap; }
    .exception-trend-track { width: 100%; max-width: 20px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; background: color-mix(in srgb, var(--obs-border) 50%, transparent); border-radius: 2px 2px 0 0; min-height: 3px; }
    .exception-trend-fill { width: 100%; border-radius: 2px 2px 0 0; background: var(--obs-warn); transition: height var(--app-duration-slow) ease; }
    .exception-trend-count { color: var(--obs-muted); font-size: 9px; }
    .exception-list { display: grid; gap: 4px; max-height: 400px; overflow-y: auto; }
    .exception-item { display: grid; grid-template-columns: 60px 60px 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--obs-border); border-radius: 8px; cursor: pointer; transition: var(--app-duration-fast) ease; }
    .exception-item:hover { border-color: var(--obs-accent); background: color-mix(in srgb, var(--obs-accent) 5%, var(--obs-card)); }
    .exception-item-time { color: var(--obs-muted); font-size: 11px; font-family: ui-monospace, monospace; }
    .exception-item-source { font-size: 11px; font-weight: 600; color: var(--obs-accent); }
    .exception-item-level { font-size: 11px; font-weight: 700; }
    .exception-item-level-ERROR { color: var(--obs-warn); }
    .exception-item-level-WARN { color: var(--obs-warn); opacity: .7; }
    .exception-item-message { overflow: hidden; color: var(--obs-text); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .exception-empty { padding: 20px 8px; color: var(--obs-muted); text-align: center; font-size: 12px; }
    .exception-pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
    .exception-page-btn { border: 1px solid var(--obs-border); border-radius: 6px; padding: 4px 10px; background: var(--obs-card); color: var(--obs-text); cursor: pointer; font-size: 12px; transition: var(--app-duration-fast) ease; }
    .exception-page-btn:hover { border-color: var(--obs-accent); color: var(--obs-accent); }
    .exception-page-btn:disabled { opacity: .4; cursor: default; }
    .exception-page-info { color: var(--obs-muted); font-size: 11px; }

    /* ── 异常详情弹窗 ── */
    .exception-detail-content { max-height: 60vh; overflow-y: auto; }
    .exception-detail-field { margin-bottom: 12px; }
    .exception-detail-field label { display: block; color: var(--obs-muted); font-size: 11px; margin-bottom: 3px; }
    .exception-detail-field .value { font-size: 12px; line-height: 1.5; word-break: break-all; }
    .exception-detail-stack { background: color-mix(in srgb, var(--obs-border) 30%, transparent); border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; }
  </style>
    <script src="js/theme-core.js"></script>
    <script src="js/theme-bridge.js"></script>
    <script>(function(){var b=window.CutShelterThemeBridge;b.init({root:document.documentElement});b.listen();})();</script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div><h1>数据观测</h1><p class="subtitle">看见你的整理节奏，让建议有据可依。</p></div>
      <div><div class="actions"><button id="refreshBtn" title="重新加载所有观测数据">刷新数据</button><button class="primary" id="rebuildBtn" title="扫描业务目录，重建内容索引文件">重建内容索引</button><button id="pruneBtn" title="清理 90 天前的本地事件记录">清理旧事件</button></div><div class="status" id="status"></div></div>
    </header>
    <section class="stats" id="stats"></section>
    <div class="grid">
      <div>
        <section class="panel"><h2>索引健康 <small>业务数据仍是唯一真相</small></h2><div class="index-list" id="indexList"></div><div class="path" id="indexPath">索引目录读取中…</div></section>
        <section class="panel" id="diagnosisPanel">
          <h2>诊断摘要 <small>索引文件状态</small> <button id="diagnosisToggle" class="diag-toggle" data-collapsed="true">展开诊断摘要</button></h2>
          <div id="diagnosisContent" style="display:none;"><div class="empty">加载中…</div></div>
        </section>
      </div>
      <div>
        <section class="panel" id="workspacePanel"><h2>工作台数据流 <small>内容来源分布 + 建议漏斗</small></h2><div class="empty">加载中…</div></section>
        <section class="panel"><h2>事件趋势 <small>近 7 / 30 天</small></h2><div id="trendsSection"><div class="trends-stats"><div class="trend-stat"><span class="trend-stat-label">近 7 天</span><span class="trend-stat-value">-</span></div><div class="trend-stat"><span class="trend-stat-label">近 30 天</span><span class="trend-stat-value">-</span></div><div class="trend-stat"><span class="trend-stat-label">跳过行</span><span class="trend-stat-value">-</span></div></div></div><div id="trendChart7d"></div><div id="trendChart30d"></div><div class="panel-section"><div class="section-title">事件类型分布</div><div id="typeDistribution"></div></div><div class="panel-section"><div class="section-title">事件来源分布</div><div id="sourceDistribution"></div></div></section>
      </div>
    </div>

    <!-- ── 异常日志面板 ── -->
    <section class="panel exception-panel" id="exceptionLogPanel">
      <h2>异常日志 <small>统一记录三端异常，便于排查</small></h2>
      <div class="exception-stats" id="exceptionStats">
        <div class="exception-stat"><span class="exception-stat-label">今日异常</span><span class="exception-stat-value" id="todayCount">-</span></div>
        <div class="exception-stat"><span class="exception-stat-label">近7天</span><span class="exception-stat-value" id="weekCount">-</span></div>
        <div class="exception-stat"><span class="exception-stat-label">总计</span><span class="exception-stat-value" id="totalCount">-</span></div>
      </div>
      <div class="exception-controls">
        <div class="exception-filters">
          <select id="filterSource"><option value="">全部来源</option><option value="backend">后端</option><option value="electron">Electron</option><option value="frontend">前端</option></select>
          <select id="filterLevel"><option value="">全部级别</option><option value="ERROR">ERROR</option><option value="WARN">WARN</option></select>
          <input type="date" id="filterDate" title="按日期筛选">
          <button id="exceptionRefreshBtn" class="exception-btn" title="刷新异常日志">刷新</button>
        </div>
        <div class="exception-actions">
          <button id="exceptionPruneBtn" class="exception-btn exception-btn-danger" title="清理 90 天前的异常日志">清理旧日志</button>
        </div>
      </div>
      <div class="exception-trend" id="exceptionTrendChart"></div>
      <div class="exception-list" id="exceptionList">
        <div class="exception-empty">暂无异常日志。</div>
      </div>
      <div class="exception-pagination" id="exceptionPagination"></div>
    </section>
  </main>
  <!-- 确认弹窗 -->
  <div id="confirmModal" class="obs-modal" style="display:none;">
    <div class="obs-modal-content">
      <div class="obs-modal-header">
        <h3>确认操作</h3>
        <button class="obs-modal-close" id="confirmCloseBtn">&times;</button>
      </div>
      <div class="obs-modal-body">
        <p id="confirmMessage">确定要清理 90 天前的事件数据？此操作不可撤销。</p>
      </div>
      <div class="obs-modal-footer">
        <button class="obs-btn-secondary" id="confirmCancelBtn">取消</button>
        <button class="obs-btn-primary" id="confirmOkBtn">确认</button>
      </div>
    </div>
  </div>
  <!-- 异常详情弹窗 -->
  <div id="exceptionDetailModal" class="obs-modal" style="display:none;">
    <div class="obs-modal-content">
      <div class="obs-modal-header">
        <h3>异常详情</h3>
        <button class="obs-modal-close" id="exceptionDetailCloseBtn">&times;</button>
      </div>
      <div class="obs-modal-body">
        <div class="exception-detail-content" id="exceptionDetailContent"></div>
      </div>
      <div class="obs-modal-footer">
        <button class="obs-btn-secondary" id="exceptionDetailCloseBtn2">关闭</button>
      </div>
    </div>
  </div>
  <script src="js/logger.js"></script>
  <script src="js/scroll-restore.js"></script>
  <script>
    // 接收主框架消息：后端就绪后自动刷新数据
    window.addEventListener('message', (e) => {
      if (e.data && e.data.action === 'refresh') location.reload();
      if (e.data && e.data.action === 'hardRefresh') {
        CutShelterScroll.capture(e.data.module || 'data-observability');
        location.reload();
      }
    });
  </script>
  <script src="js/data-observability.js"></script>
  <script src="js/ui-common.js"></script>
</body>
</html>
