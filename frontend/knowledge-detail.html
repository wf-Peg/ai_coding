<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识详情</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/design-tokens.css">
    <link rel="stylesheet" href="styles/ui-common.css">
    <style>
        :root {
            --primary: var(--app-primary);
            --primary-dark: var(--app-primary-hover);
            --background: var(--app-bg);
            --surface: var(--app-surface);
            --text: var(--app-text);
            --text-secondary: var(--app-text-secondary);
            --text-muted: var(--app-text-muted);
            --border: var(--app-border);
            --radius: var(--app-radius);
            --shadow: var(--app-shadow-sm);
            --transition: var(--app-duration-normal) var(--app-ease-smooth);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* Nav */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav .back-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .nav .back-btn:hover { background: var(--border); }
        .nav .title {
            font-size: 1.1rem;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav .btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .nav .btn:hover { background: var(--border); }
        .nav .btn.danger { color: #ef4444; border-color: #fecaca; }
        .nav .btn.danger:hover { background: #fef2f2; }

        /* Content */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
        }
        .topic-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .topic-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .topic-meta .tag {
            padding: 4px 12px;
            border-radius: 16px;
            background: var(--app-primary-soft);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 500;
        }
        .topic-meta .date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .topic-summary {
            background: var(--app-primary-soft);
            border-left: 4px solid var(--primary);
            padding: 16px 20px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-bottom: 32px;
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        /* Markdown Content */
        .topic-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            line-height: 1.8;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .topic-content h1 { font-size: 1.6rem; margin: 1.2em 0 0.6em; }
        .topic-content h2 { font-size: 1.4rem; margin: 1.1em 0 0.5em; }
        .topic-content h3 { font-size: 1.2rem; margin: 1em 0 0.4em; }
        .topic-content p { margin: 0.8em 0; }
        .topic-content ul, .topic-content ol { margin: 0.8em 0; padding-left: 1.5em; }
        .topic-content li { margin: 0.3em 0; }
        .topic-content code {
            background: var(--app-surface-subtle);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }
        .topic-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 1em 0;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .topic-content pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }
        .topic-content blockquote {
            border-left: 4px solid var(--primary);
            padding: 8px 16px;
            margin: 1em 0;
            background: var(--app-surface-subtle);
            color: var(--text-secondary);
        }
        .topic-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        .topic-content th, .topic-content td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }
        .topic-content th { background: var(--app-surface-subtle); font-weight: 600; }
        .topic-content img { max-width: 100%; border-radius: var(--radius-sm); }
        .topic-content a { color: var(--primary); text-decoration: underline; }
        .topic-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }

        /* Wikilink 样式 — Obsidian 风格 */
        .wikilink {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px dashed var(--primary);
            padding: 0 2px;
            border-radius: 2px;
            transition: all var(--app-duration-fast) ease;
            cursor: pointer;
        }
        .wikilink:hover {
            background: rgba(63, 140, 255, 0.08);
            border-bottom-style: solid;
        }
        .wikilink::before {
            content: "[[";
            color: var(--text-muted);
            font-size: 0.85em;
            opacity: 0.5;
        }
        .wikilink::after {
            content: "]]";
            color: var(--text-muted);
            font-size: 0.85em;
            opacity: 0.5;
        }

        /* Loading */
        .loading { text-align: center; padding: 60px; color: var(--text-muted); }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .radius-sm { border-radius: 8px; }

        /* ===== 来源剪藏 & 关联知识 ===== */
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-top: 24px;
        }
        .clip-item {
            padding: 12px 16px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .clip-item:hover {
            border-color: var(--primary);
            color: var(--text);
        }
        .clip-item:last-child { margin-bottom: 0; }
    .clip-item-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .clip-item-site {
      font-size: 0.72rem;
      color: var(--primary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .clip-item-summary {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link-item {
            padding: 8px 0;
            font-size: 0.9rem;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            transition: var(--transition);
        }
        .link-item:hover { color: var(--primary-dark); }
        .section-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 16px 0;
            font-size: 0.9rem;
        }
        .section-empty small {
            display: block;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .section-empty code {
            background: var(--app-surface-subtle);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        .graph-link-row {
            text-align: center;
            padding: 12px 0 4px;
            margin-top: 8px;
            border-top: 1px dashed var(--border);
        }

        /* 深色主题 - 剪藏弹窗 */




                @media (max-width: 768px) {
            .container { padding: 16px; }
            .topic-title { font-size: 1.4rem; }
            .nav .actions { gap: 4px; }
            .nav .btn { padding: 4px 10px; font-size: 0.75rem; }
        }

                /* ===== Obsidian 风格全局滚动条 ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 999px; transition: background var(--app-duration-normal) ease; }
        ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }
        * { scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }






    /* confirm dialog */
    .confirm-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .clip-preview-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); z-index: 2100;
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn var(--app-duration-normal) ease;
    }
    .clip-preview-modal {
      width: min(640px, 92vw);
      max-height: 82vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      display: flex; flex-direction: column;
      overflow: hidden;
      animation: clipPreviewIn var(--app-duration-panel) ease;
    }
    .clip-preview-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .clip-preview-header h4 { font-size: 1rem; font-weight: 600; flex: 1; margin-right: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clip-preview-close {
      background: none; border: none; font-size: 1.1rem; cursor: pointer;
      color: var(--text-muted); padding: 4px 8px; border-radius: 6px; line-height: 1;
      transition: var(--transition);
    }
    .clip-preview-close:hover { background: var(--border); color: var(--text); }
    .clip-preview-meta {
      padding: 10px 20px 0; font-size: 0.78rem; color: var(--text-muted);
      min-height: 22px;
    }
    .clip-preview-body {
      flex: 1; overflow-y: auto; padding: 12px 20px 16px;
    }
    .clip-preview-content {
      font-family: inherit; font-size: 0.88rem; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
      color: var(--text-secondary); margin: 0;
    }
    .clip-preview-empty {
      color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 32px 0;
    }
    .clip-preview-footer {
      display: flex; gap: 10px; justify-content: flex-end;
      padding: 14px 20px; border-top: 1px solid var(--border);
    }
    .clip-preview-btn {
      padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px;
      background: var(--surface); color: var(--text-secondary); font-size: 0.85rem;
      cursor: pointer; transition: var(--transition);
    }
    .clip-preview-btn:hover { border-color: var(--primary); color: var(--primary); }
    .clip-preview-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .clip-preview-btn.primary:hover { background: var(--primary-dark); color: #fff; }
    .clip-preview-btn.link { color: var(--primary); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes clipPreviewIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
    .confirm-dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 380px; width: 90%; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
    .confirm-dialog p { font-size: 14px; color: var(--text); margin-bottom: 20px; line-height: 1.5; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .confirm-btn { padding: 8px 20px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; background: var(--surface); color: var(--text-secondary); transition: all var(--app-duration-fast); }
    .confirm-btn:hover { border-color: var(--text-secondary); color: var(--text); }
    .confirm-btn.danger { background: #ef4444; color: #fff; border-color: #ef4444; }
    .confirm-btn.danger:hover { background: #dc2626; }

    /* toast */
    .toast { position: fixed; top: 20px; right: 20px; background: var(--surface); color: var(--text); padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border); z-index: 3000; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); animation: toastSlideIn var(--app-duration-slow) ease-out; }
    @keyframes toastSlideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastSlideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(30px); } }

    /* ===== 讨论区域 ===== */
    .comments-section {
        max-width: 800px;
        margin: 40px auto 0;
        padding: 24px;
    }
    .comments-section .section-title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 16px;
        color: var(--text);
    }
    .comments-list {
        margin-bottom: 24px;
    }
    .comment-item {
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
    }
    .comment-item:last-child {
        border-bottom: none;
    }
    .comment-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
    }
    .comment-author {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text);
    }
    .comment-time {
        font-size: 0.8rem;
        color: var(--text-muted);
    }
    .comment-body {
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--text);
        word-break: break-word;
    }
    .comment-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }
    .comment-actions .action-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.8rem;
        color: var(--text-muted);
        padding: 2px 8px;
        border-radius: 4px;
        transition: all var(--app-duration-fast);
    }
    .comment-actions .action-btn:hover {
        background: var(--surface);
        color: var(--text);
    }
    .comment-actions .action-btn.danger:hover {
        background: #fef2f2;
        color: #ef4444;
    }


    .comment-edit-textarea {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.95rem;
        font-family: inherit;
        background: var(--background);
        color: var(--text);
        outline: none;
        resize: vertical;
        min-height: 60px;
        box-sizing: border-box;
        transition: var(--transition);
    }
    .comment-edit-textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(63,140,255,0.1);
    }
    .comment-edit-actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
    }
    .comment-edit-actions .save-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 4px 16px;
        border-radius: 12px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: var(--transition);
    }
    .comment-edit-actions .save-btn:hover {
        background: var(--primary-dark);
    }
    .comment-edit-actions .cancel-btn {
        background: none;
        border: 1px solid var(--border);
        padding: 4px 16px;
        border-radius: 12px;
        font-size: 0.8rem;
        cursor: pointer;
        color: var(--text-secondary);
        transition: all var(--app-duration-fast);
    }
    .comment-edit-actions .cancel-btn:hover {
        border-color: var(--text-secondary);
        color: var(--text);
    }
    .comment-body .edited-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-left: 4px;
    }
    .comment-form {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
    }
    .comment-form input,
    .comment-form textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        font-family: inherit;
        background: var(--background);
        color: var(--text);
        margin-bottom: 12px;
        outline: none;
        transition: var(--transition);
        box-sizing: border-box;
    }
    .comment-form input:focus,
    .comment-form textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(63,140,255,0.1);
    }
    .comment-form textarea {
        resize: vertical;
        min-height: 80px;
    }
    .comment-form .submit-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 20px;
        font-size: 0.9rem;
        cursor: pointer;
        transition: var(--transition);
    }
    .comment-form .submit-btn:hover {
        background: var(--primary-dark);
    }
    .comment-form .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .comment-empty {
        text-align: center;
        color: var(--text-muted);
        padding: 32px 0;
        font-size: 0.9rem;
    }

    /* 深色主题 - 讨论 */

    <script>
      (function() {
        const THEME_KEY = 'app_theme_v1';
        const APPEARANCE_KEY = 'app_appearance_v1';
        function getEffective() {
          const app = localStorage.getItem(APPEARANCE_KEY) || 'notion';
          if (app === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'notion';
          return app;
        }
        function apply() {
          const t = getEffective();
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : (t === 'regular' ? 'regular' : 'notion'));
        }
        window.applyTheme = apply;
        apply();
        window.addEventListener('storage', function(e) {
          if (e.key === THEME_KEY || e.key === APPEARANCE_KEY) apply();
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
          if ((localStorage.getItem(APPEARANCE_KEY) || 'notion') === 'system') apply();
        });
      })();
    </script>
