<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话题详情</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3f8cff;
            --primary-dark: #2f72d8;
            --background: #f9fafb;
            --surface: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --transition: all 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* Nav */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav .back-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .nav .back-btn:hover { background: var(--border); }
        .nav .title {
            font-size: 1.1rem;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav .btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .nav .btn:hover { background: var(--border); }
        .nav .btn.danger { color: #ef4444; border-color: #fecaca; }
        .nav .btn.danger:hover { background: #fef2f2; }

        /* Content */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
        }
        .cover-image {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 200px;
        }
        .cover-placeholder {
            width: 100%;
            height: 240px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .topic-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .topic-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .topic-meta .tag {
            padding: 4px 12px;
            border-radius: 16px;
            background: #eff6ff;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 500;
        }
        .topic-meta .date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .topic-summary {
            background: #f0f7ff;
            border-left: 4px solid var(--primary);
            padding: 16px 20px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-bottom: 32px;
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        /* Markdown Content */
        .topic-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            line-height: 1.8;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .topic-content h1 { font-size: 1.6rem; margin: 1.2em 0 0.6em; }
        .topic-content h2 { font-size: 1.4rem; margin: 1.1em 0 0.5em; }
        .topic-content h3 { font-size: 1.2rem; margin: 1em 0 0.4em; }
        .topic-content p { margin: 0.8em 0; }
        .topic-content ul, .topic-content ol { margin: 0.8em 0; padding-left: 1.5em; }
        .topic-content li { margin: 0.3em 0; }
        .topic-content code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }
        .topic-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 1em 0;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .topic-content pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }
        .topic-content blockquote {
            border-left: 4px solid var(--primary);
            padding: 8px 16px;
            margin: 1em 0;
            background: #f8fafc;
            color: var(--text-secondary);
        }
        .topic-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        .topic-content th, .topic-content td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }
        .topic-content th { background: #f8fafc; font-weight: 600; }
        .topic-content img { max-width: 100%; border-radius: var(--radius-sm); }
        .topic-content a { color: var(--primary); text-decoration: underline; }
        .topic-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }

        /* Loading */
        .loading { text-align: center; padding: 60px; color: var(--text-muted); }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .radius-sm { border-radius: 8px; }

        /* Notion 主题 */
        html[data-theme="notion"] {
            --primary: #2383e2;
            --primary-dark: #1f76c9;
            --background: #f7f7f5;
            --surface: #ffffff;
            --text: #2f3437;
            --text-secondary: #6b6f76;
            --text-muted: #8a8f98;
            --border: #e8e8e6;
            --shadow: 0 1px 0 rgba(15,23,42,0.03), 0 8px 20px rgba(15,23,42,0.04);
        }
        html[data-theme="notion"] .nav {
            border-bottom-color: #e8e8e6;
        }
        html[data-theme="notion"] .nav .back-btn {
            border-color: #dcdcd8;
            color: #6b6f76;
        }
        html[data-theme="notion"] .nav .back-btn:hover { background: #f1f1ef; }
        html[data-theme="notion"] .nav .btn {
            border-color: #dcdcd8;
            color: #6b6f76;
        }
        html[data-theme="notion"] .nav .btn:hover { background: #f1f1ef; }
        html[data-theme="notion"] .nav .btn.danger { color: #e03e3e; border-color: #f5d0d0; }
        html[data-theme="notion"] .nav .btn.danger:hover { background: #fdeeee; }
        html[data-theme="notion"] .topic-summary {
            background: #f1f1ef;
            border-left-color: #2383e2;
            color: #6b6f76;
        }
        html[data-theme="notion"] .topic-content {
            border-color: #e8e8e6;
        }
        html[data-theme="notion"] .topic-content code {
            background: #f1f1ef;
        }
        html[data-theme="notion"] .topic-content blockquote {
            background: #f7f7f5;
            border-left-color: #2383e2;
            color: #6b6f76;
        }
        html[data-theme="notion"] .topic-content th {
            background: #f7f7f5;
        }
        html[data-theme="notion"] .topic-content td,
        html[data-theme="notion"] .topic-content th {
            border-color: #e8e8e6;
        }
        html[data-theme="notion"] .topic-meta .tag {
            background: #f1f1ef;
            color: #5f646c;
        }
        html[data-theme="notion"] .loading .spinner {
            border-color: #e8e8e6;
            border-top-color: #2383e2;
        }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .topic-title { font-size: 1.4rem; }
            .nav .actions { gap: 4px; }
            .nav .btn { padding: 4px 10px; font-size: 0.75rem; }
        }

        /* 深色主题 */
        html[data-theme="dark"] {
            --primary: #569cff;
            --primary-dark: #4a8ae8;
            --background: #1e1e1e;
            --surface: #2d2d2d;
            --text: #d4d4d4;
            --text-secondary: #9a9a9a;
            --text-muted: #6a6a6a;
            --border: #3e3e3e;
        }
        html[data-theme="dark"] body { background: var(--background); color: var(--text); }
        html[data-theme="dark"] .nav { background: var(--surface); border-bottom-color: var(--border); }
        html[data-theme="dark"] .nav .back-btn { border-color: var(--border); color: var(--text-secondary); }
        html[data-theme="dark"] .nav .back-btn:hover { background: #3a3a3a; }
        html[data-theme="dark"] .nav .btn { background: var(--surface); border-color: var(--border); color: var(--text-secondary); }
        html[data-theme="dark"] .nav .btn:hover { background: #3a3a3a; }
        html[data-theme="dark"] .nav .btn.danger { color: #e06060; border-color: #5a2020; }
        html[data-theme="dark"] .nav .btn.danger:hover { background: #3a1a1a; }
        html[data-theme="dark"] .topic-summary {
            background: #2a2d3a;
            border-left-color: var(--primary);
            color: var(--text-secondary);
        }
        html[data-theme="dark"] .topic-content {
            background: var(--surface);
            border-color: var(--border);
        }
        html[data-theme="dark"] .topic-content code { background: #3a3a3a; color: #d4d4d4; }
        html[data-theme="dark"] .topic-content blockquote { background: #252525; border-left-color: var(--primary); color: var(--text-secondary); }
        html[data-theme="dark"] .topic-content th { background: #252525; }
        html[data-theme="dark"] .topic-content td, html[data-theme="dark"] .topic-content th { border-color: var(--border); }
        html[data-theme="dark"] .topic-meta .tag { background: #3a3a3a; color: var(--text-secondary); }
        html[data-theme="dark"] .section { background: var(--surface); border-color: var(--border); }
        html[data-theme="dark"] .clip-item { background: #3a3a3a; border-color: var(--border); }
        html[data-theme="dark"] .loading { color: var(--text-muted); }
        html[data-theme="dark"] .spinner { border-color: var(--border); border-top-color: var(--primary); }
    </style>
</head>
<body>
    <nav class="nav">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <span class="title" id="navTitle">加载中...</span>
        <div class="actions">
            <button class="btn" id="openFolderBtn" title="打开文件存储目录">📂 打开目录</button>
            <button class="btn" id="exportPdfBtn" title="导出全页截图">📸 导出截图</button>
            <button class="btn" id="editBtn">编辑</button>
            <button class="btn danger" id="deleteBtn">删除</button>
        </div>
    </nav>

    <div class="container" id="detailContainer">
        <div class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </div>

    <script src="libs/marked.min.js"></script>
    <script src="libs/html2canvas.min.js"></script>
    <script src="topic-detail.js"></script>
    <script>
      (function() {
        const THEME_KEY = 'app_theme_v1';
        const APPEARANCE_KEY = 'app_appearance_v1';
        function getEffective() {
          const app = localStorage.getItem(APPEARANCE_KEY) || 'notion';
          if (app === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'notion';
          return app;
        }
        function apply() {
          const t = getEffective();
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : (t === 'regular' ? 'regular' : 'notion'));
        }
        apply();
        window.addEventListener('storage', function(e) {
          if (e.key === THEME_KEY || e.key === APPEARANCE_KEY) apply();
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
          if ((localStorage.getItem(APPEARANCE_KEY) || 'notion') === 'system') apply();
        });
      })();
    </script>
</body>
</html>
