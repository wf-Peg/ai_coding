<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 - CutShelter</title>
  <link rel="stylesheet" href="styles/design-tokens.css">
  <script src="libs/chart.umd.min.js" defer></script>
  <style>
    :root { --ws-bg: var(--app-bg); --ws-surface: var(--app-surface); --ws-subtle: var(--app-surface-subtle); --ws-border: var(--app-border); --ws-text: var(--app-text); --ws-muted: var(--app-text-secondary); --ws-faint: var(--app-text-muted); --ws-primary: var(--app-primary); --ws-primary-soft: var(--app-primary-soft); --ws-danger: var(--app-danger); --ws-danger-soft: var(--app-danger-soft); }
    * { box-sizing: border-box; }
    body { min-width: 0; margin: 0; background: var(--ws-bg); color: var(--ws-text); font: 14px/1.55 var(--app-font); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    input, select, textarea { outline: none; }
    a { color: var(--ws-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Shell ── */
    .shell { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar { width: 240px; flex: none; display: flex; flex-direction: column; max-height: 100vh; border-right: 1px solid var(--ws-border); background: var(--ws-surface); }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 18px 14px; }
    .sidebar-header h1 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .sidebar-collapse { display: none; width: 30px; height: 30px; align-items: center; justify-content: center; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-surface); color: var(--ws-muted); font-size: 16px; transition: all .16s ease; }
    .sidebar-collapse:hover { border-color: var(--ws-primary); color: var(--ws-primary); }
    .sidebar-nav { padding: 6px 10px; }
    .sidebar-nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; border-radius: var(--app-radius); background: transparent; color: var(--ws-muted); font-size: 14px; text-align: left; transition: all .16s ease; }
    .sidebar-nav-item:hover { background: var(--ws-subtle); color: var(--ws-text); }
    .sidebar-nav-item.active { background: var(--ws-primary-soft); color: var(--ws-primary); font-weight: 600; }
    .sidebar-nav-item .icon { flex: none; width: 18px; text-align: center; font-size: 15px; }
    .sidebar-divider { height: 1px; margin: 6px 14px; background: var(--ws-border); }
    .sidebar-section { padding: 10px 10px 4px; font-size: 11px; font-weight: 700; color: var(--ws-faint); letter-spacing: .06em; text-transform: uppercase; }
    .sidebar-list { flex: 1; overflow-y: auto; padding: 2px 10px; }
    .sidebar-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; border-radius: var(--app-radius); background: transparent; color: var(--ws-text); font-size: 14px; text-align: left; transition: all .16s ease; }
    .sidebar-item:hover { background: var(--ws-subtle); }
    .sidebar-item.active { background: var(--ws-primary-soft); color: var(--ws-primary); font-weight: 600; }
    .sidebar-item .ws-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ws-primary); }
    .sidebar-item .ws-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-item .ws-type-tag { flex: none; font-size: 9px; color: var(--ws-faint); padding: 1px 5px; border: 1px solid var(--ws-border); border-radius: 4px; margin-left: auto; }
    .sidebar-footer { padding: 10px; border-top: 1px solid var(--ws-border); }
    .sidebar-footer .new-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border: 1px dashed var(--ws-border); border-radius: var(--app-radius); background: transparent; color: var(--ws-muted); font-size: 13px; transition: all .16s ease; }
    .sidebar-footer .new-btn:hover { border-color: var(--ws-primary); color: var(--ws-primary); background: var(--ws-primary-soft); }
    .sidebar-footer .new-btn .icon { font-size: 16px; font-weight: 700; }
    .sidebar-backdrop { display: none; }

    /* ── Main area ── */
    .main-area { flex: 1; min-width: 0; overflow-y: auto; }

    /* ── Overview View ── */
    .overview-view { display: block; }
    .overview-view.hidden { display: none; }
    .overview-view .shell-inner { width: min(1180px, 100%); margin: 0 auto; padding: 32px; }
    .hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 8px; color: var(--ws-primary); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .hero h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); line-height: 1.2; letter-spacing: -.035em; }
    .subtitle { max-width: 620px; margin: 10px 0 0; color: var(--ws-muted); }
    .refresh { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 9px 13px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-surface); color: var(--ws-text); transition: border-color .16s ease, color .16s ease, transform .16s ease; position: relative; }
    .refresh:hover { border-color: var(--ws-primary); color: var(--ws-primary); transform: translateY(-1px); }
    .refresh:disabled { cursor: wait; opacity: .6; transform: none; }
    .refresh-info { position: absolute; top: calc(100% + 6px); right: 0; padding: 6px 10px; border-radius: 6px; background: var(--ws-surface); border: 1px solid var(--ws-border); box-shadow: 0 4px 12px rgba(0,0,0,.1); font-size: 12px; color: var(--ws-muted); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 10; }
    .refresh-info.show { opacity: 1; }
    .refresh-info.success { color: var(--app-success); border-color: var(--app-success); }
    .refresh-info.error { color: var(--ws-danger); border-color: var(--ws-danger); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; align-items: start; gap: 20px; }
    .content-panel, .project-panel { overflow: hidden; border: 1px solid var(--ws-border); border-radius: var(--app-radius-lg); background: var(--ws-surface); box-shadow: var(--app-shadow); }
    .content-panel { min-height: 500px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 20px 22px 16px; border-bottom: 1px solid var(--ws-border); }
    .toolbar-title { margin: 0; font-size: 16px; }
    .result-count { margin-left: 8px; color: var(--ws-faint); font-size: 12px; font-weight: 400; }
    .search { position: relative; flex: 0 1 260px; }
    .search svg { position: absolute; top: 50%; left: 11px; width: 16px; height: 16px; color: var(--ws-faint); transform: translateY(-50%); pointer-events: none; }
    .search input { width: 100%; padding: 9px 11px 9px 35px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-subtle); color: var(--ws-text); transition: border-color .16s ease, box-shadow .16s ease; }
    .search input:focus { border-color: var(--ws-primary); box-shadow: 0 0 0 3px var(--ws-primary-soft); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 22px; border-bottom: 1px solid var(--ws-border); background: color-mix(in srgb, var(--ws-subtle) 55%, transparent); }
    .filter { padding: 5px 10px; border: 1px solid var(--ws-border); border-radius: 999px; background: transparent; color: var(--ws-muted); font-size: 12px; transition: all .16s ease; }
    .filter:hover { border-color: var(--ws-primary); color: var(--ws-primary); }
    .filter.active { border-color: var(--ws-primary); background: var(--ws-primary-soft); color: var(--ws-primary); font-weight: 600; }
    .list { display: grid; }
    .item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 13px; align-items: start; padding: 17px 22px; border-bottom: 1px solid var(--ws-border); }
    .item:last-child { border-bottom: 0; }
    .type-mark { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 9px; background: var(--ws-primary-soft); color: var(--ws-primary); font-size: 11px; font-weight: 700; }
    .type-mark[data-type="todo"] { background: color-mix(in srgb, var(--app-success) 12%, transparent); color: var(--app-success); }
    .type-mark[data-type="knowledge"] { background: color-mix(in srgb, var(--app-warning) 13%, transparent); color: var(--app-warning); }
    .type-mark[data-type="learning-plan"] { background: color-mix(in srgb, #876de2 14%, transparent); color: #7657cf; }
    .item-body { min-width: 0; }
    .item-title { margin: 0; overflow: hidden; font-size: 14px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { display: flex; flex-wrap: wrap; gap: 7px 10px; margin-top: 5px; color: var(--ws-muted); font-size: 12px; }
    .tag { color: var(--ws-faint); }
    .item-date { padding-top: 4px; color: var(--ws-faint); font-size: 11px; white-space: nowrap; }
    .item-actions { display: flex; align-items: center; gap: 6px; }
    .project-panel { position: sticky; top: 16px; }
    .panel-heading { padding: 19px 18px 14px; border-bottom: 1px solid var(--ws-border); }
    .panel-heading h2 { margin: 0; font-size: 15px; }
    .panel-heading p { margin: 5px 0 0; color: var(--ws-muted); font-size: 12px; }
    .ws-summary-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 14px; }
    .ws-summary-card { text-align: center; padding: 8px 4px; border: 1px solid var(--ws-border); border-radius: 8px; }
    .ws-summary-card .ws-card-value { font-size: 18px; font-weight: 700; color: var(--ws-accent); }
    .ws-summary-card .ws-card-label { font-size: 10px; color: var(--ws-faint); margin-top: 2px; }
    .ws-summary-card.archived .ws-card-value { color: var(--ws-faint); }
    .projects { display: grid; gap: 0; }
    .project { padding: 15px 18px; border-bottom: 1px solid var(--ws-border); }
    .project:last-child { border-bottom: 0; }
    .project-name { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; }
    .project-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--project-color, var(--ws-primary)); }
    .project-description { display: -webkit-box; margin: 5px 0 0 16px; overflow: hidden; color: var(--ws-muted); font-size: 12px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .project-status { margin: 7px 0 0 16px; color: var(--ws-faint); font-size: 11px; }

    /* ── Detail View ── */
    .detail-view { display: none; }
    .detail-view.visible { display: block; }
    .detail-view .shell-inner { width: min(1180px, 100%); margin: 0 auto; padding: 32px; }
    /* ── Detail header ── */
    .detail-header { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
    .detail-header-left { display: flex; align-items: center; gap: 14px; }
    .detail-color { width: 18px; height: 18px; border-radius: 50%; flex: none; }
    .detail-info h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    .detail-info .detail-type { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; background: var(--ws-subtle); color: var(--ws-muted); font-size: 11px; }
    .detail-info .detail-desc { margin: 6px 0 0; font-size: 13px; color: var(--ws-muted); line-height: 1.5; max-width: 480px; }
    .detail-stats { display: flex; flex-wrap: wrap; gap: 8px; }
    .stat-badge { padding: 6px 12px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-surface); font-size: 12px; color: var(--ws-muted); white-space: nowrap; }
    .stat-badge strong { color: var(--ws-text); font-weight: 650; }
    .stat-badge.primary { border-color: var(--ws-primary); background: var(--ws-primary-soft); color: var(--ws-primary); }
    .stat-badge.primary strong { color: var(--ws-primary); }
    .detail-header-actions { display: flex; align-items: center; gap: 8px; flex: none; }
    .delete-ws-btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: transparent; color: var(--ws-muted); font-size: 13px; transition: all .16s ease; }
    .delete-ws-btn:hover { border-color: var(--ws-danger); color: var(--ws-danger); background: var(--ws-danger-soft); }

    /* ── Detail Tabs ── */
    .detail-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--ws-border); margin-bottom: 20px; }
    .detail-tab { padding: 11px 20px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--ws-muted); font-size: 14px; transition: all .16s ease; }
    .detail-tab:hover { color: var(--ws-text); background: var(--ws-subtle); }
    .detail-tab.active { color: var(--ws-primary); border-bottom-color: var(--ws-primary); font-weight: 600; }
    .detail-tab-content { display: none; }
    .detail-tab-content.visible { display: block; }

    /* ── Source marker ── */
    .source-marker { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .source-marker.rule { background: color-mix(in srgb, var(--ws-primary) 12%, transparent); color: var(--ws-primary); }
    .source-marker.manual { background: color-mix(in srgb, var(--app-success) 12%, transparent); color: var(--app-success); }
    .source-marker.relation { background: color-mix(in srgb, #876de2 14%, transparent); color: #7657cf; }

    /* ── Exclude button ── */
    .exclude-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: transparent; color: var(--ws-muted); font-size: 12px; transition: all .16s ease; }
    .exclude-btn:hover { border-color: var(--ws-danger); color: var(--ws-danger); background: var(--ws-danger-soft); }
    .restore-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: transparent; color: var(--ws-muted); font-size: 12px; transition: all .16s ease; }
    .restore-btn:hover { border-color: var(--ws-primary); color: var(--ws-primary); background: var(--ws-primary-soft); }

    /* ── Rules panel ── */
    .rules-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .rules-header h3 { margin: 0; font-size: 15px; }
    .add-rule-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 0; border-radius: var(--app-radius); background: var(--ws-primary); color: #fff; font-size: 13px; transition: background .16s ease; }
    .add-rule-btn:hover { background: var(--app-primary-hover); }
    .rule-card { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); margin-bottom: 10px; background: var(--ws-surface); transition: border-color .16s ease; }
    .rule-card:hover { border-color: var(--ws-border-strong); }
    .rule-card.disabled { opacity: .55; }
    .rule-field { flex: none; min-width: 70px; padding: 3px 8px; border-radius: 5px; background: var(--ws-subtle); font-size: 12px; font-weight: 600; color: var(--ws-muted); text-align: center; }
    .rule-operator { flex: none; color: var(--ws-muted); font-size: 13px; }
    .rule-value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--ws-text); }
    .rule-actions { display: flex; align-items: center; gap: 6px; flex: none; }
    .toggle-switch { position: relative; width: 36px; height: 20px; flex: none; border: 0; border-radius: 10px; background: var(--ws-border); transition: background .2s ease; cursor: pointer; }
    .toggle-switch.on { background: var(--ws-primary); }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s ease; }
    .toggle-switch.on::after { transform: translateX(16px); }
    .rule-edit-btn, .rule-del-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; border-radius: var(--app-radius-sm); background: transparent; color: var(--ws-muted); font-size: 13px; transition: all .16s ease; }
    .rule-edit-btn:hover { background: var(--ws-subtle); color: var(--ws-primary); }
    .rule-del-btn:hover { background: var(--ws-danger-soft); color: var(--ws-danger); }

    /* ── Exclusions panel ── */
    .exclusions-header { margin-bottom: 16px; }
    .exclusions-header h3 { margin: 0; font-size: 15px; }

    /* ── 建议面板 ── */
    .suggestions-header { margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    .suggestions-header h3 { margin: 0; font-size: 15px; }
    .suggestion-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; font-size: 10px; font-weight: 700; background: var(--ws-accent); color: #fff; margin-left: 4px; vertical-align: middle; }
    .suggestion-card { display: flex; align-items: flex-start; gap: 12px; padding: 14px; margin-bottom: 8px; border: 1px solid var(--ws-border); border-radius: 10px; transition: border-color .2s; }
    .suggestion-card:hover { border-color: var(--ws-accent); }
    .suggestion-score { flex: none; width: 46px; text-align: center; }
    .suggestion-score .score-value { display: block; font-size: 16px; font-weight: 700; color: var(--ws-accent); }
    .suggestion-score .score-label { font-size: 9px; color: var(--ws-faint); }
    .suggestion-info { flex: 1; min-width: 0; }
    .suggestion-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .suggestion-meta { color: var(--ws-faint); font-size: 11px; }
    .suggestion-reasons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .suggestion-reason { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; background: color-mix(in srgb, var(--ws-accent) 12%, var(--ws-surface)); color: var(--ws-accent); }
    .suggestion-actions { display: flex; gap: 6px; flex: none; align-items: center; }
    .suggestion-actions button { padding: 5px 10px; border: 1px solid var(--ws-border); border-radius: 6px; font-size: 11px; cursor: pointer; background: var(--ws-bg); color: var(--ws-fg); transition: all .15s; }
    .suggestion-actions .accept-btn { border-color: var(--ws-accent); color: var(--ws-accent); }
    .suggestion-actions .accept-btn:hover { background: var(--ws-accent); color: #fff; }
    .suggestion-actions .ignore-btn:hover { border-color: var(--ws-faint); color: var(--ws-faint); }
    .suggestion-actions .reject-btn:hover { border-color: #e74c3c; color: #e74c3c; }
    .exclusion-card { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); margin-bottom: 10px; background: var(--ws-surface); }
    .exclusion-id { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-family: var(--app-font-mono); color: var(--ws-muted); }
    .exclusion-reason { flex: none; padding: 2px 8px; border-radius: 5px; background: var(--ws-subtle); font-size: 12px; color: var(--ws-muted); }
    .exclusion-date { flex: none; color: var(--ws-faint); font-size: 11px; white-space: nowrap; }

    /* ── Overlay / Modal ── */
    .modal-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1000; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal { width: min(480px, calc(100vw - 40px)); max-height: 85vh; display: flex; flex-direction: column; border-radius: var(--app-radius-lg); background: var(--ws-surface); box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 14px; border-bottom: 1px solid var(--ws-border); }
    .modal-header h3 { margin: 0; font-size: 16px; }
    .modal-close { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; border-radius: var(--app-radius-sm); background: transparent; color: var(--ws-muted); font-size: 18px; transition: all .16s ease; }
    .modal-close:hover { background: var(--ws-subtle); color: var(--ws-text); transform: rotate(90deg); }
    .modal-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
    .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--ws-border); }
    .form-group { margin-bottom: 16px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--ws-text); }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-subtle); color: var(--ws-text); transition: border-color .16s ease, box-shadow .16s ease; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--ws-primary); box-shadow: 0 0 0 3px var(--ws-primary-soft); }
    .form-textarea { resize: vertical; min-height: 70px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 0; border-radius: var(--app-radius); font-size: 13px; transition: all .16s ease; }
    .btn-primary { background: var(--ws-primary); color: #fff; }
    .btn-primary:hover { background: var(--app-primary-hover); }
    .btn-secondary { background: var(--ws-subtle); color: var(--ws-text); }
    .btn-secondary:hover { background: var(--ws-surface-hover); }
    .btn-danger { background: var(--ws-danger); color: #fff; }
    .btn-danger:hover { opacity: .88; }

    /* ── State ── */
    .state { display: grid; min-height: 300px; place-items: center; padding: 42px 24px; text-align: center; }
    .state-inner { max-width: 340px; }
    .state-icon { display: grid; width: 45px; height: 45px; place-items: center; margin: 0 auto 15px; border-radius: 14px; background: var(--ws-subtle); color: var(--ws-muted); }
    .state h3 { margin: 0; font-size: 16px; }
    .state p { margin: 8px 0 0; color: var(--ws-muted); }
    .retry { margin-top: 17px; padding: 8px 13px; border: 0; border-radius: var(--app-radius); background: var(--ws-primary); color: #fff; cursor: pointer; }
    .retry:hover { background: var(--app-primary-hover); }
    .loading { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ws-muted); }
    .spinner { width: 17px; height: 17px; border: 2px solid var(--ws-border); border-top-color: var(--ws-primary); border-radius: 50%; animation: spin .75s linear infinite; }
    .project-empty { padding: 18px; color: var(--ws-muted); font-size: 12px; text-align: center; }
    .empty-state { padding: 40px 20px; color: var(--ws-muted); font-size: 13px; text-align: center; }
    .error-message { padding: 10px 14px; border: 1px solid var(--ws-danger); border-radius: var(--app-radius); background: var(--ws-danger-soft); color: var(--ws-danger); font-size: 13px; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 产品开发工作区样式 ── */
    .product-dev-view { display: none; }
    .product-dev-view.visible { display: block; }
    .pd-shell { width: min(1280px, 100%); margin: 0 auto; padding: 28px 32px; }

    .pd-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .pd-header-left h1 { margin: 0; font-size: clamp(20px, 2.5vw, 28px); letter-spacing: -.03em; }
    .pd-header-actions { display: flex; gap: 10px; flex: none; }
    .pd-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 0; border-radius: var(--app-radius); font-size: 13px; cursor: pointer; transition: all .16s ease; }
    .pd-btn-primary { background: var(--ws-primary); color: #fff; }
    .pd-btn-primary:hover { background: var(--app-primary-hover); }
    .pd-btn-secondary { background: var(--ws-subtle); color: var(--ws-text); border: 1px solid var(--ws-border); }
    .pd-btn-secondary:hover { border-color: var(--ws-primary); color: var(--ws-primary); }

    .pd-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--ws-border); margin-bottom: 20px; }
    .pd-tab { padding: 10px 18px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--ws-muted); font-size: 13px; cursor: pointer; transition: all .16s ease; }
    .pd-tab:hover { color: var(--ws-text); background: var(--ws-subtle); }
    .pd-tab.active { color: var(--ws-primary); border-bottom-color: var(--ws-primary); font-weight: 600; }
    .pd-tab-content { display: none; }
    .pd-tab-content.visible { display: block; }

    /* 仪表盘卡片 */
    .pd-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .pd-dash-card { padding: 18px 20px; border: 1px solid var(--ws-border); border-radius: var(--app-radius-lg); background: var(--ws-surface); }
    .pd-dash-card-value { font-size: 26px; font-weight: 700; color: var(--ws-primary); line-height: 1.2; }
    .pd-dash-card-label { font-size: 12px; color: var(--ws-muted); margin-top: 4px; }
    .pd-dash-card-sub { font-size: 11px; color: var(--ws-faint); margin-top: 6px; }

    /* 图表行 */
    .pd-chart-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .pd-chart-card { border: 1px solid var(--ws-border); border-radius: var(--app-radius-lg); background: var(--ws-surface); overflow: hidden; }
    .pd-chart-card-header { padding: 14px 18px 8px; font-size: 13px; font-weight: 650; color: var(--ws-text); border-bottom: 1px solid var(--ws-border); }
    .pd-chart-container { padding: 12px 14px; height: 200px; position: relative; }
    .pd-chart-container canvas { width: 100% !important; height: 100% !important; }

    /* 最近活动 */
    .pd-section { margin-bottom: 20px; }
    .pd-section-header { font-size: 14px; font-weight: 650; margin-bottom: 10px; color: var(--ws-text); }
    .pd-activity-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); margin-bottom: 6px; background: var(--ws-surface); font-size: 13px; }
    .pd-activity-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .pd-activity-dot.archived { background: #10b981; }
    .pd-activity-dot.created { background: var(--ws-primary); }
    .pd-activity-dot.migrated { background: #f59e0b; }
    .pd-activity-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pd-activity-time { flex: none; color: var(--ws-faint); font-size: 11px; white-space: nowrap; }

    /* 需求看板 */
    .pd-kanban-toolbar { margin-bottom: 14px; }
    .pd-search-input { width: 100%; max-width: 320px; padding: 8px 12px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-subtle); color: var(--ws-text); font-size: 13px; outline: none; transition: border-color .16s ease; }
    .pd-search-input:focus { border-color: var(--ws-primary); }
    .pd-kanban { display: flex; gap: 12px; overflow-x: auto; padding: 8px 0 20px; min-height: 400px; }
    .pd-kanban-col { flex: 1; min-width: 200px; max-width: 280px; display: flex; flex-direction: column; border: 1px solid var(--ws-border); border-radius: var(--app-radius-lg); background: var(--ws-subtle); }
    .pd-kanban-col-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; border-bottom: 1px solid var(--ws-border); }
    .pd-kanban-col-header h3 { margin: 0; font-size: 13px; font-weight: 650; }
    .pd-kanban-col-count { color: var(--ws-faint); font-size: 11px; }
    .pd-kanban-col-body { flex: 1; overflow-y: auto; padding: 8px; min-height: 60px; }
    .pd-kanban-card { padding: 12px 14px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-surface); margin-bottom: 8px; cursor: grab; transition: box-shadow .16s ease; }
    .pd-kanban-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .pd-kanban-card:last-child { margin-bottom: 0; }
    .pd-kanban-card-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pd-kanban-card-meta { margin-top: 6px; font-size: 11px; color: var(--ws-faint); }
    .pd-kanban-card-meta .pd-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--ws-primary-soft); color: var(--ws-primary); font-size: 10px; margin-right: 4px; }

    /* 知识图谱 */
    .pd-graph-toolbar { margin-bottom: 12px; }
    .pd-graph-hint { font-size: 12px; color: var(--ws-muted); }
    .pd-legend-req { display: inline-block; padding: 1px 6px; border-radius: 4px; background: #2383e2; color: #fff; font-size: 10px; margin: 0 2px; }
    .pd-legend-kn { display: inline-block; padding: 1px 6px; border-radius: 4px; background: #10b981; color: #fff; font-size: 10px; margin: 0 2px; }
    .pd-legend-todo { display: inline-block; padding: 1px 6px; border-radius: 4px; background: #f59e0b; color: #fff; font-size: 10px; margin: 0 2px; }
    .pd-graph-container { width: 100%; height: 450px; border: 1px solid var(--ws-border); border-radius: var(--app-radius-lg); background: var(--ws-surface); overflow: hidden; }

    /* 时间线 */
    .pd-timeline-container { min-height: 300px; }

    /* 归档列表 */
    .pd-archive-toolbar { margin-bottom: 14px; }
    .pd-section-title { font-size: 14px; font-weight: 650; color: var(--ws-text); }
    .pd-archive-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); margin-bottom: 8px; background: var(--ws-surface); transition: border-color .16s ease; }
    .pd-archive-item:hover { border-color: var(--ws-primary); }
    .pd-archive-icon { font-size: 18px; flex: none; }
    .pd-archive-info { flex: 1; min-width: 0; }
    .pd-archive-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pd-archive-meta { font-size: 11px; color: var(--ws-faint); margin-top: 3px; }
    .pd-archive-source { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-left: 6px; }
    .pd-archive-source.archive { background: color-mix(in srgb, var(--ws-primary) 12%, transparent); color: var(--ws-primary); }
    .pd-archive-source.migrate { background: color-mix(in srgb, #f59e0b 12%, transparent); color: #d97706; }

    /* 空状态覆盖 */
    .product-dev-view .empty-state { padding: 40px 20px; color: var(--ws-muted); font-size: 13px; text-align: center; }

    @media (max-width: 820px) {
      .pd-shell { padding: 18px 14px; }
      .pd-chart-row { grid-template-columns: 1fr; }
      .pd-dashboard { grid-template-columns: repeat(2, 1fr); }
      .pd-kanban { flex-direction: column; }
      .pd-kanban-col { max-width: none; }
    }

    /* ── View toggle ── */
    .view-toggle { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--ws-border); border-radius: var(--app-radius); overflow: hidden; }
    .view-toggle button { padding: 6px 12px; border: 0; background: transparent; color: var(--ws-muted); font-size: 12px; transition: all .16s ease; }
    .view-toggle button:hover { background: var(--ws-subtle); }
    .view-toggle button.active { background: var(--ws-primary-soft); color: var(--ws-primary); font-weight: 600; }
    .view-toggle button:not(:last-child) { border-right: 1px solid var(--ws-border); }

    /* ── Kanban Board ── */
    .kanban-board { display: none; gap: 14px; overflow-x: auto; padding: 4px 0 20px; min-height: 400px; }
    .kanban-board.visible { display: flex; }
    .kanban-col { flex: 1; min-width: 240px; max-width: 340px; display: flex; flex-direction: column; border: 1px solid var(--ws-border); border-radius: var(--app-radius-lg); background: var(--ws-subtle); }
    .kanban-col-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--ws-border); }
    .kanban-col-header h3 { margin: 0; font-size: 13px; font-weight: 650; }
    .kanban-col-count { color: var(--ws-faint); font-size: 11px; }
    .kanban-col-body { flex: 1; overflow-y: auto; padding: 8px; min-height: 80px; }
    .kanban-col-body.drag-over { background: var(--ws-primary-soft); border-radius: var(--app-radius); }
    .kanban-card { padding: 12px 14px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-surface); margin-bottom: 8px; cursor: grab; transition: box-shadow .16s ease, transform .16s ease; }
    .kanban-card:last-child { margin-bottom: 0; }
    .kanban-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .kanban-card.dragging { opacity: .5; transform: rotate(2deg); }
    .kanban-card .type-mark { width: 24px; height: 24px; font-size: 9px; border-radius: 6px; }
    .kanban-card .card-header { display: flex; align-items: start; gap: 10px; }
    .kanban-card .card-title { margin: 0; overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .kanban-card .card-meta { margin-top: 8px; color: var(--ws-faint); font-size: 11px; }
    .kanban-card .card-meta .tag { margin-right: 4px; }
    .kanban-card .card-actions { margin-top: 8px; display: flex; gap: 6px; }
    .kanban-card .card-actions .exclude-btn { font-size: 11px; padding: 2px 8px; }

    /* ── Column management ── */
    .kanban-col-header .col-actions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity .16s ease; }
    .kanban-col:hover .col-actions { opacity: 1; }
    .col-action-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 0; border-radius: var(--app-radius-sm); background: transparent; color: var(--ws-muted); font-size: 12px; transition: all .16s ease; cursor: pointer; }
    .col-action-btn:hover { background: var(--ws-subtle); }
    .col-action-btn.rename:hover { color: var(--ws-primary); }
    .col-action-btn.delete:hover { color: var(--ws-danger); }
    .col-action-btn.delete.disabled { opacity: .35; cursor: not-allowed; }
    .col-action-btn.delete.disabled:hover { background: transparent; color: var(--ws-muted); }
    .kanban-add-col { flex: none; width: 56px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--ws-border); border-radius: var(--app-radius-lg); background: transparent; color: var(--ws-faint); font-size: 24px; cursor: pointer; transition: all .2s ease; min-height: 80px; align-self: flex-start; }
    .kanban-add-col:hover { border-color: var(--ws-primary); color: var(--ws-primary); background: var(--ws-primary-soft); }

    /* ── Responsive ── */
    .sidebar-toggle { display: none; }
    @media (max-width: 820px) {
      .sidebar { position: fixed; inset: 0; z-index: 900; width: 280px; transform: translateX(-100%); transition: transform .24s cubic-bezier(.4,0,.2,1); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-collapse { display: flex; }
      .sidebar-backdrop { display: block; position: fixed; inset: 0; z-index: 899; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .24s ease; }
      .sidebar-backdrop.show { opacity: 1; pointer-events: all; }
      .sidebar-toggle { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-surface); color: var(--ws-text); font-size: 18px; margin-right: 10px; transition: all .16s ease; }
      .sidebar-toggle:hover { border-color: var(--ws-primary); color: var(--ws-primary); }
      .overview-view .shell-inner, .detail-view .shell-inner { padding: 22px 18px; }
      .layout { grid-template-columns: 1fr; }
      .project-panel { position: static; }
      .hero { align-items: flex-start; flex-direction: column; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .search { flex-basis: auto; }
      .detail-header { flex-direction: column; }
    }
    @media (max-width: 480px) {
      .overview-view .shell-inner, .detail-view .shell-inner { padding: 16px 12px; }
      .content-panel, .project-panel { border-radius: var(--app-radius); }
      .toolbar, .filters { padding-left: 15px; padding-right: 15px; }
      .item { grid-template-columns: auto minmax(0, 1fr); padding: 15px; }
      .item-date { grid-column: 2; padding-top: 0; }
      .item-actions { grid-column: 1 / -1; justify-content: flex-end; }
    }

    /* ── 全局滚动条 ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--ws-border); border-radius: 999px; transition: background 0.2s ease; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ws-faint); }
    * { scrollbar-width: thin; scrollbar-color: var(--ws-border) transparent; }

    /* ── Tag Multi-Input ── */
    .tag-multi-input { position: relative; display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 10px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-subtle); cursor: text; transition: border-color .16s ease, box-shadow .16s ease; min-height: 40px; align-items: center; }
    .tag-multi-input:focus-within { border-color: var(--ws-primary); box-shadow: 0 0 0 3px var(--ws-primary-soft); }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background: var(--ws-primary-soft); color: var(--ws-primary); font-size: 12px; line-height: 1.4; max-width: 200px; animation: tagIn .18s cubic-bezier(.4,0,.2,1); }
    .tag-chip-remove { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border: 0; border-radius: 50%; background: transparent; color: var(--ws-primary); font-size: 12px; line-height: 1; cursor: pointer; transition: all .12s ease; flex: none; }
    .tag-chip-remove:hover { background: var(--ws-primary); color: #fff; }
    .tag-input { flex: 1; min-width: 80px; border: 0; background: transparent; color: var(--ws-text); font-size: 13px; outline: none; padding: 2px 0; }
    .tag-input::placeholder { color: var(--ws-faint); }
    .tag-suggestions { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20; max-height: 200px; overflow-y: auto; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-surface); box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 4px; }
    .tag-suggestion-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--app-radius-sm); font-size: 13px; color: var(--ws-text); cursor: pointer; transition: background .1s ease; }
    .tag-suggestion-item:hover, .tag-suggestion-item.active { background: var(--ws-subtle); }
    .tag-suggestion-item .tag-suggestion-count { margin-left: auto; font-size: 11px; color: var(--ws-faint); }
    @keyframes tagIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }

    /* ── Notion-style Date-Time Picker ── */
    .date-time-picker { display: flex; gap: 10px; align-items: flex-start; }
    .date-picker-field { position: relative; flex: 1; }
    .date-input { cursor: pointer; caret-color: transparent; user-select: none; }
    .date-input:focus { border-color: var(--ws-primary); box-shadow: 0 0 0 3px var(--ws-primary-soft); }
    .time-input { width: 100px; flex: none; text-align: center; letter-spacing: .04em; font-family: var(--app-font-mono, monospace); }
    .date-calendar { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 280px; padding: 14px 16px 12px; border: 1px solid var(--ws-border); border-radius: var(--app-radius-lg); background: var(--ws-surface); box-shadow: 0 12px 40px rgba(0,0,0,.14); animation: calIn .2s cubic-bezier(.4,0,.2,1); }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-header .cal-month-year { font-size: 14px; font-weight: 650; color: var(--ws-text); }
    .cal-nav { display: inline-flex; align-items: center; gap: 2px; }
    .cal-nav-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; border-radius: var(--app-radius-sm); background: transparent; color: var(--ws-muted); font-size: 16px; cursor: pointer; transition: all .12s ease; }
    .cal-nav-btn:hover { background: var(--ws-subtle); color: var(--ws-text); }
    .cal-grid { width: 100%; border-collapse: collapse; }
    .cal-grid th { padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--ws-faint); text-align: center; }
    .cal-grid td { padding: 2px; text-align: center; }
    .cal-day { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--ws-text); font-size: 13px; cursor: pointer; transition: all .1s ease; }
    .cal-day:hover { background: var(--ws-subtle); }
    .cal-day.other-month { color: var(--ws-faint); opacity: .4; }
    .cal-day.today { font-weight: 700; color: var(--ws-primary); }
    .cal-day.selected { background: var(--ws-primary); color: #fff; font-weight: 600; }
    .cal-day.selected:hover { background: var(--app-primary-hover); }
    .cal-day.empty { pointer-events: none; }
    .cal-footer { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--ws-border); }
    .cal-footer-row { display: flex; align-items: center; justify-content: space-between; }
    .cal-footer-btn { padding: 3px 10px; border: 0; border-radius: var(--app-radius-sm); background: transparent; color: var(--ws-primary); font-size: 12px; cursor: pointer; transition: all .12s ease; }
    .cal-footer-btn:hover { background: var(--ws-primary-soft); }
    .cal-time-quick { display: flex; flex-wrap: wrap; gap: 4px; }
    .cal-time-btn { padding: 3px 8px; border: 1px solid var(--ws-border); border-radius: var(--app-radius-sm); background: transparent; color: var(--ws-muted); font-size: 11px; cursor: pointer; transition: all .12s ease; }
    .cal-time-btn:hover { border-color: var(--ws-primary); color: var(--ws-primary); background: var(--ws-primary-soft); }
    .cal-time-btn.active { border-color: var(--ws-primary); background: var(--ws-primary); color: #fff; }
    @keyframes calIn { from { opacity: 0; transform: translateY(4px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ── Form hint ── */
    .form-hint { margin: 6px 0 0; font-size: 12px; color: var(--ws-faint); line-height: 1.4; }

    /* ── Operator pill ── */
    .operator-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .operator-pill { padding: 5px 12px; border: 1px solid var(--ws-border); border-radius: 999px; background: transparent; color: var(--ws-muted); font-size: 12px; cursor: pointer; transition: all .14s ease; }
    .operator-pill:hover { border-color: var(--ws-primary); color: var(--ws-primary); }
    .operator-pill.active { border-color: var(--ws-primary); background: var(--ws-primary-soft); color: var(--ws-primary); font-weight: 600; }

    /* ── Loading spinner button ── */
    .btn-loading { position: relative; pointer-events: none; opacity: .75; }
    .btn-loading::after { content: ''; display: inline-block; width: 14px; height: 14px; margin-left: 6px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="shell">
    <!-- ── Backdrop (mobile) ── -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar" aria-label="工作台列表">
      <div class="sidebar-header">
        <h1>工作台</h1>
        <button class="sidebar-collapse" id="sidebarCollapse" type="button" aria-label="关闭侧边栏">&times;</button>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-nav-item active" data-view="overview" type="button">
          <span class="icon">&#9776;</span> 全部概览
        </button>
        <button class="sidebar-nav-item" data-view="product-dev" type="button">
          <span class="icon">&#9881;</span> 产品开发

  <script>
    (() => {
      'use strict';

      /* ── Constants ── */
      const LABELS = { clip: '剪藏', knowledge: '知识', todo: '待办', 'learning-plan': '学习' };
      const INITIALS = { clip: '剪', knowledge: '知', todo: '待', 'learning-plan': '学' };
      const FIELD_LABELS = { type: '类型', category: '分类', tag: '标签', sourcePath: '来源路径', workflowStatus: '工作流状态', updatedAt: '更新时间' };
      const OPERATOR_LABELS = { equals: '等于', contains: '包含', in: '属于', before: '早于', after: '晚于' };
      const TYPE_LABELS = { general: '通用', project: '项目', learning: '学习' };
      const FIELD_OPERATORS = { type: ['equals', 'in'], category: ['equals', 'contains', 'in'], tag: ['equals', 'contains', 'in'], sourcePath: ['equals', 'contains', 'in'], workflowStatus: ['equals', 'in'], updatedAt: ['before', 'after'] };

      /* ── DOM refs ── */
      const $ = id => document.getElementById(id);
      const sidebar = $('sidebar');
      const sidebarBackdrop = $('sidebarBackdrop');
      const sidebarToggle = $('sidebarToggle');
      const sidebarToggle2 = $('sidebarToggle2');
      const sidebarCollapse = $('sidebarCollapse');
      const wsList = $('wsList');
      const overviewView = $('overviewView');
      const detailView = $('detailView');
      const detailHeader = $('detailHeader');
      const detailContent = $('detailContent');
      const detailContentList = $('detailContentList');
      const detailResultCount = $('detailResultCount');
      const detailSearchInput = $('detailSearchInput');
      const detailError = $('detailError');
      const detailRules = $('detailRules');
      const rulesList = $('rulesList');
      const rulesError = $('rulesError');
      const detailExclusions = $('detailExclusions');
      const exclusionsList = $('exclusionsList');
      const exclusionsError = $('exclusionsError');
      const newWsModal = $('newWsModal');
      const ruleModal = $('ruleModal');
      const confirmModal = $('confirmModal');
      const columnInputModal = $('columnInputModal');

      /* ─── Overview state ─── */
      const overviewState = { types: [], query: '', data: null, loading: false };

      /* ─── Workspace state ─── */
      let workspaces = [];
      let activeWsId = null;
      let wsLoading = false;

      /* ── Rule state ── */
      let editingRuleId = null;
      let fieldValuesCache = null;
      let selectedTags = [];
      let calendarDate = new Date();
      let selectedCalDate = null;

      /* ─── Helpers ─── */
      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]);
      }
      function formatDate(value) {
        if (!value) return '时间未知';
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
      }
      function formatDateTime(value) {
        if (!value) return '时间未知';
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }
      function showModal(modal) { modal.classList.add('show'); }
      function hideModal(modal) { modal.classList.remove('show'); }
      function getWsName(id) {
        const ws = workspaces.find(w => w.id === id);
        return ws ? ws.name : '未知工作台';
      }
      function showDetailError(msg) {
        detailError.textContent = msg;
        detailError.style.display = 'block';
        setTimeout(function() { detailError.style.display = 'none'; }, 5000);
      }

      /* ── Sidebar ── */
      function openSidebar() {
        sidebar.classList.add('open');
        sidebarBackdrop.classList.add('show');
      }
      function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarBackdrop.classList.remove('show');
      }
      sidebarToggle.addEventListener('click', openSidebar);
      sidebarToggle2.addEventListener('click', openSidebar);
      sidebarCollapse.addEventListener('click', closeSidebar);
      sidebarBackdrop.addEventListener('click', closeSidebar);

      /* ── Overview Functions ── */
      function overviewRenderState(kind, title, detail) {
        const list = $('contentList');
        const retry = kind === 'error' ? '<button class="retry" id="retryButton" type="button">重新尝试</button>' : '';
        const icon = kind === 'loading' ? '<div class="spinner"></div>' : kind === 'error' ? '!' : '○';
        list.innerHTML = `<div class="state"><div class="state-inner"><div class="state-icon">${icon}</div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(detail)}</p>${retry}</div></div>`;
        $('retryButton')?.addEventListener('click', loadOverview);
      }
      function overviewRenderFilters() {
        const filters = $('filters');
        const types = overviewState.data?.contentTypes || Object.keys(LABELS);
        filters.innerHTML = types.map(t => `<button class="filter ${overviewState.types.includes(t) ? 'active' : ''}" data-type="${escapeHtml(t)}" type="button">${escapeHtml(LABELS[t] || t)}</button>`).join('');
        filters.querySelectorAll('.filter').forEach(btn => btn.addEventListener('click', () => {
          const { type } = btn.dataset;
          overviewState.types = overviewState.types.includes(type) ? overviewState.types.filter(i => i !== type) : [...overviewState.types, type];
          loadOverview();
        }));
      }
      function overviewRenderProjects(projects) {
        const list = $('projectList');
        if (!projects?.length) { list.innerHTML = '<div class="project-empty">暂无可读取的项目摘要</div>'; return; }
        list.innerHTML = projects.map(p => `<article class="project"><h3 class="project-name"><i class="project-dot" style="--project-color:${escapeHtml(p.color || '')}"></i>${escapeHtml(p.name || '未命名项目')}</h3>${p.description ? `<p class="project-description">${escapeHtml(p.description)}</p>` : ''}<p class="project-status">${escapeHtml(p.status || '未标记状态')}</p></article>`).join('');
      }
      function overviewRenderWorkspaceSummary(summary) {
        const el = $('workspaceSummary');
        if (!summary) { el.innerHTML = ''; return; }
        const types = Object.entries(summary.types || {}).map(([k, v]) => `<div class="ws-summary-card"><span class="ws-card-value">${v}</span><span class="ws-card-label">${escapeHtml(k)}</span></div>`).join('');
        el.innerHTML = `<div class="ws-summary-card"><span class="ws-card-value">${summary.total || 0}</span><span class="ws-card-label">总计</span></div>
          <div class="ws-summary-card"><span class="ws-card-value">${summary.active || 0}</span><span class="ws-card-label">活跃</span></div>
          <div class="ws-summary-card archived"><span class="ws-card-value">${summary.archived || 0}</span><span class="ws-card-label">已归档</span></div>${types}</div>`;
      }
      function overviewRenderContents(contents) {
        const list = $('contentList');
        const count = $('resultCount');
        count.textContent = `共 ${contents.length} 项`;
        if (!contents.length) {
          overviewRenderState('empty', '没有匹配的内容', overviewState.query || overviewState.types.length ? '尝试清除筛选条件或更换关键词。' : '索引中暂时还没有可展示的内容。');
          return;
        }
        list.innerHTML = contents.map(item => {
          const meta = [item.category, ...(item.tags || []).map(t => `#${t}`), item.sourcePath].filter(Boolean).map(v => `<span class="tag">${escapeHtml(v)}</span>`).join('');
          return `<article class="item"><div class="type-mark" data-type="${escapeHtml(item.type)}">${escapeHtml(INITIALS[item.type] || '内')}</div><div class="item-body"><h3 class="item-title" title="${escapeHtml(item.title || '')}">${escapeHtml(item.title || '未命名内容')}</h3><div class="item-meta"><span>${escapeHtml(LABELS[item.type] || item.type || '内容')}</span>${meta}</div></div><time class="item-date" datetime="${escapeHtml(item.updatedAt || '')}">${escapeHtml(formatDate(item.updatedAt || item.createdAt))}</time></article>`;
        }).join('');
      }
      async function loadOverview() {
        overviewState.loading = true;
        $('refreshButton').disabled = true;
        overviewRenderState('loading', '正在读取内容索引', '请稍候，工作台只会读取已有索引。');
        const params = new URLSearchParams();
        overviewState.types.forEach(t => params.append('types', t));
        if (overviewState.query) params.set('query', overviewState.query);
        try {
          const r = await fetch(`/api/workspace/overview${params.size ? '?' + params : ''}`, { headers: { Accept: 'application/json' } });
          if (!r.ok) throw new Error('请求失败（' + r.status + '）');
          overviewState.data = await r.json();
          overviewRenderFilters();
          overviewRenderProjects(overviewState.data.projects || []);
          overviewRenderWorkspaceSummary(overviewState.data.workspaceSummary);
          overviewRenderContents(overviewState.data.contents || []);
        } catch (e) {
          $('resultCount').textContent = '';
          overviewRenderFilters();
          overviewRenderProjects([]);
          overviewRenderState('error', '暂时无法读取工作台', (e.message || '后端服务不可用') + '，请确认服务已启动后重试。');
        } finally {
          overviewState.loading = false;
          $('refreshButton').disabled = false;
        }
      }

      /* ── Workspace List ── */
      async function loadWorkspaces() {
        try {
          const r = await fetch('/api/workspace/list', { headers: { Accept: 'application/json' } });
          if (!r.ok) return;
          workspaces = await r.json();
          renderWsList();
        } catch (_) { /* ignore sidebar errors */ }
      }
      function renderWsList() {
        if (!workspaces.length) {
          wsList.innerHTML = '<div class="empty-state" style="padding:20px 12px;text-align:left">暂无工作台，点击下方新建。</div>';
          return;
        }
        wsList.innerHTML = workspaces.map(ws =>
          `<button class="sidebar-item ${activeWsId === ws.id ? 'active' : ''}" data-wsid="${escapeHtml(ws.id)}" type="button"><i class="ws-dot" style="background:${escapeHtml(ws.color || '#2383e2')}"></i><span class="ws-name">${escapeHtml(ws.name)}</span><span class="ws-type-tag">${escapeHtml(TYPE_LABELS[ws.type || 'general'] || '通用')}</span></button>`
        ).join('');
        wsList.querySelectorAll('.sidebar-item').forEach(btn => btn.addEventListener('click', () => selectWorkspace(btn.dataset.wsid)));
      }

      /* ── View Switching ── */
      const navOverview = document.querySelector('.sidebar-nav-item[data-view="overview"]');
      const navProductDev = document.querySelector('.sidebar-nav-item[data-view="product-dev"]');
      const productDevView = $('productDevView');

      function hideAllViews() {
        overviewView.classList.add('hidden');
        detailView.classList.remove('visible');
        productDevView.classList.remove('visible');
        document.querySelectorAll('.sidebar-nav-item').forEach(function(item) {
          item.classList.remove('active');
        });
      }

      navOverview.addEventListener('click', () => {
        activeWsId = null;
        hideAllViews();
        navOverview.classList.add('active');
        renderWsList();
        overviewView.classList.remove('hidden');
        closeSidebar();
      });

      navProductDev.addEventListener('click', function() {
        activeWsId = null;
        hideAllViews();
        navProductDev.classList.add('active');
        productDevView.classList.add('visible');
        closeSidebar();
        loadProductDev();
      });

      function selectWorkspace(id) {
        activeWsId = id;
        hideAllViews();
        navOverview.classList.add('active');
        renderWsList();
        overviewView.classList.add('hidden');
        detailView.classList.add('visible');
        closeSidebar();
        loadDetail();
      }

      /* ── Detail View ── */
      let detailState = { contents: [], filtered: [], query: '' };
      async function loadDetail() {
        if (!activeWsId) return;
        // Reset view to list
        currentView = 'list';
        viewToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        viewToggle.querySelector('[data-view="list"]').classList.add('active');
        $('detailContentList').style.display = 'grid';
        kanbanBoard.classList.remove('visible');
        detailColumns = [];
        wsLoading = true;
        detailHeader.innerHTML = '<div class="loading" style="padding:30px"><div class="spinner"></div> 加载中...</div>';
        detailContentList.innerHTML = '<div class="empty-state">加载中...</div>';
        rulesList.innerHTML = '<div class="empty-state">加载中...</div>';
        exclusionsList.innerHTML = '<div class="empty-state">加载中...</div>';
        try {
          const ws = workspaces.find(w => w.id === activeWsId);
          if (ws) {
            detailHeader.innerHTML =
              `<div class="detail-header-left"><i class="detail-color" style="background:${escapeHtml(ws.color || '#2383e2')}"></i><div class="detail-info"><h2>${escapeHtml(ws.name)}</h2><span class="detail-type">${escapeHtml(TYPE_LABELS[ws.type || 'general'] || '通用')}</span>${ws.description ? `<p class="detail-desc">${escapeHtml(ws.description)}</p>` : ''}</div></div><div class="detail-stats" id="detailStats"></div><div class="detail-header-actions"><button class="delete-ws-btn" id="deleteWsBtn" type="button" title="删除工作台">&#128465; 删除</button></div>`;
          }
          // Bind delete workspace handler
          const deleteBtn = $('deleteWsBtn');
          if (deleteBtn) {
            deleteBtn.addEventListener('click', () => {
              $('confirmTitle').textContent = '删除工作台';
              $('confirmMessage').textContent = ws ? `确定要删除工作台"${ws.name}"吗？此操作将同时删除该工作台的所有规则、排除项和看板列，不可恢复。` : '确定要删除此工作台吗？此操作不可恢复。';
              const confirmActionBtn = $('confirmAction');
              confirmActionBtn.onclick = async () => {
                hideModal(confirmModal);
                // Show loading state on delete button
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '⏳ 删除中...';
                try {
                  const r = await fetch(`/api/workspace/${encodeURIComponent(activeWsId)}`, { method: 'DELETE' });
                  const data = r.ok ? { message: '工作台已删除' } : await r.json().catch(() => ({}));
                  if (!r.ok) throw new Error(data.message || '删除失败，请稍后重试');
                  showDetailError('✓ ' + data.message);
                  // Navigate back to overview
                  activeWsId = null;
                  navOverview.classList.add('active');
                  renderWsList();
                  overviewView.classList.remove('hidden');
                  detailView.classList.remove('visible');
                  await loadWorkspaces();
                  await loadOverview();
                } catch (e) {
                  showDetailError('删除失败：' + (e.message || '后端服务不可用，请稍后重试'));
                  deleteBtn.disabled = false;
                  deleteBtn.innerHTML = '&#128465; 删除';
                }
              };
              showModal(confirmModal);
            });
          }
          const [resData, rulesData, exclusionsData] = await Promise.all([
            fetch(`/api/workspace/${encodeURIComponent(activeWsId)}/resolution`, { headers: { Accept: 'application/json' } }).then(r => r.ok ? r.json() : Promise.reject()),
            fetch(`/api/workspace/${encodeURIComponent(activeWsId)}/rules`, { headers: { Accept: 'application/json' } }).then(r => r.ok ? r.json() : Promise.reject()),
            fetch(`/api/workspace/${encodeURIComponent(activeWsId)}/exclusions`, { headers: { Accept: 'application/json' } }).then(r => r.ok ? r.json() : Promise.reject())
          ]);
          // Stats
          const stats = $('detailStats');
          stats.innerHTML =
            `<span class="stat-badge primary"><strong>${resData.visibleCount || 0}</strong> 可见内容</span>` +
            `<span class="stat-badge"><strong>${resData.ruleMatchedCount || 0}</strong> 规则命中</span>` +
            `<span class="stat-badge"><strong>${resData.manualCount || 0}</strong> 手动</span>` +
            `<span class="stat-badge"><strong>${resData.relationCount || 0}</strong> 关系</span>` +
            `<span class="stat-badge"><strong>${resData.excludedCount || 0}</strong> 排除</span>`;
          // Columns
          detailColumns = resData.columns || [];
          // Contents
          detailState.contents = resData.contents || [];
          detailState.filtered = [...detailState.contents];
          renderDetailContents();
          // If kanban view is active, re-render
          if (currentView === 'kanban') renderKanbanBoard();
          // Rules
          renderRules(rulesData);
          // Exclusions
          renderExclusions(exclusionsData);
        } catch (e) {
          detailHeader.innerHTML = '<div class="error-message" style="margin:0">加载失败：' + escapeHtml(e.message || '后端服务不可用') + ' <button class="retry" style="margin:0 0 0 10px;display:inline-block;padding:4px 12px" id="retryLoadDetail">重试</button></div>';
          const retryBtn = $('retryLoadDetail');
          if (retryBtn) retryBtn.addEventListener('click', function() { loadDetail(); });
        } finally {
          wsLoading = false;
        }
      }

      function renderDetailContents() {
        const q = detailState.query.toLowerCase();
        detailState.filtered = detailState.contents.filter(item => {
          if (!q) return true;
          return (item.title && item.title.toLowerCase().includes(q)) ||
                 (item.category && item.category.toLowerCase().includes(q)) ||
                 (item.tags || []).some(t => t.toLowerCase().includes(q));
        });
        detailResultCount.textContent = '共 ' + detailState.filtered.length + ' 项';
        if (!detailState.filtered.length) {
          detailContentList.innerHTML = '<div class="empty-state">' + (q ? '没有匹配的内容' : '暂无可展示的可见内容') + '</div>';
          return;
        }
        const SOURCE_LABELS = { rule: '规则命中', manual: '手动加入', relation: '关系带入' };
        detailContentList.innerHTML = detailState.filtered.map(item => {
          const meta = [item.category, ...(item.tags || []).map(t => '#' + t), item.sourcePath].filter(Boolean).map(v => `<span class="tag">${escapeHtml(v)}</span>`).join('');
          const sourceBadge = item.source ? `<span class="source-marker ${escapeHtml(item.source)}">${escapeHtml(SOURCE_LABELS[item.source] || item.source)}</span>` : '';
          return `<article class="item"><div class="type-mark" data-type="${escapeHtml(item.type)}">${escapeHtml(INITIALS[item.type] || '内')}</div><div class="item-body"><h3 class="item-title" title="${escapeHtml(item.title || '')}">${escapeHtml(item.title || '未命名内容')}</h3><div class="item-meta"><span>${escapeHtml(LABELS[item.type] || item.type || '内容')}</span>${sourceBadge}${meta}</div></div><div class="item-actions"><button class="exclude-btn" data-content-id="${escapeHtml(item.id)}" data-content-title="${escapeHtml(item.title || '')}" type="button">排除</button></div></article>`;
        }).join('');
        detailContentList.querySelectorAll('.exclude-btn').forEach(btn => btn.addEventListener('click', () => excludeContent(btn.dataset.contentId, btn.dataset.contentTitle)));
      }

      /* ── Exclude / Restore ── */
      async function excludeContent(contentId, title) {
        if (!activeWsId) return;
        try {
          const r = await fetch(`/api/workspace/${encodeURIComponent(activeWsId)}/exclusions`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contentId, reason: '手动排除' })
          });
          if (!r.ok) { showDetailError('排除失败'); return; }
          loadDetail();
        } catch (e) {
          showDetailError('排除失败：' + (e.message || '后端服务不可用'));
        }
      }
      async function restoreExclusion(contentId) {
        if (!activeWsId) return;
        try {
          const r = await fetch(`/api/workspace/${encodeURIComponent(activeWsId)}/exclusions/${encodeURIComponent(contentId)}`, { method: 'DELETE' });
          if (!r.ok) { showDetailError('恢复失败'); return; }
          loadDetail();
        } catch (e) {
          showDetailError('恢复失败：' + (e.message || '后端服务不可用'));
        }
      }

      /* ── Rules ── */
      function renderRules(rules) {
        if (!rules?.length) {
          rulesList.innerHTML = '<div class="empty-state">暂无筛选规则，点击上方添加。</div>';
          return;
        }
        rulesList.innerHTML = rules.map(r =>
          `<div class="rule-card ${r.enabled ? '' : 'disabled'}"><span class="rule-field">${escapeHtml(FIELD_LABELS[r.field] || r.field)}</span><span class="rule-operator">${escapeHtml(OPERATOR_LABELS[r.operator] || r.operator)}</span><span class="rule-value" title="${escapeHtml(r.value)}">${escapeHtml(r.value)}</span><div class="rule-actions"><button class="toggle-switch ${r.enabled ? 'on' : ''}" data-rule-id="${escapeHtml(r.id)}" data-enabled="${r.enabled}" type="button" aria-label="切换启用状态"></button><button class="rule-edit-btn" data-rule-id="${escapeHtml(r.id)}" type="button" title="编辑">&#9998;</button><button class="rule-del-btn" data-rule-id="${escapeHtml(r.id)}" type="button" title="删除">&times;</button></div></div>`
        ).join('');
        rulesList.querySelectorAll('.toggle-switch').forEach(btn => btn.addEventListener('click', () => toggleRule(btn.dataset.ruleId, btn.dataset.enabled === 'true')));
        rulesList.querySelectorAll('.rule-edit-btn').forEach(btn => btn.addEventListener('click', () => openRuleModal(btn.dataset.ruleId)));
        rulesList.querySelectorAll('.rule-del-btn').forEach(btn => btn.addEventListener('click', () => deleteRule(btn.dataset.ruleId)));
      }
      async function toggleRule(ruleId, currentEnabled) {
        rulesError.style.display = 'none';
        try {
          const rules = await fetch(`/api/workspace/${encodeURIComponent(activeWsId)}/rules`, { headers: { Accept: 'application/json' } }).then(r => r.ok ? r.json() : []);
          const rule = rules.find(r => r.id === ruleId);
          if (!rule) throw new Error('规则不存在');
          const r = await fetch(`/api/workspace/${encodeURIComponent(activeWsId)}/rules/${encodeURIComponent(ruleId)}`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ field: rule.field, operator: rule.operator, value: rule.value, enabled: !currentEnabled })
          });
          if (!r.ok) throw new Error('更新失败');
          loadDetail();
        } catch (e) {
          rulesError.textContent = '操作失败：' + (e.message || '后端服务不可用');
          rulesError.style.display = 'block';
        }
      }
      function updateOperatorPills(field) {
        const container = $('ruleOperatorPills');
        const operators = FIELD_OPERATORS[field] || ['equals'];
        const currentOp = container.querySelector('.active')?.dataset?.operator;
        container.innerHTML = operators.map(op =>
          `<button class="operator-pill ${op === (currentOp || operators[0]) ? 'active' : ''}" data-operator="${op}" type="button">${OPERATOR_LABELS[op] || op}</button>`
        ).join('');
        container.querySelectorAll('.operator-pill').forEach(pill => {
          pill.addEventListener('click', function() {
            container.querySelectorAll('.operator-pill').forEach(p => p.classList.remove('active'));
            this.classList.add('active');
          });
        });
      }

      function getSelectedOperator() {
        const active = $('ruleOperatorPills')?.querySelector('.active');
        return active ? active.dataset.operator : 'equals';
      }

      /* ── Tag Multi-Select ── */
      function addTag(tag) {
        tag = tag.trim();
        if (!tag || selectedTags.includes(tag)) return;
        selectedTags.push(tag);
        renderTagChips();
        $('tagInput').value = '';
        $('tagSuggestions').style.display = 'none';
      }
      function removeTag(tag) {
        selectedTags = selectedTags.filter(t => t !== tag);
        renderTagChips();
        $('tagInput').focus();
      }
      function renderTagChips() {
        const list = $('tagList');
        if (!selectedTags.length) { list.innerHTML = ''; return; }
        list.innerHTML = selectedTags.map(t =>
          `<span class="tag-chip">${escapeHtml(t)}<button class="tag-chip-remove" data-tag="${escapeHtml(t)}" type="button">&times;</button></span>`
        ).join('');
        list.querySelectorAll('.tag-chip-remove').forEach(btn => {
          btn.addEventListener('click', function(e) { e.stopPropagation(); removeTag(this.dataset.tag); });
        });
      }
      function renderTagSuggestions(query) {
        const suggestions = $('tagSuggestions');
        if (!query || !fieldValuesCache?.tag?.length) { suggestions.style.display = 'none'; return; }
        const q = query.toLowerCase();
        const matches = fieldValuesCache.tag.filter(t => t.toLowerCase().includes(q) && !selectedTags.includes(t));
        if (!matches.length) { suggestions.style.display = 'none'; return; }
        suggestions.innerHTML = matches.map(t =>
          `<div class="tag-suggestion-item" data-tag="${escapeHtml(t)}"><span>${escapeHtml(t)}</span></div>`
        ).join('');
        suggestions.style.display = '';
        suggestions.querySelectorAll('.tag-suggestion-item').forEach(item => {
          item.addEventListener('click', function() { addTag(this.dataset.tag); });
        });
      }

      /* ── Notion-style Calendar ── */
      function renderCalendar(year, month) {
        const cal = $('dateCalendar');
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startDay = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        const prevMonthDays = new Date(year, month, 0).getDate();
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        const today = new Date();
        const todayStr = today.getFullYear() + '-' + today.getMonth() + '-' + today.getDate();
        const selStr = selectedCalDate ? selectedCalDate.getFullYear() + '-' + selectedCalDate.getMonth() + '-' + selectedCalDate.getDate() : '';
        const currentTime = $('timeInput').value || '';

        let html = `<div class="cal-header">
          <span class="cal-month-year">${year}年 ${month + 1}月</span>
          <div class="cal-nav">
            <button class="cal-nav-btn" data-cal-action="prev-month" type="button">&lsaquo;</button>
            <button class="cal-nav-btn" data-cal-action="next-month" type="button">&rsaquo;</button>
          </div>
        </div>
        <table class="cal-grid"><thead><tr>${weekDays.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody><tr>`;

        // Previous month padding
        let col = 0;
        for (let i = startDay - 1; i >= 0; i--) {
          const d = prevMonthDays - i;
          html += `<td><span class="cal-day other-month">${d}</span></td>`;
          col++;
        }
        // Current month days
        for (let d = 1; d <= daysInMonth; d++) {
          if (col > 0 && col % 7 === 0) html += '</tr><tr>';
          const dateStr = year + '-' + month + '-' + d;
          const cls = ['cal-day'];
          if (dateStr === todayStr) cls.push('today');
          if (dateStr === selStr) cls.push('selected');
          html += `<td><span class="${cls.join(' ')}" data-cal-day="${d}">${d}</span></td>`;
          col++;
        }
        // Next month padding
        let nextDay = 1;
        while (col % 7 !== 0) {
          html += `<td><span class="cal-day other-month">${nextDay}</span></td>`;
          nextDay++; col++;
        }
        html += '</tr></tbody></table>';

        // Footer with quick time picker
        html += `<div class="cal-footer">
          <div class="cal-footer-row">
            <button class="cal-footer-btn" data-cal-action="today" type="button">今天</button>
            <button class="cal-footer-btn" data-cal-action="clear" type="button">清除</button>
          </div>
          <div class="cal-time-quick">
            <button class="cal-time-btn${!currentTime ? ' active' : ''}" data-cal-time="" type="button">现在</button>
            <button class="cal-time-btn${currentTime === '00:00' ? ' active' : ''}" data-cal-time="00:00" type="button">00:00</button>
            <button class="cal-time-btn${currentTime === '06:00' ? ' active' : ''}" data-cal-time="06:00" type="button">06:00</button>
            <button class="cal-time-btn${currentTime === '12:00' ? ' active' : ''}" data-cal-time="12:00" type="button">12:00</button>
            <button class="cal-time-btn${currentTime === '18:00' ? ' active' : ''}" data-cal-time="18:00" type="button">18:00</button>
            <button class="cal-time-btn${currentTime === '23:59' ? ' active' : ''}" data-cal-time="23:59" type="button">23:59</button>
          </div>
        </div>`;

        cal.innerHTML = html;

        // Event handlers
        cal.querySelectorAll('[data-cal-action]').forEach(btn => btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const action = this.dataset.calAction;
          if (action === 'prev-month') { calendarDate.setMonth(calendarDate.getMonth() - 1); renderCalendar(calendarDate.getFullYear(), calendarDate.getMonth()); }
          else if (action === 'next-month') { calendarDate.setMonth(calendarDate.getMonth() + 1); renderCalendar(calendarDate.getFullYear(), calendarDate.getMonth()); }
          else if (action === 'today') { selectCalDate(new Date()); }
          else if (action === 'clear') { selectCalDate(null); }
        }));
        cal.querySelectorAll('[data-cal-day]').forEach(span => span.addEventListener('click', function() {
          const day = parseInt(this.dataset.calDay);
          const d = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), day);
          selectCalDate(d);
        }));
        cal.querySelectorAll('[data-cal-time]').forEach(btn => btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const time = this.dataset.calTime;
          if (time) {
            $('timeInput').value = time;
          } else {
            // "现在" - set to current time
            const now = new Date();
            $('timeInput').value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
          }
          // Update active state
          cal.querySelectorAll('.cal-time-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
        }));
      }

      function selectCalDate(date) {
        selectedCalDate = date;
        const input = $('dateInput');
        if (date) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          input.value = `${y}-${m}-${d}`;
        } else {
          input.value = '';
          $('dateCalendar').style.display = 'none';
        }
        // Re-render calendar to update selected highlight, keep open for time selection
        if ($('dateCalendar').style.display !== 'none') {
          renderCalendar(calendarDate.getFullYear(), calendarDate.getMonth());
        }
      }

      function openCalendar() {
        const cal = $('dateCalendar');
        cal.style.display = cal.style.display === 'none' ? '' : 'none';
        if (cal.style.display !== 'none') {
          calendarDate = selectedCalDate ? new Date(selectedCalDate) : new Date();
          renderCalendar(calendarDate.getFullYear(), calendarDate.getMonth());
        }
      }

      function closeCalendar() { $('dateCalendar').style.display = 'none'; }

      function switchRuleValueInput(field) {
        const select = $('ruleValueSelect');
        const input = $('ruleValueInput');
        const tags = $('ruleValueTags');
        const date = $('ruleValueDate');
        const hint = $('ruleValueHint');
        [select, input, tags, date].forEach(el => { if (el) el.style.display = 'none'; });
        hint.style.display = 'none';

        // Update operator pills
        updateOperatorPills(field);

        if (field === 'sourcePath') {
          input.style.display = '';
          input.placeholder = '输入来源路径';
          hint.style.display = '';
          hint.textContent = '支持路径片段匹配，如 /clips/notes/';
        } else if (field === 'updatedAt') {
          date.style.display = '';
          hint.style.display = '';
          hint.textContent = '选择日期时间，用于比较早于/晚于';
        } else if (field === 'tag') {
          tags.style.display = '';
          hint.style.display = '';
          hint.textContent = '输入标签名称搜索，点击或回车添加多个标签';
        } else {
          select.style.display = '';
          // Populate with values from cache
          if (fieldValuesCache && fieldValuesCache[field]) {
            const values = fieldValuesCache[field];
            select.innerHTML = values.length ? values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('') : '<option value="">（无可用值）</option>';
          } else {
            select.innerHTML = '<option value="">加载中...</option>';
            loadFieldValues().then(() => {
              if (fieldValuesCache && fieldValuesCache[field]) {
                select.innerHTML = fieldValuesCache[field].map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
              }
            }).catch(() => {});
          }
        }
      }

      async function loadFieldValues() {
        if (fieldValuesCache) return fieldValuesCache;
        try {
          const r = await fetch('/api/workspace/field-values', { headers: { Accept: 'application/json' } });
          if (r.ok) fieldValuesCache = await r.json();
        } catch (_) { fieldValuesCache = {}; }
        return fieldValuesCache;
      }

      function openRuleModal(ruleId) {
        editingRuleId = ruleId;
        $('ruleModalTitle').textContent = ruleId ? '编辑规则' : '添加规则';
        $('confirmRule').textContent = '保存';
        // Reset tag state
        selectedTags = [];
        selectedCalDate = null;
        // Pre-load field values
        loadFieldValues();
        if (ruleId) {
          fetch(`/api/workspace/${encodeURIComponent(activeWsId)}/rules`, { headers: { Accept: 'application/json' } })
            .then(r => r.ok ? r.json() : [])
            .then(rules => {
              const rule = rules.find(r => r.id === ruleId);
              if (rule) {
                $('ruleField').value = rule.field;
