<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 - CutShelter</title>
  <link rel="stylesheet" href="styles/design-tokens.css">
  <style>
    :root { --ws-bg: var(--app-bg); --ws-surface: var(--app-surface); --ws-subtle: var(--app-surface-subtle); --ws-border: var(--app-border); --ws-text: var(--app-text); --ws-muted: var(--app-text-secondary); --ws-faint: var(--app-text-muted); --ws-primary: var(--app-primary); --ws-primary-soft: var(--app-primary-soft); }
    * { box-sizing: border-box; }
    body { min-width: 0; margin: 0; background: var(--ws-bg); color: var(--ws-text); font: 14px/1.55 var(--app-font); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: 32px; }
    .hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 8px; color: var(--ws-primary); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); line-height: 1.2; letter-spacing: -.035em; }
    .subtitle { max-width: 620px; margin: 10px 0 0; color: var(--ws-muted); }
    .refresh { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 9px 13px; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-surface); color: var(--ws-text); transition: border-color .16s ease, color .16s ease, transform .16s ease; }
    .refresh:hover { border-color: var(--ws-primary); color: var(--ws-primary); transform: translateY(-1px); }
    .refresh:disabled { cursor: wait; opacity: .6; transform: none; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; align-items: start; gap: 20px; }
    .content-panel, .project-panel { overflow: hidden; border: 1px solid var(--ws-border); border-radius: var(--app-radius-lg); background: var(--ws-surface); box-shadow: var(--app-shadow); }
    .content-panel { min-height: 500px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 20px 22px 16px; border-bottom: 1px solid var(--ws-border); }
    .toolbar-title { margin: 0; font-size: 16px; }
    .result-count { margin-left: 8px; color: var(--ws-faint); font-size: 12px; font-weight: 400; }
    .search { position: relative; flex: 0 1 260px; }
    .search svg { position: absolute; top: 50%; left: 11px; width: 16px; height: 16px; color: var(--ws-faint); transform: translateY(-50%); pointer-events: none; }
    .search input { width: 100%; padding: 9px 11px 9px 35px; outline: none; border: 1px solid var(--ws-border); border-radius: var(--app-radius); background: var(--ws-subtle); color: var(--ws-text); transition: border-color .16s ease, box-shadow .16s ease; }
    .search input:focus { border-color: var(--ws-primary); box-shadow: 0 0 0 3px var(--ws-primary-soft); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 22px; border-bottom: 1px solid var(--ws-border); background: color-mix(in srgb, var(--ws-subtle) 55%, transparent); }
    .filter { padding: 5px 10px; border: 1px solid var(--ws-border); border-radius: 999px; background: transparent; color: var(--ws-muted); font-size: 12px; transition: all .16s ease; }
    .filter:hover { border-color: var(--ws-primary); color: var(--ws-primary); }
    .filter.active { border-color: var(--ws-primary); background: var(--ws-primary-soft); color: var(--ws-primary); font-weight: 600; }
    .list { display: grid; }
    .item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 13px; align-items: start; padding: 17px 22px; border-bottom: 1px solid var(--ws-border); }
    .item:last-child { border-bottom: 0; }
    .type-mark { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 9px; background: var(--ws-primary-soft); color: var(--ws-primary); font-size: 11px; font-weight: 700; }
    .type-mark[data-type="todo"] { background: color-mix(in srgb, var(--app-success) 12%, transparent); color: var(--app-success); }
    .type-mark[data-type="knowledge"] { background: color-mix(in srgb, var(--app-warning) 13%, transparent); color: var(--app-warning); }
    .type-mark[data-type="learning-plan"] { background: color-mix(in srgb, #876de2 14%, transparent); color: #7657cf; }
    .item-title { margin: 0; overflow: hidden; font-size: 14px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { display: flex; flex-wrap: wrap; gap: 7px 10px; margin-top: 5px; color: var(--ws-muted); font-size: 12px; }
    .tag { color: var(--ws-faint); }
    .item-date { padding-top: 4px; color: var(--ws-faint); font-size: 11px; white-space: nowrap; }
    .project-panel { position: sticky; top: 16px; }
    .panel-heading { padding: 19px 18px 14px; border-bottom: 1px solid var(--ws-border); }
    .panel-heading h2 { margin: 0; font-size: 15px; }
    .panel-heading p { margin: 5px 0 0; color: var(--ws-muted); font-size: 12px; }
    .projects { display: grid; gap: 0; }
    .project { padding: 15px 18px; border-bottom: 1px solid var(--ws-border); }
    .project:last-child { border-bottom: 0; }
    .project-name { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; }
    .project-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--project-color, var(--ws-primary)); }
    .project-description { display: -webkit-box; margin: 5px 0 0 16px; overflow: hidden; color: var(--ws-muted); font-size: 12px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .project-status { margin: 7px 0 0 16px; color: var(--ws-faint); font-size: 11px; }
    .state { display: grid; min-height: 300px; place-items: center; padding: 42px 24px; text-align: center; }
    .state-inner { max-width: 340px; }
    .state-icon { display: grid; width: 45px; height: 45px; place-items: center; margin: 0 auto 15px; border-radius: 14px; background: var(--ws-subtle); color: var(--ws-muted); }
    .state h3 { margin: 0; font-size: 16px; }
    .state p { margin: 8px 0 0; color: var(--ws-muted); }
    .retry { margin-top: 17px; padding: 8px 13px; border: 0; border-radius: var(--app-radius); background: var(--ws-primary); color: #fff; }
    .loading { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ws-muted); }
    .spinner { width: 17px; height: 17px; border: 2px solid var(--ws-border); border-top-color: var(--ws-primary); border-radius: 50%; animation: spin .75s linear infinite; }
    .project-empty { padding: 18px; color: var(--ws-muted); font-size: 12px; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 820px) { .shell { padding: 22px 18px; } .layout { grid-template-columns: 1fr; } .project-panel { position: static; } .hero { align-items: flex-start; flex-direction: column; } .toolbar { align-items: stretch; flex-direction: column; } .search { flex-basis: auto; } }
    @media (max-width: 480px) { .shell { padding: 16px 12px; } .content-panel, .project-panel { border-radius: var(--app-radius); } .toolbar, .filters { padding-left: 15px; padding-right: 15px; } .item { grid-template-columns: auto minmax(0, 1fr); padding: 15px; } .item-date { grid-column: 2; padding-top: 0; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Workspace overview</p>
        <h1>工作台</h1>
        <p class="subtitle">从一个只读视图浏览已索引的剪藏、知识、待办和学习计划；这里不会修改你的任何内容或项目数据。</p>
      </div>
      <button class="refresh" id="refreshButton" type="button"><span aria-hidden="true">↻</span> 刷新索引</button>
    </header>
    <div class="layout">
      <section class="content-panel" aria-labelledby="contentHeading">
        <div class="toolbar">
          <h2 class="toolbar-title" id="contentHeading">全部内容 <span class="result-count" id="resultCount"></span></h2>
          <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="searchInput" type="search" placeholder="搜索标题、标签、分类或来源" autocomplete="off"></label>
        </div>
        <div class="filters" id="filters" aria-label="内容类型筛选"></div>
        <div class="list" id="contentList" aria-live="polite"></div>
      </section>
      <aside class="project-panel" aria-labelledby="projectHeading">
        <div class="panel-heading"><h2 id="projectHeading">项目摘要</h2><p>兼容读取已有项目索引</p></div>
        <div class="projects" id="projectList"></div>
      </aside>
    </div>
  </main>
  <script>
    (() => {
      const labels = { clip: '剪藏', knowledge: '知识', todo: '待办', 'learning-plan': '学习' };
      const initials = { clip: '剪', knowledge: '知', todo: '待', 'learning-plan': '学' };
      const state = { types: [], query: '', data: null, loading: false };
      const list = document.getElementById('contentList');
      const filters = document.getElementById('filters');
      const projectList = document.getElementById('projectList');
      const count = document.getElementById('resultCount');
      const refreshButton = document.getElementById('refreshButton');
      const searchInput = document.getElementById('searchInput');
      let searchTimer;

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
      }
      function formatDate(value) {
        if (!value) return '时间未知';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
      }
      function renderState(kind, title, detail) {
        const retry = kind === 'error' ? '<button class="retry" id="retryButton" type="button">重新尝试</button>' : '';
        const icon = kind === 'loading' ? '<div class="spinner"></div>' : kind === 'error' ? '!' : '○';
        list.innerHTML = `<div class="state"><div class="state-inner"><div class="state-icon">${icon}</div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(detail)}</p>${retry}</div></div>`;
        document.getElementById('retryButton')?.addEventListener('click', loadOverview);
      }
      function renderFilters() {
        const types = state.data?.contentTypes || Object.keys(labels);
        filters.innerHTML = types.map(type => `<button class="filter ${state.types.includes(type) ? 'active' : ''}" data-type="${escapeHtml(type)}" type="button">${escapeHtml(labels[type] || type)}</button>`).join('');
        filters.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
          const { type } = button.dataset;
          state.types = state.types.includes(type) ? state.types.filter(item => item !== type) : [...state.types, type];
          loadOverview();
        }));
      }
      function renderProjects(projects) {
        if (!projects?.length) { projectList.innerHTML = '<div class="project-empty">暂无可读取的项目摘要</div>'; return; }
        projectList.innerHTML = projects.map(project => `<article class="project"><h3 class="project-name"><i class="project-dot" style="--project-color:${escapeHtml(project.color || '')}"></i>${escapeHtml(project.name || '未命名项目')}</h3>${project.description ? `<p class="project-description">${escapeHtml(project.description)}</p>` : ''}<p class="project-status">${escapeHtml(project.status || '未标记状态')}</p></article>`).join('');
      }
      function renderContents(contents) {
        count.textContent = `共 ${contents.length} 项`;
        if (!contents.length) { renderState('empty', '没有匹配的内容', state.query || state.types.length ? '尝试清除筛选条件或更换关键词。' : '索引中暂时还没有可展示的内容。'); return; }
        list.innerHTML = contents.map(item => {
          const meta = [item.category, ...(item.tags || []).map(tag => `#${tag}`), item.sourcePath].filter(Boolean).map(value => `<span class="tag">${escapeHtml(value)}</span>`).join('');
          return `<article class="item"><div class="type-mark" data-type="${escapeHtml(item.type)}">${escapeHtml(initials[item.type] || '内')}</div><div><h3 class="item-title" title="${escapeHtml(item.title || '')}">${escapeHtml(item.title || '未命名内容')}</h3><div class="item-meta"><span>${escapeHtml(labels[item.type] || item.type || '内容')}</span>${meta}</div></div><time class="item-date" datetime="${escapeHtml(item.updatedAt || '')}">${escapeHtml(formatDate(item.updatedAt || item.createdAt))}</time></article>`;
        }).join('');
      }
      async function loadOverview() {
        state.loading = true;
        refreshButton.disabled = true;
        renderState('loading', '正在读取内容索引', '请稍候，工作台只会读取已有索引。');
        const params = new URLSearchParams();
        state.types.forEach(type => params.append('types', type));
        if (state.query) params.set('query', state.query);
        try {
          const response = await fetch(`/api/workspace/overview${params.size ? `?${params}` : ''}`, { headers: { Accept: 'application/json' } });
          if (!response.ok) throw new Error(`请求失败（${response.status}）`);
          state.data = await response.json();
          renderFilters();
          renderProjects(state.data.projects || []);
          renderContents(state.data.contents || []);
        } catch (error) {
          count.textContent = '';
          renderFilters();
          renderProjects([]);
          renderState('error', '暂时无法读取工作台', `${error.message || '后端服务不可用'}，请确认服务已启动后重试。`);
        } finally {
          state.loading = false;
          refreshButton.disabled = false;
        }
      }
      refreshButton.addEventListener('click', loadOverview);
      searchInput.addEventListener('input', event => {
        window.clearTimeout(searchTimer);
        searchTimer = window.setTimeout(() => { state.query = event.target.value.trim(); loadOverview(); }, 260);
      });
      window.addEventListener('message', event => { if (event.data?.action === 'refresh') loadOverview(); });
      window.addEventListener('message', event => { if (event.data?.action === 'themeChange') document.documentElement.setAttribute('data-theme', event.data.theme); });
      document.documentElement.setAttribute('data-theme', localStorage.getItem('app_theme_v1') || 'notion');
      loadOverview();
    })();
  </script>
</body>
</html>
