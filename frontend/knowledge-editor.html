<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑知识</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3f8cff;
            --primary-dark: #2f72d8;
            --background: #f9fafb;
            --surface: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --transition: all 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Nav */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav .back-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }
        .nav .back-btn:hover { background: var(--border); }
        .nav .page-title { font-size: 1.1rem; font-weight: 600; flex: 1; }
        .nav .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .nav .btn-primary:hover { background: var(--primary-dark); }
        .nav .btn-secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        .nav .btn-secondary:hover { background: var(--border); }

        /* Form */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
            background: var(--surface);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(63,140,255,0.1);
        }
        .form-group textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.7;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
        }
        .form-group textarea#contentInput {
            min-height: 300px;
        }
        .form-group textarea#myThoughtsInput {
            min-height: 150px;
        }
        .form-row {
            display: flex;
            gap: 16px;
        }
        .form-row .form-group { flex: 1; }

        /* Tags */
        .tags-input-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            min-height: 42px;
            align-items: center;
        }
        .tags-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(63,140,255,0.1);
        }
        .tag-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 16px;
            background: #eff6ff;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 500;
        }
        .tag-item .remove {
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            opacity: 0.6;
        }
        .tag-item .remove:hover { opacity: 1; }
        .tags-input-wrapper input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 80px;
            padding: 4px;
            font-size: 0.9rem;
            background: transparent;
        }

        /* 关联来源 chips */
        .source-chips-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            min-height: 42px;
        }
        .source-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 16px;
            background: #fef3c7;
            color: #92400e;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .source-chip .remove {
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            opacity: 0.6;
        }
        .source-chip .remove:hover { opacity: 1; }
        .source-chip .source-chip-site {
            font-size: 0.68rem;
            color: #b45309;
            background: rgba(245, 158, 11, 0.12);
            padding: 0 6px;
            border-radius: 8px;
            line-height: 1.5;
        }
        html[data-theme="dark"] .source-chip .source-chip-site {
            color: #f0c36d;
            background: rgba(245, 158, 11, 0.18);
        }
        .source-chips-area .btn-add-source {
            background: var(--surface);
            border: 1px dashed var(--border);
            padding: 4px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .source-chips-area .btn-add-source:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Import clip */
        .import-section {
            margin-top: 20px;
            padding: 16px;
            background: #f0f7ff;
            border-radius: var(--radius);
            border: 1px dashed var(--primary);
        }
        .import-section h3 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: var(--primary);
        }
        .import-section select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            margin-bottom: 8px;
            outline: none;
        }
        .import-section .btn-import {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .clip-select-list .clip-option {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .clip-select-list .clip-option:last-child { border-bottom: none; }
        .clip-select-list .clip-option:hover { background: rgba(63,140,255,0.08); }
        .clip-select-list .clip-option.selected { background: rgba(63,140,255,0.12); color: var(--primary); }
        .clip-select-list .clip-option .clip-option-title { font-weight: 500; }
        .clip-select-list .clip-option .clip-option-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        /* Source Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-panel {
            background: var(--surface);
            border-radius: var(--radius);
            width: 90%;
            max-width: 520px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0 4px;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text); }
        .modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 12px;
            background: var(--background);
            color: var(--text);
            transition: var(--transition);
        }
        .modal-search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(63,140,255,0.1);
        }
        .modal-results {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .modal-results .modal-clip-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-results .modal-clip-item:last-child { border-bottom: none; }
        .modal-results .modal-clip-item:hover { background: rgba(63,140,255,0.06); }
        .modal-results .modal-clip-item.selected { background: rgba(63,140,255,0.12); color: var(--primary); }
        .modal-results .modal-clip-item .check-icon {
            width: 18px; height: 18px;
            border: 2px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .modal-results .modal-clip-item.selected .check-icon {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .modal-results .modal-clip-item .clip-info {
            flex: 1;
            min-width: 0;
        }
        .modal-results .modal-clip-item .clip-info-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .modal-results .modal-clip-item .clip-info-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal-footer .btn-confirm {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-footer .btn-confirm:hover { background: var(--primary-dark); }
        .modal-footer .btn-cancel {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .modal-footer .btn-cancel:hover { background: var(--border); }

        /* Wikilink dropdown */
        .wikilink-dropdown {
            display: none;
            position: absolute;
            z-index: 300;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            max-height: 200px;
            overflow-y: auto;
            min-width: 240px;
        }
        .wikilink-dropdown.active { display: block; }
        .wikilink-dropdown .wikilink-item {
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .wikilink-dropdown .wikilink-item:last-child { border-bottom: none; }
        .wikilink-dropdown .wikilink-item:hover,
        .wikilink-dropdown .wikilink-item.active {
            background: rgba(63,140,255,0.1);
            color: var(--primary);
        }
        .wikilink-dropdown .wikilink-item .wikilink-title {
            font-weight: 500;
        }
        .wikilink-dropdown .wikilink-item .wikilink-category {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        .confirm-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .confirm-dialog {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .confirm-dialog p { font-size: 14px; color: var(--text); margin-bottom: 20px; line-height: 1.6; }
        .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .confirm-btn {
            padding: 8px 20px; border-radius: 8px; border: 1px solid var(--border);
            cursor: pointer; font-size: 13px;
            background: var(--surface); color: var(--text-secondary);
            transition: all 0.15s;
        }
        .confirm-btn:hover { border-color: var(--primary); color: var(--primary); }
        .confirm-btn.danger { background: #ef4444; color: #fff; border-color: #ef4444; }
        .confirm-btn.danger:hover { background: #dc2626; }

        /* Notion 主题 */
        html[data-theme="notion"] {
            --primary: #2383e2;
            --primary-dark: #1f76c9;
            --background: #f7f7f5;
            --surface: #ffffff;
            --text: #2f3437;
            --text-secondary: #6b6f76;
            --text-muted: #8a8f98;
            --border: #e8e8e6;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 0 rgba(15,23,42,0.03), 0 8px 20px rgba(15,23,42,0.04);
        }
        html[data-theme="notion"] .nav {
            border-bottom-color: #e8e8e6;
        }
        html[data-theme="notion"] .nav .back-btn {
            border-color: #dcdcd8;
            color: #6b6f76;
        }
        html[data-theme="notion"] .nav .back-btn:hover { background: #f1f1ef; }
        html[data-theme="notion"] .nav .btn-secondary {
            border-color: #dcdcd8;
            color: #6b6f76;
        }
        html[data-theme="notion"] .nav .btn-secondary:hover { background: #f1f1ef; }
        html[data-theme="notion"] .nav .btn-primary {
            background: #2f3437;
            color: #ffffff;
        }
        html[data-theme="notion"] .nav .btn-primary:hover { background: #1f2328; }
        html[data-theme="notion"] .form-group input,
        html[data-theme="notion"] .form-group select,
        html[data-theme="notion"] .form-group textarea {
            border-color: #dcdcd8;
            background: #ffffff;
        }
        html[data-theme="notion"] .form-group input:focus,
        html[data-theme="notion"] .form-group select:focus,
        html[data-theme="notion"] .form-group textarea:focus {
            border-color: #2383e2;
            box-shadow: 0 0 0 3px rgba(35,131,226,0.15);
        }
        html[data-theme="notion"] .tags-input-wrapper {
            border-color: #dcdcd8;
            background: #ffffff;
        }
        html[data-theme="notion"] .tags-input-wrapper:focus-within {
            border-color: #2383e2;
            box-shadow: 0 0 0 3px rgba(35,131,226,0.15);
        }
        html[data-theme="notion"] .tag-item {
            background: #f1f1ef;
            color: #5f646c;
        }
        html[data-theme="notion"] .source-chip {
            background: #fef9e7;
            color: #92400e;
        }
        html[data-theme="notion"] .source-chips-area {
            border-color: #dcdcd8;
            background: #ffffff;
        }
        html[data-theme="notion"] .source-chips-area .btn-add-source {
            border-color: #dcdcd8;
            color: #6b6f76;
        }
        html[data-theme="notion"] .source-chips-area .btn-add-source:hover {
            border-color: #2383e2;
            color: #2383e2;
        }
        html[data-theme="notion"] .modal-panel { border-color: #dcdcd8; }
        html[data-theme="notion"] .modal-search-input { background: #f7f7f5; border-color: #dcdcd8; }
        html[data-theme="notion"] .modal-results { border-color: #dcdcd8; }
        html[data-theme="notion"] .modal-footer .btn-confirm {
            background: #2f3437;
            color: #ffffff;
        }
        html[data-theme="notion"] .modal-footer .btn-confirm:hover { background: #1f2328; }
        html[data-theme="notion"] .import-section {
            background: #f1f1ef;
            border-color: #2383e2;
        }
        html[data-theme="notion"] .import-section h3 { color: #2383e2; }
        html[data-theme="notion"] .import-section .btn-import {
            background: #2f3437;
            color: #ffffff;
        }
        html[data-theme="notion"] .import-section .btn-import:hover { background: #1f2328; }

        /* 深色主题 */
        html[data-theme="dark"] {
            --primary: #569cff;
            --primary-dark: #4a8ae8;
            --background: #1e1e1e;
            --surface: #2d2d2d;
            --text: #d4d4d4;
            --text-secondary: #9a9a9a;
            --text-muted: #6a6a6a;
            --border: #3e3e3e;
        }
        html[data-theme="dark"] body { background: var(--background); color: var(--text); }
        html[data-theme="dark"] .nav { background: var(--surface); border-bottom-color: var(--border); }
        html[data-theme="dark"] .nav .back-btn { border-color: var(--border); color: var(--text-secondary); }
        html[data-theme="dark"] .nav .back-btn:hover { background: #3a3a3a; }
        html[data-theme="dark"] .nav .btn-secondary { background: var(--surface); border-color: var(--border); color: var(--text-secondary); }
        html[data-theme="dark"] .nav .btn-secondary:hover { background: #3a3a3a; }
        html[data-theme="dark"] .nav .btn-primary { background: var(--primary); color: #fff; }
        html[data-theme="dark"] .nav .btn-primary:hover { background: var(--primary-dark); }
        html[data-theme="dark"] .form-group label { color: var(--text-secondary); }
        html[data-theme="dark"] input, html[data-theme="dark"] textarea, html[data-theme="dark"] select {
            background: #3a3a3a; border-color: #4a4a4a; color: #d4d4d4;
        }
        html[data-theme="dark"] input:focus, html[data-theme="dark"] textarea:focus, html[data-theme="dark"] select:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px rgba(86,156,255,0.2);
        }
        html[data-theme="dark"] .tags-input-wrapper { background: #3a3a3a; border-color: #4a4a4a; }
        html[data-theme="dark"] .tags-input-wrapper:focus-within { border-color: var(--primary); }
        html[data-theme="dark"] .tags-input-wrapper input { background: transparent; color: #d4d4d4; }
        html[data-theme="dark"] .tag-item { background: #3a3a3a; color: #9a9a9a; }
        html[data-theme="dark"] .source-chips-area { background: #3a3a3a; border-color: #4a4a4a; }
        html[data-theme="dark"] .source-chip { background: #3d3520; color: #f0c36d; }
        html[data-theme="dark"] .source-chips-area .btn-add-source { background: #3a3a3a; border-color: #4a4a4a; color: #9a9a9a; }
        html[data-theme="dark"] .source-chips-area .btn-add-source:hover { border-color: var(--primary); color: var(--primary); }
        html[data-theme="dark"] .import-section { background: #2a2d3a; border-color: var(--primary); }
        html[data-theme="dark"] .import-section h3 { color: var(--primary); }
        html[data-theme="dark"] .import-section .btn-import { background: var(--primary); color: #fff; }
        html[data-theme="dark"] .import-section .btn-import:hover { background: var(--primary-dark); }
        html[data-theme="dark"] .clip-select-list { background: #3a3a3a; border-color: #4a4a4a; }
        html[data-theme="dark"] .clip-select-list .clip-option { border-bottom-color: #4a4a4a; color: #d4d4d4; }
        html[data-theme="dark"] .clip-select-list .clip-option:hover { background: rgba(86,156,255,0.12); }
        html[data-theme="dark"] .clip-select-list .clip-option.selected { background: rgba(86,156,255,0.2); color: var(--primary); }
        html[data-theme="dark"] .modal-overlay { background: rgba(0,0,0,0.6); }
        html[data-theme="dark"] .modal-panel { background: var(--surface); }
        html[data-theme="dark"] .modal-header { border-bottom-color: var(--border); }
        html[data-theme="dark"] .modal-footer { border-top-color: var(--border); }
        html[data-theme="dark"] .modal-search-input { background: #3a3a3a; border-color: #4a4a4a; color: #d4d4d4; }
        html[data-theme="dark"] .modal-results { border-color: #4a4a4a; }
        html[data-theme="dark"] .modal-results .modal-clip-item { border-bottom-color: #4a4a4a; color: #d4d4d4; }
        html[data-theme="dark"] .modal-results .modal-clip-item:hover { background: rgba(86,156,255,0.1); }
        html[data-theme="dark"] .modal-results .modal-clip-item.selected { background: rgba(86,156,255,0.2); color: var(--primary); }
        html[data-theme="dark"] .modal-results .modal-clip-item .check-icon { border-color: #4a4a4a; }
        html[data-theme="dark"] .modal-footer .btn-cancel { background: var(--surface); border-color: var(--border); color: var(--text-secondary); }
        html[data-theme="dark"] .modal-footer .btn-cancel:hover { background: #3a3a3a; }
        html[data-theme="dark"] .wikilink-dropdown { background: var(--surface); border-color: var(--border); }
        html[data-theme="dark"] .wikilink-dropdown .wikilink-item { border-bottom-color: var(--border); color: #d4d4d4; }
        html[data-theme="dark"] .wikilink-dropdown .wikilink-item:hover,
        html[data-theme="dark"] .wikilink-dropdown .wikilink-item.active { background: rgba(86,156,255,0.15); color: var(--primary); }
        html[data-theme="dark"] .btn { background: #3a3a3a; color: #d4d4d4; border-color: #4a4a4a; }
        html[data-theme="dark"] .btn-primary { background: #569cff; color: #fff; border-color: #569cff; }
        html[data-theme="dark"] .tag { background: #3a3a3a; color: #d4d4d4; }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; }
            .container { padding: 16px; }
            .modal-panel { width: 95%; max-height: 80vh; }
        }

        /* ===== Obsidian 风格全局滚动条 ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 999px; transition: background 0.2s ease; }
        ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }
        * { scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }
        html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: var(--border); }
        html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }
        html[data-theme="dark"] * { scrollbar-color: var(--border) transparent; }
    </style>
    <link rel="stylesheet" href="styles/design-tokens.css">
    <link rel="stylesheet" href="styles/ui-common.css">
    <script src="js/theme-core.js"></script>
    <script src="js/theme-bridge.js"></script>

</head>
<body>
    <nav class="nav">
        <a href="knowledge.html" class="back-btn">← 返回</a>
        <span class="page-title" id="pageTitle">新建知识</span>

        <button class="btn-primary" id="publishBtn">发布</button>

    <div class="container">
        <div class="import-section">
            <h3>从已有剪藏导入</h3>
            <input type="text" id="clipSearchInput" placeholder="搜索剪藏..." autocomplete="off" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; outline: none; margin-bottom: 8px; background: var(--surface); color: var(--text); transition: var(--transition);">
            <div class="clip-select-list" id="clipSelectList" style="display: none; max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); margin-bottom: 8px;"></div>
            <button class="btn-import" id="importBtn">导入</button>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label>标题</label>
            <input type="text" id="titleInput" placeholder="给知识起个标题..." maxlength="120" />
        </div>

        <div class="form-group">
            <label>摘要（一句话描述）</label>
            <input type="text" id="summaryInput" placeholder="用一句话概括这条知识..." maxlength="200" />
        </div>

        <div class="form-group">
            <label>分类</label>
            <select id="categorySelect">
                <option value="work">工作</option>
                <option value="study">学习</option>
                <option value="life">生活</option>
                <option value="tech">技术</option>
                <option value="other">其他</option>
            </select>
        </div>

                <input type="text" id="tagInput" placeholder="添加标签..." />
            </div>
        </div>

        <div class="form-group">
            <label>关联来源</label>
            <div class="source-chips-area" id="sourceChipsArea">
                <span id="sourceChipsContainer"></span>
                <button class="btn-add-source" id="addSourceBtn">+ 添加来源</button>
            </div>
        </div>

        <div class="form-group">
            <label>AI对话内容（Markdown格式）</label>
            <textarea id="contentInput" placeholder="将你的AI对话记录粘贴到这里...
支持Markdown格式，如：
# 标题
**加粗** *斜体*
- 列表项

支持 [[ 维基链接 ]] 引用其他知识条目"></textarea>
        </div>

        <div class="form-group">
            <label>我的思考（Markdown格式）</label>
            <textarea id="myThoughtsInput" placeholder="记录你对这条知识的思考、观点或总结..."></textarea>
        </div>
    </div>

    <!-- 关联来源选择弹窗 -->
    <div class="modal-overlay" id="sourceModal">
        <div class="modal-panel">
            <div class="modal-header">
                <h3>选择关联来源</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" class="modal-search-input" id="modalSearchInput" placeholder="搜索剪藏..." autocomplete="off" />
                <div class="modal-results" id="modalResults"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">确认</button>
            </div>
        </div>
    </div>

    <!-- Wikilink 自动补全下拉 -->
    <div class="wikilink-dropdown" id="wikilinkDropdown"></div>

    <script src="knowledge-editor.js"></script>
    <script src="js/ui-common.js"></script>
    <script>
      (function() {
        const THEME_KEY = 'app_theme_v1';
        const APPEARANCE_KEY = 'app_appearance_v1';
        function getEffective() {
          const app = localStorage.getItem(APPEARANCE_KEY) || 'notion';
          if (app === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'notion';
          return app;
        }
        function apply() {
          const t = getEffective();
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : (t === 'regular' ? 'regular' : 'notion'));
        }
        apply();
        window.addEventListener('storage', function(e) {
          if (e.key === THEME_KEY || e.key === APPEARANCE_KEY) apply();
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
          if ((localStorage.getItem(APPEARANCE_KEY) || 'notion') === 'system') apply();
        });
      })();
    </script>
