<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑话题</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3f8cff;
            --primary-dark: #2f72d8;
            --background: #f9fafb;
            --surface: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --transition: all 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Nav */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav .back-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .nav .back-btn:hover { background: var(--border); }
        .nav .page-title { font-size: 1.1rem; font-weight: 600; flex: 1; }
        .nav .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .nav .btn-primary:hover { background: var(--primary-dark); }
        .nav .btn-secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        .nav .btn-secondary:hover { background: var(--border); }

        /* Form */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
            background: var(--surface);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(63,140,255,0.1);
        }
        .form-group textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.7;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
        }
        .form-row {
            display: flex;
            gap: 16px;
        }
        .form-row .form-group { flex: 1; }

        /* Tags */
        .tags-input-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            min-height: 42px;
            align-items: center;
        }
        .tags-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(63,140,255,0.1);
        }
        .tag-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 16px;
            background: #eff6ff;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 500;
        }
        .tag-item .remove {
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            opacity: 0.6;
        }
        .tag-item .remove:hover { opacity: 1; }
        .tags-input-wrapper input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 80px;
            padding: 4px;
            font-size: 0.9rem;
            background: transparent;
        }

        /* Import clip */
        .import-section {
            margin-top: 20px;
            padding: 16px;
            background: #f0f7ff;
            border-radius: var(--radius);
            border: 1px dashed var(--primary);
        }
        .import-section h3 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: var(--primary);
        }
        .import-section select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            margin-bottom: 8px;
            outline: none;
        }
        .import-section .btn-import {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; }
            .container { padding: 16px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <span class="page-title" id="pageTitle">新建话题</span>
        <button class="btn-secondary" id="saveDraftBtn" style="display:none;">保存草稿</button>
        <button class="btn-primary" id="publishBtn">发布</button>
    </nav>

    <div class="container">
        <div class="form-group">
            <label>标题</label>
            <input type="text" id="titleInput" placeholder="给话题起个标题..." maxlength="120" />
        </div>

        <div class="form-group">
            <label>摘要（一句话描述）</label>
            <input type="text" id="summaryInput" placeholder="用一句话概括这个话题..." maxlength="200" />
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>分类</label>
                <select id="categorySelect">
                    <option value="work">工作</option>
                    <option value="study">学习</option>
                    <option value="life">生活</option>
                    <option value="tech">技术</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>封面图URL（可选）</label>
                <input type="text" id="coverInput" placeholder="https://..." />
            </div>
        </div>

        <div class="form-group">
            <label>标签（输入后按回车添加）</label>
            <div class="tags-input-wrapper" id="tagsWrapper">
                <span id="tagsContainer"></span>
                <input type="text" id="tagInput" placeholder="添加标签..." />
            </div>
        </div>

        <div class="form-group">
            <label>AI对话内容（Markdown格式）</label>
            <textarea id="contentInput" placeholder="将你的AI对话记录粘贴到这里...
支持Markdown格式，如：
# 标题
**加粗** *斜体*
- 列表项"></textarea>
        </div>

        <div class="import-section">
            <h3>从已有剪藏导入</h3>
            <select id="clipSelect">
                <option value="">-- 选择剪藏 --</option>
            </select>
            <button class="btn-import" id="importBtn">导入</button>
        </div>
    </div>

    <script src="topic-editor.js"></script>
</body>
</html>
