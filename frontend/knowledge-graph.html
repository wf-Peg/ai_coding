<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识图谱</title>
    <script src="libs/d3.min.js"></script>
    <style>
        :root {
            --primary: var(--app-primary);
            --primary-light: var(--app-primary-soft);
            --primary-dark: var(--app-primary-hover);
            --background: var(--app-bg);
            --surface: var(--app-surface);
            --text: var(--app-text);
            --text-secondary: var(--app-text-secondary);
            --text-muted: var(--app-text-muted);
            --border: var(--app-border);
            --radius: var(--app-radius);
            --radius-sm: var(--app-radius-sm);
            --shadow: var(--app-shadow-sm);
            --shadow-hover: var(--app-shadow-md);
            --transition: var(--app-duration-normal) var(--app-ease-smooth);
            --link-color: #ccc;
            --link-opacity: 0.3;
            --node-dim-opacity: 0.15;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Nav */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }
        .nav .back-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .nav .back-btn:hover { background: var(--border); }
        .nav .title {
            font-size: 1.2rem;
            font-weight: 700;
            flex: 1;
        }
        .nav .nav-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Nav Controls */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 8px;
        }
        .search-input {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.85rem;
            background: var(--surface);
            color: var(--text);
            width: 180px;
            outline: none;
            transition: var(--transition);
        }
        .search-input:focus { border-color: var(--primary); }
        .view-toggle {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }
        .view-toggle .seg-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            border: none;
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .view-toggle .seg-btn.active { background: var(--primary); color: #fff; }
        .sync-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .sync-btn:hover { border-color: var(--primary); color: var(--primary); }
.sync-btn.loading { opacity: 0.6; pointer-events: none; }
.sync-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* 分组 frame */
.group-frame-rect {
    fill: var(--app-primary-soft);
    fill-opacity: 0.18;
    stroke: var(--primary);
    stroke-opacity: 0.55;
    stroke-width: 1.4px;
    stroke-dasharray: 6 4;
    pointer-events: none;
}
.group-frame-title {
    font-size: 11px;
    fill: var(--primary);
    font-weight: 600;
    text-anchor: start;
    user-select: none;
    cursor: grab;
    paint-order: stroke;
    stroke: var(--surface);
    stroke-width: 3px;
    stroke-linejoin: round;
}
.group-frame.selected-frame .group-frame-rect {
    stroke-opacity: 1;
    fill-opacity: 0.3;
}

/* 框选矩形 */
.box-select-rect {
    fill: var(--primary);
    fill-opacity: 0.08;
    stroke: var(--primary);
    stroke-dasharray: 5 4;
    stroke-width: 1.2px;
    pointer-events: none;
}

/* 选中节点高亮（框选/多选） */
.node.selected-node rect,
.node.selected-node circle,
.node.selected-node polygon {
    stroke: #ff9800 !important;
    stroke-width: 3px !important;
}

        /* Legend */
        .legend {
            position: absolute;
            bottom: 16px;
            left: 16px;
            display: flex;
            gap: 14px;
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            z-index: 50;
            box-shadow: var(--shadow);
        }
        .legend-item { display: inline-flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.clip-dot { border-radius: 2px; background: #f59e0b; }
        .dot.kno-dot { background: var(--app-primary); }
        .tri { width: 0; height: 0; display: inline-block;
            border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-bottom: 10px solid #22c55e; }
        .lmark { width: 16px; height: 0; display: inline-block; border-top: 2px solid; }
        .lmark.derived-line { border-top-style: dashed; border-top-color: #fb923c; }
        .lmark.linked-line { border-top-color: var(--app-primary); }
        .lmark.plan-line { border-top-color: #22c55e; }

        /* SVG Node shape by type */
        .node rect {
            stroke: var(--surface);
            stroke-width: 2px;
            cursor: pointer;
            transition: stroke-width var(--app-duration-normal) ease;
        }
        .node:hover rect { stroke-width: 3px; }

        /* Graph Container */
        .graph-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--background);
        }
        .graph-container svg {
            width: 100%;
            height: 100%;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            z-index: 10;
        }
        .loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty State */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            z-index: 10;
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.9rem;
        }

        /* Side Panel */
        .side-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: right var(--app-duration-slow) ease;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 20px rgba(0,0,0,0.08);
        }
        .side-panel.open {
            right: 0;
        }
        .side-panel .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .side-panel .panel-header h3 {
            font-size: 1rem;
            font-weight: 600;
            flex: 1;
            margin-right: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .side-panel .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            transition: var(--transition);
            line-height: 1;
        }
        .side-panel .close-btn:hover {
            background: var(--border);
            color: var(--text);
        }
        .side-panel .panel-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .side-panel .panel-body .label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .side-panel .panel-body .summary-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .side-panel .panel-body .tags-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .side-panel .panel-body .tag-badge {
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--app-primary-soft);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 500;
        }
        .side-panel .panel-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }
        .side-panel .detail-link {
            display: block;
            width: 100%;
            padding: 10px 0;
            text-align: center;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }
        .side-panel .detail-link:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(63,140,255,0.3);
        }

        /* Canvas context menu */
        .canvas-menu {
            position: fixed;
            z-index: 300;
            min-width: 180px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow-hover);
            padding: 6px;
            display: flex;
            flex-direction: column;
        }
        .canvas-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.85rem;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }
        .canvas-menu button:hover { background: var(--border); }
        .canvas-menu button.danger { color: #ef4444; }
        .canvas-menu button.danger:hover { background: rgba(239,68,68,0.1); }
        .canvas-menu .divider { height: 1px; background: var(--border); margin: 4px 6px; }

        /* Canvas node shapes */
        .node .canvas-card-text {
            font-size: 11px;
            fill: #1f2937;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }
        .node .canvas-ref-text { fill: #ffffff; }
        .link-manual { stroke: #a78bfa; stroke-opacity: 0.7; stroke-width: 1.6px; }
        .link-manual.dimmed { stroke-opacity: 0.08; }
        .node.linking rect, .node.linking circle, .node.linking polygon {
            stroke: #ff9800 !important;
            stroke-width: 3px !important;
            stroke-dasharray: 4 3;
        }
        .temp-link { stroke: #ff9800; stroke-width: 1.6px; stroke-dasharray: 5 4; pointer-events: none; }

        /* Canvas modal */
        .canvas-modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .canvas-modal {
            width: 380px;
            max-width: calc(100vw - 40px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            padding: 18px 20px;
        }
        .canvas-modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 14px; }
        .canvas-modal-body { margin-bottom: 16px; }
        .canvas-modal-body input, .canvas-modal-body textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--background);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            resize: none;
        }
        .canvas-modal-body input:focus, .canvas-modal-body textarea:focus { border-color: var(--primary); }
        .canvas-modal-body textarea { min-height: 80px; line-height: 1.5; }
        .canvas-modal-body .field-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
        .ref-picker-list { max-height: 220px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; }
        .ref-picker-item { padding: 8px 12px; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
        .ref-picker-item:last-child { border-bottom: none; }
        .ref-picker-item:hover, .ref-picker-item.selected { background: var(--border); }
        .ref-picker-item .rtype { color: var(--text-muted); font-size: 0.72rem; flex-shrink: 0; }
        .ref-picker-item .rtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .canvas-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-btn { padding: 7px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: var(--transition); }
        .modal-btn:hover { border-color: var(--primary); color: var(--primary); }
        .modal-btn.ok { background: var(--primary); color: #fff; border-color: var(--primary); }
        .modal-btn.ok:hover { background: var(--primary-dark); }

        /* SVG Node & Link styles */
        .link {
            stroke: var(--link-color);
            stroke-opacity: var(--link-opacity);
            stroke-width: 1px;
        }
        .node circle {
            stroke: var(--surface);
            stroke-width: 2px;
            cursor: pointer;
            transition: stroke-width var(--app-duration-normal) ease;
        }
        .node:hover circle {
            stroke-width: 3px;
        }
        .node polygon {
            stroke: var(--surface);
            stroke-width: 2px;
            stroke-linejoin: round;
            cursor: pointer;
            transition: stroke-width var(--app-duration-normal) ease;
        }
        .node:hover polygon {
            stroke-width: 3px;
        }
        .node.dimmed polygon {
            opacity: 0.15;
        }
        .node text {
            font-size: 10px;
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            fill: var(--text-secondary);
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }
        .node.dimmed circle {
            opacity: 0.15;
        }
        .node.dimmed text {
            opacity: 0.15;
        }
        .link.dimmed {
            stroke-opacity: 0.05;
        }

                        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

        @media (max-width: 768px) {
            .nav { padding: 10px 16px; }
            .nav .nav-hint { display: none; }
            .side-panel { width: 260px; right: -280px; }
        }
    </style>
    <link rel="stylesheet" href="styles/design-tokens.css">
    <link rel="stylesheet" href="styles/ui-common.css">
    <script src="js/theme-core.js"></script>
    <script src="js/theme-bridge.js"></script>
    <script>(function(){var b=window.CutShelterThemeBridge;b.init({root:document.documentElement});b.listen();})();</script>
</head>
<body>
    <nav class="nav">
        <a href="knowledge.html" class="back-btn">← 返回</a>
        <span class="title">知识图谱</span>
        <div class="nav-controls">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索节点 / 标签 / 分类...">
            <div class="view-toggle">
                <button class="seg-btn active" data-view="all">知识+剪藏</button>
                <button class="seg-btn" data-view="knowledge">仅知识</button>
            </div>
            <button class="sync-btn" id="snapBtn" title="拖动对齐网格（可开关）">格子吸附</button>
            <button class="sync-btn" id="syncBtn">刷新关系</button>
        </div>
        <span class="nav-hint">右键新建 · 空白拖动框选 · 空格拖动平移 · 拖拽定位 · 双击编辑</span>
    </nav>

    <div class="graph-container" id="graphContainer">
        <div class="loading" id="loadingEl">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
        <div class="empty-state" id="emptyEl" style="display:none;">
            <div class="icon">🕸️</div>
            <h3 id="emptyTitle">暂无图谱数据</h3>
            <p id="emptyDesc">请先创建剪藏或知识条目并建立关联</p>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="dot clip-dot"></span>剪藏</div>
            <div class="legend-item"><span class="dot kno-dot"></span>知识</div>
            <div class="legend-item"><span class="tri"></span>学习计划</div>
            <div class="legend-item"><span class="dot" style="background:#fbbf24;"></span>便签</div>
            <div class="legend-item"><span class="dot" style="background:#22d3ee;"></span>链接</div>
            <div class="legend-item"><span class="dot" style="background:#a78bfa;"></span>图片</div>
            <div class="legend-item"><span class="lmark derived-line"></span>来源</div>
            <div class="legend-item"><span class="lmark linked-line"></span>关联</div>
            <div class="legend-item"><span class="lmark plan-line"></span>计划关联</div>
            <div class="legend-item"><span class="lmark" style="border-top-color:#a78bfa;"></span>手动连线</div>
        </div>
    </div>

    <!-- 画布右键菜单（空白处） -->
    <div class="canvas-menu" id="canvasMenu" style="display:none;">
        <button data-action="add-note">📝 新建便签</button>
        <button data-action="add-link">🔗 新建链接</button>
        <button data-action="add-image">🖼️ 新建图片</button>
        <div class="divider"></div>
        <button data-action="add-ref">📌 引用已有节点</button>
    </div>
    <!-- 节点右键菜单 -->
    <div class="canvas-menu" id="nodeMenu" style="display:none;">
        <button data-action="link-from">🔗 从此节点连线</button>
        <button data-action="edit-node">✏️ 编辑内容</button>
        <div class="divider"></div>
        <button data-action="group" id="groupAction" style="display:none;">📦 组成分组</button>
        <button data-action="delete-node" class="danger">🗑️ 删除节点</button>
    </div>
    <!-- 连线右键菜单 -->
    <div class="canvas-menu" id="edgeMenu" style="display:none;">
        <button data-action="delete-edge" class="danger">🗑️ 删除连线</button>
    </div>
    <!-- 分组 frame 右键菜单 -->
    <div class="canvas-menu" id="groupMenu" style="display:none;">
        <button data-action="rename-group">✏️ 重命名分组</button>
        <div class="divider"></div>
        <button data-action="dissolve-group" class="danger">💠 解散分组</button>
    </div>

    <!-- 画布节点 新建/编辑/引用 弹窗 -->
    <div class="canvas-modal-mask" id="canvasModalMask" style="display:none;">
        <div class="canvas-modal">
            <div class="canvas-modal-title" id="canvasModalTitle"></div>
            <div class="canvas-modal-body" id="canvasModalBody"></div>
            <div class="canvas-modal-actions">
                <button class="modal-btn" id="canvasModalCancel">取消</button>
                <button class="modal-btn ok" id="canvasModalOk">确定</button>
            </div>
        </div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div class="panel-header">
            <h3 id="panelTitle">节点详情</h3>
            <button class="close-btn" id="panelCloseBtn">✕</button>
        </div>
        <div class="panel-body">
            <div class="label">类型</div>
            <div class="summary-text" id="panelMeta" style="margin-bottom:14px;"></div>
            <div class="label">摘要</div>
            <div class="summary-text" id="panelSummary">暂无摘要</div>
            <div class="label">标签</div>
            <div class="tags-row" id="panelTags"></div>
        </div>
        <div class="panel-footer">
            <a class="detail-link" id="panelDetailLink" href="#">查看详情</a>
        </div>
    </div>

    <script src="knowledge-graph.js"></script>
    <script>
      (function() {
        const THEME_KEY = 'app_theme_v1';
        const APPEARANCE_KEY = 'app_appearance_v1';
        function getEffective() {
          const app = localStorage.getItem(APPEARANCE_KEY) || 'notion';
          if (app === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'notion';
          return app;
        }
        function apply() {
          const t = getEffective();
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : (t === 'regular' ? 'regular' : 'notion'));
          if (typeof window.onThemeChange === 'function') window.onThemeChange();
        }
        window.applyTheme = apply;
        apply();
        window.addEventListener('storage', function(e) {
          if (e.key === THEME_KEY || e.key === APPEARANCE_KEY) apply();
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
          if ((localStorage.getItem(APPEARANCE_KEY) || 'notion') === 'system') apply();
        });
      })();
    </script>
</body>
</html>
