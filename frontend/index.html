    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    <span>工具</span>
</button>
<script>
  (function() {
      const THEME_KEY = 'app_theme_v1';
      const APPEARANCE_KEY = 'app_appearance_v1'; // regular | dark | notion | system
      const MOTION_KEY = 'app_motion_v1'; // full | reduced

      const themeCore = window.CutShelterThemeCore;

      // ====== 主题管理 ======
      function getEffectiveTheme() {
        const appearance = localStorage.getItem(APPEARANCE_KEY) || 'notion';
        return themeCore.resolveAppearance(appearance, window.matchMedia('(prefers-color-scheme: dark)').matches);
      }

      function getMotion() {
        return themeCore.readStoredMotion(localStorage);
      }

      function themeFrames() {
        return [editorFrame, workspaceFrame, todoFrame, clipFrame, knowledgeFrame, wikiFrame, vaultFrame, settingsFrame, learningPlanFrame, toolsFrame, agentFrame, dataObservabilityFrame];
      }

      function broadcastThemeChange(theme, motion) {
        const msg = themeCore.buildThemeMessage(theme, motion);
        themeFrames().forEach(frame => {
          try { if (frame && frame.contentWindow) frame.contentWindow.postMessage(msg, '*'); } catch(e) {}
        });
      }

      function applyTheme(themeOverride, persist = true) {
        const theme = themeOverride || getEffectiveTheme();
        const motion = getMotion();
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-motion', motion);
        if (persist) {
          localStorage.setItem(THEME_KEY, theme);
          localStorage.setItem(MOTION_KEY, motion);
        }
        // 广播主题变更到所有 iframe 子页面
        broadcastThemeChange(theme, motion);
        // 同步 Windows 原生标题栏 Overlay 按钮颜色到当前主题
        if (window.syncTitleBarOverlay) window.syncTitleBarOverlay();
      }

      function notifyAllFrames(message) {
        themeFrames().forEach(frame => {
          try { if (frame && frame.contentWindow) frame.contentWindow.postMessage(message, '*'); } catch(e) {}
        });
      }

      // 监听系统主题变化
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const appearance = localStorage.getItem(APPEARANCE_KEY) || 'light';
        if (appearance === 'system') {
          applyTheme(null, false);
        }
      });

      window.addEventListener('storage', event => {
        if (event.key === THEME_KEY || event.key === APPEARANCE_KEY || event.key === MOTION_KEY) {
          applyTheme(null, false);
        }
        if (event.key === 'active_workspace_id') {
          activeWorkspaceId = event.newValue || '';
          // 工作台选择由工作台模块管理，无需更新全局选择器
          notifyAllFrames({ action: 'workspaceChange', workspaceId: activeWorkspaceId });
        }
      });

      // 监听 iframe 子页面的主题变更消息
      window.addEventListener('message', event => {
        if (event.data && event.data.type === 'themeChanged') {
          applyTheme(event.data.theme, false);
        }
        if (event.data && event.data.type === 'appearanceChanged') {
          applyTheme(null, false);
        }
        if (event.data && event.data.type === 'openClipInEditor' && event.data.clipId) {
          pendingClipId = event.data.clipId;
          pendingClipAction = 'openClipInEditor';
          renderView('editor');
          window.history.pushState({ view: 'editor' }, '', '/');
          sendPendingClipToEditor();
        }
        if (event.data && event.data.type === 'openClipInNewTab' && event.data.clipId) {
          if (event.data.sourceFilePath) {
            // 有源文件路径：构造完整路径，通过 Electron API 读取文件
            var sourceFilePath = event.data.sourceFilePath;
            var clipId = event.data.clipId;
            window.electronAPI.getConfig().then(function(config) {
              var storagePath = config.storagePath || '';
              var fullPath = storagePath + '/obsidian-vault/' + sourceFilePath;
              window.electronAPI.openFileByPath(fullPath).then(function(result) {
                if (result && !result.canceled) {
                  renderView('editor');
                  window.history.pushState({ view: 'editor' }, '', '/');
                  sendToEditor({ type: 'openFileData', fileData: result });
                }
              }).catch(function(err) {
                console.error('[openClipInNewTab] 打开文件失败:', err);
                // fallback: 使用 clipId 从 API 获取
                pendingClipId = clipId;
                pendingClipAction = 'openClipInNewTab';
                renderView('editor');
                window.history.pushState({ view: 'editor' }, '', '/');
                sendPendingClipToEditor();
              });
            });
          } else {
            // 无源文件路径：回退到原逻辑（通过 clipId 从 API 获取）
            pendingClipId = event.data.clipId;
            pendingClipAction = 'openClipInNewTab';
            renderView('editor');
            window.history.pushState({ view: 'editor' }, '', '/');
            sendPendingClipToEditor();
          }
        }
        if (event.data && event.data.type === 'navigateKnowledge' && event.data.knowledgeId) {
          renderView('knowledge');
          window.history.pushState({ view: 'knowledge' }, '', '/knowledge');
          const kf = document.getElementById('knowledgeFrame');
          if (kf) kf.src = `knowledge-detail.html?id=${event.data.knowledgeId}`;
        }
        if (event.data && event.data.type === 'navigateKnowledgeGraph') {
          renderView('knowledge');
          window.history.pushState({ view: 'knowledge' }, '', '/knowledge');
          const kf = document.getElementById('knowledgeFrame');
          if (kf) kf.src = 'knowledge-graph.html';
        }
        if (event.data && event.data.type === 'navigateKnowledgeCreate') {
          renderView('knowledge');
          window.history.pushState({ view: 'knowledge' }, '', '/knowledge');
          const kf = document.getElementById('knowledgeFrame');
          if (kf) kf.src = 'knowledge-editor.html';
        }
        if (event.data && event.data.type === 'navigateLearningPlan' && event.data.planId) {
          renderView('learning-plan');
          window.history.pushState({ view: 'learning-plan' }, '', '/learning-plan');
          const lpf = document.getElementById('learningPlanFrame');
          if (lpf) lpf.src = `learning-plan.html?planId=${event.data.planId}`;
        }
        if (event.data && event.data.type === 'navigateModuleTool' && event.data.view) {
          // 工具模块子工具入口 → 跳回顶层视图（学习计划/数据观测/知识/Wiki/密码/牛马）
          const mv = event.data.view;
          const MV_ALLOWLIST = ['learning-plan', 'data-observability', 'knowledge', 'wiki', 'vault', 'agent'];
          if (MV_ALLOWLIST.includes(mv)) {
            renderView(mv);
            window.history.pushState({ view: mv }, '', '/' + mv);
          }
        }
        if (event.data && event.data.type === 'applyHeaderNav') {
          // 工具模块内配置「显示到顶栏/顺序」后刷新菜单头
          if (typeof applyHeaderNav === 'function') applyHeaderNav(event.data.tools);
        }
        if (event.data && event.data.type === 'openTextData') {
          renderView('editor');
          window.history.pushState({ view: 'editor' }, '', '/');
          sendToEditor({ type: 'openTextData', text: event.data.text || '', title: event.data.title || '' });
        }
        if (event.data && event.data.type === 'navigateClip') {
          renderView('clip');
          window.history.pushState({ view: 'clip' }, '', '/clip');
        }
        if (event.data && event.data.type === 'editorReady') {
          editorReady = true;
          sendPendingClipToEditor();
        }
        if (event.data && event.data.type === 'workspaceChanged' && event.data.workspaceId !== undefined) {
          activeWorkspaceId = event.data.workspaceId || '';
          localStorage.setItem('active_workspace_id', activeWorkspaceId);
          // 工作台选择由工作台模块管理，无需更新全局选择器
          // 通知所有子页面（除了workspace.html自身）
          [todoFrame, clipFrame, knowledgeFrame, wikiFrame, vaultFrame, learningPlanFrame].forEach(frame => {
            try { if (frame && frame.contentWindow) frame.contentWindow.postMessage({ action: 'workspaceChange', workspaceId: activeWorkspaceId }, '*'); } catch(e) {}
          });
        }
        if (event.data && event.data.type === 'editorClipSaved') {
          try { clipFrame.contentWindow.postMessage({ action: 'refresh' }, '*'); } catch (e) {}
        }
        if (event.data && event.data.type === 'mascotChanged') {
          try { editorFrame.contentWindow.postMessage(event.data, '*'); } catch (e) {}
        }
        if (event.data && event.data.type === 'saveMarkdownFile' && event.data.text) {
          if (window.electronAPI && window.electronAPI.saveMarkdownFile) {
            window.electronAPI.saveMarkdownFile({
              text: event.data.text,
              suggestedName: event.data.suggestedName || '学习计划'
            });
          }
        }
      });

      // ====== 导航切换（SPA 路由 + 页面缓存） ======
      const navBtns = document.querySelectorAll('.titlebar-nav .nav-btn');
      const editorView = document.getElementById('editorView');
      const workspaceView = document.getElementById('workspaceView');
      const clipView = document.getElementById('clipView');
      const knowledgeView = document.getElementById('knowledgeView');
      const wikiView = document.getElementById('wikiView');
      const wikiFrame = document.getElementById('wikiFrame');
      const vaultView = document.getElementById('vaultView');
      const settingsView = document.getElementById('settingsView');
      const learningPlanView = document.getElementById('learningPlanView');
      const toolsView = document.getElementById('toolsView');
      const dataObservabilityView = document.getElementById('dataObservabilityView');
      const editorFrame = document.getElementById('editorFrame');
      const workspaceFrame = document.getElementById('workspaceFrame');
      const knowledgeFrame = document.getElementById('knowledgeFrame');
      const vaultFrame = document.getElementById('vaultFrame');
      const settingsFrame = document.getElementById('settingsFrame');
      const learningPlanFrame = document.getElementById('learningPlanFrame');
      const toolsFrame = document.getElementById('toolsFrame');
      const dataObservabilityFrame = document.getElementById('dataObservabilityFrame');
      const scrollTools = document.getElementById('scrollTools');

      // 收纳进工具中心的模块子工具视图：进入后显示「返回工具」按钮
      const MODULE_BACK_VIEWS = ['knowledge', 'wiki', 'vault', 'agent', 'learning-plan', 'data-observability'];

      let activeIframe = null;
      let currentView = 'editor';
      let pendingClipId = null;
      let pendingClipAction = null;
      let editorReady = false;
      let activeWorkspaceId = localStorage.getItem('active_workspace_id') || '';
      const todoFrame = document.getElementById('todoFrame');
      const clipFrame = document.getElementById('clipFrame');

      applyTheme(null, false);

      const viewMap = {
        editor: editorView,
        workspace: workspaceView,
        clip: clipView,
        knowledge: knowledgeView,
        wiki: wikiView,
        vault: vaultView,
        settings: settingsView,
        'learning-plan': learningPlanView,
        tools: toolsView,
        agent: agentView
        , 'data-observability': dataObservabilityView
      };
      const VIEW_IFRAME = {
        editor: [editorFrame],
        workspace: [workspaceFrame],
        clip: [todoFrame, clipFrame],
        knowledge: [knowledgeFrame],
        wiki: [wikiFrame],
        vault: [vaultFrame],
        settings: [settingsFrame],
        'learning-plan': [learningPlanFrame],
        tools: [toolsFrame],
        agent: [agentFrame]
        , 'data-observability': [dataObservabilityFrame]
      };
      const allPanels = Object.values(viewMap);

      function ensureFramesLoaded(view) {
        (VIEW_IFRAME[view] || []).forEach(frame => {
          if (!frame || frame === agentFrame) return;   // agentFrame 由 DSH sidecar 就绪后按需加载
          if (frame.dataset.src) {
            frame.src = frame.dataset.src;
            delete frame.dataset.src;
          }
        });
      }

      function renderView(view) {
        const normalizedView = viewMap[view] ? view : 'editor';
        currentView = normalizedView;
        document.querySelectorAll('.titlebar-nav .nav-btn').forEach(n => n.classList.remove('active'));
        const targetBtn = document.querySelector(`.nav-btn[data-view="${normalizedView}"]`);
        if (targetBtn) targetBtn.classList.add('active');

        // 隐藏所有 view panel（用 visibility 而非 display，避免 iframe 重新加载）
        allPanels.forEach(p => p.classList.add('view-panel-hidden'));

        scrollTools.style.display = normalizedView === 'editor' ? 'none' : 'flex';
        // 模块子工具视图（收纳进工具中心的模块）显示「返回工具」按钮
        const moduleBackBtn = document.getElementById('moduleBackBtn');
        if (moduleBackBtn) {
          // 已「显示到顶栏」的子模块从顶栏入口进入，无需再显示返回工具按钮
          const isModuleSub = MODULE_BACK_VIEWS.indexOf(normalizedView) !== -1 && pinnedHeaderViews.indexOf(normalizedView) === -1;
          moduleBackBtn.style.display = isModuleSub ? 'flex' : 'none';
          moduleBackBtn.classList.toggle('agent', normalizedView === 'agent');
        }
        ensureFramesLoaded(normalizedView);
        viewMap[normalizedView].classList.remove('view-panel-hidden');
        activeIframe = normalizedView === 'clip' ? null : (VIEW_IFRAME[normalizedView]?.[0] || null);

        // 切回剪藏视图时通知剪藏页刷新关联知识（解决创建知识后卡在"加载中…"的问题）
        if (normalizedView === 'clip' && clipFrame && clipFrame.contentWindow) {
          clipFrame.contentWindow.postMessage({ action: 'refreshKnowledge' }, '*');
        }
        // 切换到 牛马视图：按需启动/复用 DSH sidecar，并同步状态
        if (normalizedView === 'agent') {
          ensureDshAgentRuntime();
        }
      }

      // ===== 牛马（Agent）面板逻辑：DSH sidecar 状态 + 主题适配 =====
      const AGENT_PORT = 3081;
      const AGENT_INVERT_KEY = 'agent_frame_invert_v1';

      function applyAgentInvert() {
        const mode = localStorage.getItem(AGENT_INVERT_KEY) || 'auto';
        const theme = document.documentElement.getAttribute('data-theme');
        const btn = document.getElementById('agentThemeToggle');
        if (agentFrame) {
          agentFrame.classList.toggle('invert', mode === 'on');
          agentFrame.classList.toggle('auto-invert', mode === 'auto' && theme !== 'dark');
        }
        if (btn) {
          btn.classList.toggle('active', mode === 'on' || (mode === 'auto' && theme !== 'dark'));
          btn.title = mode === 'auto'
            ? '反色适配（跟随浅色主题）· 点击切换为常开/关闭'
            : (mode === 'on' ? '反色：常开 · 点击关闭' : '反色：关闭 · 点击恢复自动');
        }
      }

      // ===== 牛马（Agent）面板：进度交互（启动/复用 DSH） =====
      const AGENT_PROGRESS_EL = document.getElementById('agentProgress');
      const AGENT_PROGRESS_TEXT = document.getElementById('agentProgressText');
      const AGENT_CANCEL_BTN = document.getElementById('agentCancel');
      const AGENT_RETRY_BTN = document.getElementById('agentRetry');
      let agentEnsurePromise = null;   // 防止重复触发启动

      /**
       * 加载/重载 DSH iframe。
       * - src 为空或地址不同 → 直接设置 src（首次加载）；
       * - 已指向目标地址且 force=true → 强制重载（sidecar 可能重启过，或早期加载失败留下空白页）。
       */
      function loadAgentFrame(port, force) {
        if (!agentFrame) return;
        const url = 'http://127.0.0.1:' + (port || AGENT_PORT);
        if (!agentFrame.src || agentFrame.src.indexOf(url) === -1) {
          agentFrame.src = url;
        } else if (force) {
          agentFrame.src = agentFrame.src;
        }
      }

      function setAgentStatus(state, text) {
        const el = document.getElementById('agentStatus');
        if (!el) return;
        el.className = 'agent-status ' + state;   // on / off / starting
        el.innerHTML = '<span class="agent-dot"></span>' + text;
      }

      function showAgentProgress(text, { loading = false, error = false } = {}) {
        if (!AGENT_PROGRESS_EL) return;
        AGENT_PROGRESS_EL.hidden = false;
        AGENT_PROGRESS_EL.classList.toggle('loading', loading);
        AGENT_PROGRESS_EL.classList.toggle('error', error);
        if (AGENT_PROGRESS_TEXT) AGENT_PROGRESS_TEXT.textContent = text || '';
        if (AGENT_CANCEL_BTN) AGENT_CANCEL_BTN.hidden = !loading;
        if (AGENT_RETRY_BTN) AGENT_RETRY_BTN.hidden = !error;
      }
      function hideAgentProgress() {
        if (AGENT_PROGRESS_EL) AGENT_PROGRESS_EL.hidden = true;
      }

      /** 主进程进度广播 → 面板（detecting/installing/starting/ready/failed/need-install） */
      function handleAgentProgress(p) {
        if (!p || !p.state) return;
        const elapsed = p.elapsed ? `（已等待 ${p.elapsed} 秒）` : '';
        switch (p.state) {
          case 'detecting':
            setAgentStatus('starting', '检查 DSH 环境…');
            showAgentProgress(p.message + elapsed, { loading: true });
            break;
          case 'installing':
            setAgentStatus('starting', '正在安装 DSH…');
            showAgentProgress(p.message + elapsed, { loading: true });
            break;
          case 'starting':
            setAgentStatus('starting', '正在启动 DSH…');
            showAgentProgress(p.message + elapsed, { loading: true });
            break;
          case 'ready':
            setAgentStatus('on', p.message || '运行中');
            hideAgentProgress();
            // 用广播携带的真实端口加载面板（复用场景可能是 3080 而非固定 3081）
            loadAgentFrame(p.port || AGENT_PORT, true);   // 就绪后确保面板加载/重载
            break;
          case 'need-install':
            // 未装 dsh：CutShelter 不再代装，提示用户自助安装后重试
            setAgentStatus('off', '未检测到 DSH');
            showAgentProgress(p.message, { error: true });
            if (agentFrame) agentFrame.src = 'about:blank';
            break;
          case 'failed':
            setAgentStatus('off', '启动失败');
            showAgentProgress(p.message, { error: true });
            // 失败时清空 iframe，避免半加载的 DSH SPA 残留渲染出重复菜单；端口就绪后再真正加载
            if (agentFrame) agentFrame.src = 'about:blank';
            break;
        }
      }

      async function ensureDshAgentRuntime() {
        applyAgentInvert();
        // 缓存复用：状态已 on（DSH 运行中）时直接复用现有会话，不再重新探测并强制刷新
        // iframe，避免每次进入 牛马视图都重复加载，接近原生体验。
        const stEl = document.getElementById('agentStatus');
        if (stEl && stEl.classList.contains('on')) {
          // 缓存复用：先查实际运行端口（复用场景可能是 3080），再加载对应面板
          const resolvePort = async () => {
            try {
              const s = await window.electronAPI.dshAgentStatus();
              return (s && s.port) || AGENT_PORT;
            } catch (_) { return AGENT_PORT; }
          };
          const curPort = await resolvePort();
          loadAgentFrame(curPort, false);
          return Promise.resolve({ success: true, reused: true });
        }
        // 状态缓存未命中（首次进入/页面刷新后）但 DSH 实际已在运行：先探测真实端口，
        // 若已运行则直接收敛为「已复用」，避免误走 ensureDshAgent 的 detecting→starting 广播流，
        // 造成「实际已启动却显示『正在启动 DSH…』」的前端竞态。
        if (window.electronAPI && typeof window.electronAPI.dshAgentStatus === 'function') {
          try {
            const st = await window.electronAPI.dshAgentStatus();
            if (st && st.running) {
              setAgentStatus('on', '已复用现有实例（端口 ' + (st.port || AGENT_PORT) + '）');
              hideAgentProgress();
              loadAgentFrame(st.port || AGENT_PORT, false);
              return Promise.resolve({ success: true, reused: true });
            }
          } catch (_) { /* 探测失败走正常启动流程 */ }
        }
        if (!(window.electronAPI && typeof window.electronAPI.ensureDshAgent === 'function')) {
          // 纯浏览器模式：直接探测 3081（iframe 本身会显示连接状态）
          setAgentStatus('starting', '检测 127.0.0.1:' + AGENT_PORT + '…');
          showAgentProgress('检测 ' + AGENT_PORT + '…', { loading: true });
          try {
            await fetch('http://127.0.0.1:' + AGENT_PORT + '/', { mode: 'no-cors' });
            setAgentStatus('on', '运行中（端口 ' + AGENT_PORT + '）');
            hideAgentProgress();
            loadAgentFrame(AGENT_PORT, false);
          } catch (e) {
            setAgentStatus('off', '未检测到 DSH（' + AGENT_PORT + '），请先手动启动 dsh web');
            showAgentProgress('未检测到 DSH（' + AGENT_PORT + '）。请先手动执行 npx @deepseek-ai/dsh web，或确认网络后重试。', { error: true });
          }
          return;
        }
        // Electron 内：让主进程按需启动/复用 sidecar（端口 3081；未装时提示自助安装）
        if (agentEnsurePromise) return agentEnsurePromise;
        agentEnsurePromise = (async () => {
          setAgentStatus('starting', '启动 DSH Agent…');
          showAgentProgress('正在准备…', { loading: true });
          // 兜底探测：即使进度广播或 IPC 结果异常丢失，面板也应收敛到正确状态。
          // 每 2 秒探测一次 3081；一旦可访问且状态未就绪 → 置为运行中并加载面板。
          let probing = false;
          let probeCount = 0;
          const probeTimer = setInterval(async () => {
            if (probing) return;
            probing = true;
            probeCount++;
            try {
              if (stEl && stEl.classList.contains('on')) { clearInterval(probeTimer); return; }
              if (probeCount > 25) { clearInterval(probeTimer); return; }   // ~50s 上限
              await fetch('http://127.0.0.1:' + AGENT_PORT + '/', { mode: 'no-cors' });
              setAgentStatus('on', '运行中（端口 ' + AGENT_PORT + '）');
              hideAgentProgress();
              // 非强制加载：src 已指向目标地址时不重复刷新，仅首次（空/about:blank）才真正加载
              loadAgentFrame(AGENT_PORT, false);
              clearInterval(probeTimer);
            } catch (e) {
              // sidecar 尚未就绪，继续探测
            } finally {
              probing = false;
            }
          }, 2000);
          try {
            const r = await window.electronAPI.ensureDshAgent();
            clearInterval(probeTimer);
            if (r && r.success) {
              setAgentStatus('on', r.reused ? '已复用现有实例（端口 ' + r.port + '）' : '运行中（端口 ' + r.port + '）');
              hideAgentProgress();
              loadAgentFrame(r.port || AGENT_PORT, false);
            } else if (r && r.needInstall) {
              // 未装 dsh：提示自助安装后重试（与 need-install 广播一致的文案）
              setAgentStatus('off', '未检测到 DSH');
              showAgentProgress(r.message || '未检测到 DSH，请按说明自助安装后重试', { error: true });
              if (agentFrame) agentFrame.src = 'about:blank';
            } else {
              setAgentStatus('off', '启动失败');
              showAgentProgress('启动失败：' + ((r && r.message) || '未知错误'), { error: true });
            }
          } catch (e) {
            clearInterval(probeTimer);
            setAgentStatus('off', '启动失败');
            showAgentProgress('启动失败：' + e.message, { error: true });
          } finally {
            agentEnsurePromise = null;
          }
        })();
        return agentEnsurePromise;
      }

      function wireAgentPanel() {
        const toggle = document.getElementById('agentThemeToggle');
        if (toggle) {
          toggle.addEventListener('click', () => {
            const mode = localStorage.getItem(AGENT_INVERT_KEY) || 'auto';
            const next = mode === 'auto' ? 'on' : (mode === 'on' ? 'off' : 'auto');
            localStorage.setItem(AGENT_INVERT_KEY, next);
            applyAgentInvert();
          });
        }
        const reload = document.getElementById('agentReload');
        // 统一走单一路径重载，避免与其他重载入口叠加导致 DSH SPA 重复渲染菜单
        if (reload) reload.addEventListener('click', () => { loadAgentFrame(AGENT_PORT, true); });
        const ext = document.getElementById('agentOpenExternal');
        if (ext) ext.addEventListener('click', () => {
          if (window.electronAPI && typeof window.electronAPI.openExternal === 'function') {
            window.electronAPI.openExternal('http://127.0.0.1:' + AGENT_PORT);
          } else {
            window.open('http://127.0.0.1:' + AGENT_PORT, '_blank');
          }
        });
        // 取消安装/启动
        if (AGENT_CANCEL_BTN) {
          AGENT_CANCEL_BTN.addEventListener('click', async () => {
            if (window.electronAPI && typeof window.electronAPI.cancelDshAgent === 'function') {
              await window.electronAPI.cancelDshAgent();
            }
            hideAgentProgress();
            setAgentStatus('off', '已取消');
          });
        }
        // 失败后重试
        if (AGENT_RETRY_BTN) {
          AGENT_RETRY_BTN.addEventListener('click', () => {
            hideAgentProgress();
            ensureDshAgentRuntime();
          });
        }
        // 订阅主进程进度广播
        if (window.electronAPI && typeof window.electronAPI.onDshAgentProgress === 'function') {
          window.electronAPI.onDshAgentProgress(handleAgentProgress);
        }
      }
      wireAgentPanel();
      // 主题切换时同步 iframe 反色状态（CSS 变量已自适应，反色需 JS 刷新）
      const origApplyTheme = applyTheme;
      applyTheme = function (themeOverride, persist) {
        origApplyTheme(themeOverride, persist);
        applyAgentInvert();
      };

      function pathToView(path) {
        const clean = path.replace(/\/$/, '');
        if (clean === '' || clean === '/editor') return 'editor';
        if (clean === '/workspace') return 'workspace';
        if (clean === '/clip') return 'clip';
        if (clean === '/knowledge') return 'knowledge';
        if (clean === '/wiki') return 'wiki';
        if (clean === '/settings') return 'settings';
        if (clean === '/vault') return 'vault';
        if (clean === '/learning-plan') return 'learning-plan';
        if (clean === '/tools') return 'tools';
        if (clean === '/agent') return 'agent';
        if (clean === '/data-observability') return 'data-observability';
        return 'editor';
      }

      navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const view = btn.dataset.view;
          renderView(view);
          if (window.history.pushState) {
            window.history.pushState({ view }, '', view === 'editor' ? '/' : `/${view}`);
          }
        });
      });

      // 动态固定到菜单头的子模块按钮（知识/Wiki/密码/牛马/学习计划/数据观测）→ 由 tools 模块 via config 配置
      // 每个待固定模块的图标/文案定义；渲染到「工具」之后、也即 settings 之前
      const PINNABLE_NAV = {
        knowledge: { label: '知识', title: '知识库管理：维护知识笔记与标签', svg: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>' },
        wiki: { label: 'Wiki', title: 'Wiki 知识库：结构化文档协作空间', svg: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h6M8 15h4"/>' },
        vault: { label: '密码', title: '密码保险库：查看与搜索凭据记录', svg: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' },
        agent: { label: '牛马', title: '牛马：内嵌 DeepSeek Harness Agent（本地 3081）', svg: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>' },
        'learning-plan': { label: '学习计划', title: '学习计划：维护学习目标与计划', svg: '<path d="M20 6H9a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h11V6z"/><path d="M7 4h13V2H6a2 2 0 0 0-2 2v16" transform="translate(0 1)"/>' },
        'data-observability': { label: '数据观测台', title: '数据观测台：查看使用习惯与事件统计', svg: '<path d="M18 20V10M12 20V4M6 20v-6"/>' }
      };
      // 依据 tools 模块写入的 navHeaderTools 配置动态渲染固定到菜单头的子模块按钮
      function applyHeaderNav(list) {
        const navEl = document.getElementById('titlebarNav');
        if (!navEl) return;
        // 先移除旧的动态固定按钮（data-view 在 PINNABLE_NAV 定义的）
        navEl.querySelectorAll('.nav-btn.th-pinned').forEach(n => n.remove());
        const arr = Array.isArray(list) ? list : [];
        const settingsBtn = navEl.querySelector('.nav-btn[data-view="settings"]');
        // 按 order 排序后插入到 settings 之前
        const sorted = arr
          .filter(function (it) { return it && PINNABLE_NAV[it.view] && it.show !== false && !FIXED_HEADER_VIEWS.includes(it.view); })
          .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
        // 记录被固定到顶栏的子模块视图，供返回按钮判断是否需要隐藏
        pinnedHeaderViews = sorted.map(function (it) { return it.view; });
        sorted.forEach(function (it) {
          const def = PINNABLE_NAV[it.view];
          const btn = document.createElement('button');
          btn.className = 'nav-btn th-pinned';
          btn.dataset.view = it.view;
          btn.title = (it.label || def.label);
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + def.svg + '</svg>' + (it.label || def.label);
          btn.addEventListener('click', () => {
            renderView(it.view);
            if (window.history.pushState) window.history.pushState({ view: it.view }, '', '/' + it.view);
          });
          if (settingsBtn && settingsBtn.parentNode) settingsBtn.before(btn);
          else navEl.appendChild(btn);
        });
        // 让当前视图的高亮保持正确
        renderView(currentView);
      }
      // 固定的菜单头主入口（不参与固定模块，避免重复）
      const FIXED_HEADER_VIEWS = ['editor', 'workspace', 'clip', 'tools', 'settings'];
      // 被「显示到顶栏」固定的子模块视图集合；处于该集合的视图从顶栏进入，无需再显示返回工具按钮
      let pinnedHeaderViews = [];
      // 初次加载时从主进程配置读取 navHeaderTools 并渲染
      if (window.electronAPI && typeof window.electronAPI.getConfig === 'function') {
        window.electronAPI.getConfig().then(function (cfg) {
          applyHeaderNav((cfg && cfg.navHeaderTools) || []);
        }).catch(function () { });
      }

      window.addEventListener('popstate', () => {
        renderView(pathToView(window.location.pathname));
      });

      // 滚动工具按钮事件
      document.getElementById('btnScrollTop').addEventListener('click', () => {
        if (activeIframe) {
          activeIframe.contentWindow.postMessage({action: 'scrollToTop'}, '*');
        } else if (currentView === 'clip') {
          // 剪藏工作台同时控制待办和剪藏两个 iframe
          if (todoFrame && todoFrame.contentWindow) todoFrame.contentWindow.postMessage({action: 'scrollToTop'}, '*');
          if (clipFrame && clipFrame.contentWindow) clipFrame.contentWindow.postMessage({action: 'scrollToTop'}, '*');
        }
      });
      // 强制刷新：对当前模块 iframe 发 hardRefresh，由模块自己保存滚动 → location.reload() → 渲染后恢复滚动
      function hardRefreshActive() {
        if (currentView === 'agent') {
          // 牛马视图：跨域 iframe，走单一路径重载
          loadAgentFrame(AGENT_PORT, true);
          return;
        }
        if (currentView === 'vault') {
          // 密码模块不参与强刷（重载会回解锁屏），保持旧 refresh 行为
          if (vaultFrame && vaultFrame.contentWindow) vaultFrame.contentWindow.postMessage({ action: 'refresh' }, '*');
          return;
        }
        if (currentView === 'clip') {
          // 剪藏工作台同时强刷待办和剪藏两个 iframe
          if (todoFrame && todoFrame.contentWindow) todoFrame.contentWindow.postMessage({ action: 'hardRefresh', module: 'todo' }, '*');
          if (clipFrame && clipFrame.contentWindow) clipFrame.contentWindow.postMessage({ action: 'hardRefresh', module: 'clip' }, '*');
          return;
        }
        if (activeIframe) {
          activeIframe.contentWindow.postMessage({ action: 'hardRefresh', module: currentView }, '*');
        }
      }
      document.getElementById('btnRefresh').addEventListener('click', () => {
        hardRefreshActive();
      });
      // 模块子工具「返回工具」按钮：回到工具模块
      document.getElementById('moduleBackBtn').addEventListener('click', () => {
        renderView('tools');
        if (window.history.pushState) window.history.pushState({ view: 'tools' }, '', '/tools');
      });

      // 初始路由
      (function () {
        const view = pathToView(window.location.pathname);
        renderView(view);
        window.history.replaceState({ view }, '', view === 'editor' ? '/' : `/${view}`);
      })();

      function sendPendingClipToEditor() {
        if (!pendingClipId || !editorReady || !editorFrame || !editorFrame.contentWindow) return;
        editorFrame.contentWindow.postMessage({ action: pendingClipAction || 'openClipInEditor', clipId: pendingClipId }, '*');
        pendingClipId = null;
        pendingClipAction = null;
      }

      // 发送消息到编辑器 iframe；编辑器未就绪时等待其加载完成再发送
      function sendToEditor(payload) {
        if (!editorFrame) return;
        const send = () => {
          try { editorFrame.contentWindow.postMessage(payload, '*'); } catch (e) {}
        };
        if (editorReady && editorFrame.contentWindow && editorFrame.contentWindow.document.readyState === 'complete') {
          send();
          return;
        }
        // 编辑器尚未就绪：轮询等待 editorReady 标志置位
        let attempts = 0;
        const timer = setInterval(() => {
          attempts++;
          if (editorReady || attempts > 50) {
            clearInterval(timer);
            send();
          }
        }, 100);
      }

      editorFrame.addEventListener('load', () => {
        editorReady = false;
        // 子页脚本可能在 iframe load 事件前已发送 ready；主动握手可消除该时序窗口。
        editorFrame.contentWindow.postMessage({ action: 'editorPing' }, '*');
      });

      // 截图工具：OCR 结果 → 编辑器新标签打开（主进程 IPC 事件）
      if (window.electronAPI && window.electronAPI.onScreenshotOpenInEditor) {
        window.electronAPI.onScreenshotOpenInEditor((data) => {
          renderView('editor');
          window.history.pushState({ view: 'editor' }, '', '/editor');
          sendToEditor({
            type: 'openTextData',
            text: (data && data.text) || '',
            title: (data && data.title) || 'OCR 识别结果'
          });
        });
      }

      // 截图模块后台动作提示（OCR 失败/未就绪等，用户可见反馈）
      if (window.electronAPI && window.electronAPI.onScreenshotNotify) {
        window.electronAPI.onScreenshotNotify(function (data) {
          try {
            const msg = (data && data.message) || '';
            if (!msg) return;
            if (data.type === 'error') { showGlobalNotification(msg, 'error'); return; }
            if (data.type === 'warn') { showGlobalNotification(msg, 'warning'); return; }
            showGlobalNotification(msg, 'info');
          } catch (e) {}
        });
      }

      // 截图工具：OCR 组件未就绪 → 首次启动引导条（点击前往工具模块配置）
      if (window.electronAPI && window.electronAPI.onScreenshotOcrNeedsSetup) {
        window.electronAPI.onScreenshotOcrNeedsSetup(function (data) {
          try {
            if (sessionStorage.getItem('ocr-setup-notified')) return;
            sessionStorage.setItem('ocr-setup-notified', '1');
            showOcrSetupBar(data && data.reason);
          } catch (e) {}
        });
      }
      function showOcrSetupBar(reason) {
        if (!notifBar || !notifMsg) return;
        notifMsg.textContent = '🔤 ' + (reason || 'OCR 组件未就绪') + '（点击前往配置）';
        notifBar.className = 'global-notification-bar info';
        notifBar.style.display = 'block';
        notifBar.style.cursor = 'pointer';
        notifBar.onclick = function () {
          hideGlobalNotification();
          renderView('tools');
          window.history.pushState({ view: 'tools' }, '', '/tools');
        };
      }

      // ====== 窗口控制（仅 Electron 环境） ======
      // 懒加载 iframe：从 data-src 读取真实 URL 并设置 src
      // 注意：agentFrame（DSH 面板）跳过预加载——sidecar 可能尚未就绪，过早设置 src 会留下空白页；
      //       该面板统一由 loadAgentFrame() 在 DSH 就绪后按需设置/重载。
      function lazyLoadIframes() {
        document.querySelectorAll('iframe[data-src]').forEach(iframe => {
          if (iframe.id === 'agentFrame') return;
          iframe.src = iframe.dataset.src;
          iframe.removeAttribute('data-src');
        });
      }

      if (window.electronAPI) {
        // ====== 全局后端状态管理 ======
        var BACKEND_STATE = { STOPPED: 'stopped', STARTING: 'starting', READY: 'ready', ERROR: 'error' };
        var globalBackendState = BACKEND_STATE.STOPPED;

        // 全局后端状态 DOM
        var globalDot = document.getElementById('backendGlobalDot');
        var globalLabel = document.getElementById('backendGlobalLabel');
        var globalIndicator = document.getElementById('backendGlobalIndicator');
        var globalStartBtn = document.getElementById('backendGlobalStartBtn');

        // 全局通知栏
        var notifBar = document.getElementById('globalNotificationBar');
        var notifMsg = document.getElementById('notifMessage');

        /**
         * 更新全局后端状态指示器
         */
        function setGlobalBackendState(state, label) {
          globalBackendState = state;
          if (globalDot) {
            globalDot.className = 'backend-global-dot ' + state;
          }
          if (globalLabel) {
            globalLabel.textContent = label || state;
          }
          if (globalIndicator) {
            if (state === BACKEND_STATE.STOPPED) {
              globalIndicator.classList.add('show-start');
              globalIndicator.title = '后端服务未启动，点击启动';
            } else {
              globalIndicator.classList.remove('show-start');
              globalIndicator.title = '后端服务状态: ' + (label || state);
            }
          }
          // 广播后端状态到所有 iframe 子页面（剪藏/编辑器等图片上传按此状态分级提示）
          try {
            notifyAllFrames({ action: 'backendState', state: state, label: label || '' });
          } catch (e) {}
        }

        /**
         * 显示全局通知栏
         */
        function showGlobalNotification(message, type) {
          if (!notifBar || !notifMsg) return;
          notifMsg.textContent = message;
          notifBar.className = 'global-notification-bar ' + (type || 'info');
          notifBar.style.display = 'block';
          clearTimeout(notifBar._timer);
          // 自动隐藏
          notifBar._timer = setTimeout(function() {
            notifBar.style.display = 'none';
          }, 6000);
        }

        /**
         * 隐藏全局通知栏
         */
        function hideGlobalNotification() {
          if (notifBar) {
            notifBar.style.display = 'none';
            clearTimeout(notifBar._timer);
          }
        }

        // 关闭通知栏按钮
        document.getElementById('notifCloseBtn')?.addEventListener('click', hideGlobalNotification);

        // 点击通知栏关闭
        notifBar?.addEventListener('click', function(e) {
          if (e.target === notifBar || e.target === notifMsg) {
            hideGlobalNotification();
          }
        });

        /**
         * 手动启动后端（全局指示器）
         */
        function handleGlobalStartBackend() {
          if (globalBackendState === BACKEND_STATE.STARTING || globalBackendState === BACKEND_STATE.READY) return;
          setGlobalBackendState(BACKEND_STATE.STARTING, '后端启动中...');
          showGlobalNotification('正在启动后端服务，请稍候...', 'info');
          if (typeof window.electronAPI.startBackend === 'function') {
            window.electronAPI.startBackend().then(function(result) {
              if (result && result.success) {
                setGlobalBackendState(BACKEND_STATE.READY, '后端已就绪');
                showGlobalNotification('后端服务已就绪，所有功能可用', 'success');
              } else {
                setGlobalBackendState(BACKEND_STATE.ERROR, '后端启动失败');
                showGlobalNotification('后端启动失败: ' + (result ? result.message : '未知错误') + '，请检查配置后重试', 'error');
              }
            }).catch(function(err) {
              setGlobalBackendState(BACKEND_STATE.ERROR, '后端启动失败');
              showGlobalNotification('后端启动失败: ' + (err.message || '未知错误') + '，请检查配置后重试', 'error');
            });
          }
        }

        // 全局启动按钮点击
        globalStartBtn?.addEventListener('click', function(e) {
          e.stopPropagation();
          handleGlobalStartBackend();
        });
        // 指示器区域点击（点击标签也触发启动）
        globalIndicator?.addEventListener('click', function() {
          if (globalBackendState === BACKEND_STATE.STOPPED) {
            handleGlobalStartBackend();
          }
        });

        // 后端就绪标志：右键菜单动作需要调用后端 API
        var backendReadyFlag = false;
        function waitForBackend(timeoutMs) {
          return new Promise(function(resolve) {
            if (backendReadyFlag) return resolve(true);
            var start = Date.now();
            var timer = setInterval(function() {
              if (backendReadyFlag || Date.now() - start > timeoutMs) {
                clearInterval(timer);
                resolve(backendReadyFlag);
              }
            }, 200);
          });
        }

        // 简单 Toast 提示（成功/失败），让右键菜单动作结果可见
        function showToast(message, isError) {
          if (window.UI && UI.toast) {
            UI.toast(message, { type: isError ? 'error' : 'success', duration: 2500 });
            return;
          }
          var toast = document.getElementById('systemToast');
          if (!toast) {
            toast = document.createElement('div');
            toast.id = 'systemToast';
            toast.style.cssText = 'position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:99999;padding:10px 20px;border-radius:8px;font-size:13px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity 0.25s;pointer-events:none;max-width:80vw;word-break:break-all;';
            document.body.appendChild(toast);
          }
          toast.style.background = isError ? '#dc2626' : '#16a34a';
          toast.textContent = message;
          toast.style.opacity = '1';
          clearTimeout(toast._t);
          toast._t = setTimeout(function() { toast.style.opacity = '0'; }, 2500);
        }
        // 将常见网络错误替换为友好的中文提示
        function friendlyError(err) {
          if (window.UI && UI.friendlyError) return UI.friendlyError(err);
          var msg = String((err && err.message) || err);
          if (/Failed to fetch|fetch failed|NetworkError|ECONNREFUSED/i.test(msg)) {
            return '无法连接本地服务，请确认后端已启动（在标题栏点击"启动后端"）';
          }
          return msg;
        }

        // ====== 后端就绪 → 自动刷新子页面 ======
        // 已广播过 refresh 的 frame 集合，用于切断「refresh → 子页 reload → load → refresh」的无限循环
        var refreshedFrameSet = new Set();
        // 后端就绪处理是否已执行过（幂等：无论 handleBackendReady 被注册/触发多少次，
        // toast 与整页刷新广播只执行一次，避免后端就绪事件重复派发导致重复弹提示与重复刷新）
        var backendReadyHandled = false;
        function frameLoaded(frame) {
          try { return frame && frame.contentDocument && frame.contentDocument.readyState === 'complete'; } catch (e) { return false; }
        }
        function handleBackendReady() {
          // 每次触发都保持状态同步（幂等）：标记就绪 + 同步全局指示器与 backendState 广播（子页仅按需补载，无副作用）
          backendReadyFlag = true;
          setGlobalBackendState(BACKEND_STATE.READY, '后端已就绪');
          // 首次就绪才弹提示 + 广播一次整页刷新，后续重复触发直接忽略
          if (backendReadyHandled) return;
          backendReadyHandled = true;
          showGlobalNotification('后端服务已就绪，所有功能可用', 'success');
          refreshAllSubPages();
        }
        function refreshAllSubPages() {
          // 注意：不刷新 editorFrame（避免打断用户正在编辑的内容）
          [workspaceFrame, todoFrame, clipFrame, knowledgeFrame, wikiFrame, vaultFrame, learningPlanFrame, toolsFrame, dataObservabilityFrame, settingsFrame].forEach(function(frame) {
            try {
              if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({ action: 'refresh' }, '*');
                // 仅当 frame 已加载完成才标记为已广播；未加载完的交给下方 load 兜底补发
                if (frameLoaded(frame)) refreshedFrameSet.add(frame);
              }
            } catch (e) {}
          });
        }

        // ====== 启动流程 ======
        function dismissStartupOverlay() {
          var overlay = document.getElementById('startupOverlay');
          if (overlay) {
            overlay.classList.add('hidden');
            setTimeout(function() { overlay.style.display = 'none'; }, 500);
          }
        }

        // 加载子页面 iframe
        function lazyLoadIframes() {
          document.querySelectorAll('iframe[data-src]').forEach(function(iframe) {
            if (iframe.id === 'agentFrame') return;   // DSH 面板：就绪后按需加载
            iframe.src = iframe.dataset.src;
            iframe.removeAttribute('data-src');
          });
        }

        var overlay = document.getElementById('startupOverlay');
        var startupMsg = document.getElementById('startupMsg');
        var startupDots = document.getElementById('startupDots');
        var startupBar = document.getElementById('startupBar');

        // 始终先加载 iframe（前端页面不需要后端就绪）
        lazyLoadIframes();

        // 获取启动模式，决定后端行为
        if (typeof window.electronAPI.getStartupMode === 'function') {
          window.electronAPI.getStartupMode().then(function(mode) {
            if (mode === 'full') {
              // 完全启动模式：等待后端就绪再关闭遮罩
              startupMsg.textContent = '正在启动后端服务...';
              // 后端进度监听
              window.electronAPI.onBackendProgress(function(data) {
                startupMsg.textContent = data.message;
              });
              window.electronAPI.onBackendReady(function() {
                dismissStartupOverlay();
                handleBackendReady();
              });
              window.electronAPI.onBackendError(function(msg) {
                startupDots.style.display = 'none';
                startupBar.style.display = 'none';
                startupMsg.style.display = 'none';
                var status = document.getElementById('startupStatus');
                status.innerHTML = '<div class="startup-error">启动失败: ' + msg + '<br><button class="retry-btn" onclick="location.reload()">重试</button></div>';
                setGlobalBackendState(BACKEND_STATE.ERROR, '后端启动失败');
                showGlobalNotification('后端启动失败: ' + msg + '，请检查配置后重试', 'error');
              });
            } else if (mode === 'frontend-async-backend') {
              // 前端异步启动后端：快速关闭遮罩，后端后台启动
              startupMsg.textContent = '启动完成';
              startupDots.style.display = 'none';
              startupBar.style.display = 'none';
              setGlobalBackendState(BACKEND_STATE.STARTING, '后端启动中...');
              dismissStartupOverlay();
              showGlobalNotification('应用已启动，后端服务正在后台启动...', 'info');
              // 监听后端就绪
              window.electronAPI.onBackendReady(function() {
                handleBackendReady();
              });
              window.electronAPI.onBackendError(function(msg) {
                setGlobalBackendState(BACKEND_STATE.ERROR, '后端启动失败');
                showGlobalNotification('后端启动失败: ' + msg + '，请在标题栏点击"启动后端"重试', 'error');
              });
            } else {
              // frontend-only 模式：只启动前端，不启动后端
              startupMsg.textContent = '启动完成';
              startupDots.style.display = 'none';
              startupBar.style.display = 'none';
              dismissStartupOverlay();
              setGlobalBackendState(BACKEND_STATE.STOPPED, '未启动');
              // 检查后端是否意外已运行
              if (typeof window.electronAPI.isBackendRunning === 'function') {
                window.electronAPI.isBackendRunning().then(function(running) {
                  if (running) {
                    handleBackendReady();
                  } else {
                    showGlobalNotification('后端服务未启动，部分功能（AI、剪藏、知识库等）不可用，可在标题栏点击启动', 'warning');
                  }
                });
              }
            }
          }).catch(function() {
            // 获取模式失败，降级为 frontend-only
            dismissStartupOverlay();
            setGlobalBackendState(BACKEND_STATE.STOPPED, '未启动');
          });
        } else {
          // 非 Electron 环境，直接关闭遮罩
          dismissStartupOverlay();
        }

        // 统一监听后端就绪/错误事件（无论哪种模式，后端启动后都会触发）
        if (typeof window.electronAPI.onBackendReady === 'function') {
          window.electronAPI.onBackendReady(function() {
            handleBackendReady();
          });
        }
        if (typeof window.electronAPI.onBackendError === 'function') {
          window.electronAPI.onBackendError(function(msg) {
            setGlobalBackendState(BACKEND_STATE.ERROR, '后端启动失败');
            showGlobalNotification('后端启动失败: ' + msg + '，请在标题栏点击"启动后端"重试', 'error');
          });
        }
        // 监听系统通知（来自主进程的 show-notification 事件）
        if (typeof window.electronAPI.onShowNotification === 'function') {
          window.electronAPI.onShowNotification(function(data) {
            if (data && data.title && data.body) {
              showGlobalNotification(data.title + '：' + data.body, data.type || 'info');
            }
          });
        }

        // 时序竞态兜底：子页面 iframe 在 backend-ready 事件之后才加载完成时，补发一次 refresh。
        // 这些"晚加载"帧常在后端就绪前发起首屏请求而失败，必须用 refresh 驱动其恢复数据。
        // refreshedFrameSet 已切断「refresh → reload → load → refresh」循环，因此最多只补发一次。
        [workspaceFrame, todoFrame, clipFrame, knowledgeFrame, wikiFrame, vaultFrame, learningPlanFrame, toolsFrame, dataObservabilityFrame, settingsFrame].forEach(function(frame) {
          if (!frame) return;
          frame.addEventListener('load', function() {
            try {
              if (backendReadyFlag && frame.contentWindow && !refreshedFrameSet.has(frame)) {
                refreshedFrameSet.add(frame);
                frame.contentWindow.postMessage({ action: 'refresh' }, '*');
              }
            } catch (e) {}
          });
        });

        // ===== 平台类 + 原生标题栏 Overlay 主题同步 =====
        // 标题栏已改为系统原生拖拽（app-region），自绘按钮/拖拽/最大化图标逻辑一并移除。
        // 平台类供分平台 CSS（mac 交通灯让位 / win Overlay 让位）。
        if (window.electronAPI && window.electronAPI.platform) {
          document.body.classList.add('platform-' + window.electronAPI.platform);
        }

        // 同步 Windows titleBarOverlay 按钮颜色到当前主题（macOS 为 no-op）。
        // 在应用加载完成与每次主题切换后调用。
        const titlebarEl = document.getElementById('titlebar');
        function syncTitleBarOverlay() {
          if (!window.electronAPI || !window.electronAPI.setTitleBarOverlay) return;
          const cs = getComputedStyle(titlebarEl);
          const color = cs.getPropertyValue('--titlebar-bg').trim() || '#2d2d2d';
          const txt = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#d4d4d4';
          window.electronAPI.setTitleBarOverlay({ color, symbolColor: txt });
        }
        // 暴露到全局，供 applyTheme 主题切换时调用
        window.syncTitleBarOverlay = syncTitleBarOverlay;
        syncTitleBarOverlay();

        // ===== Ctrl/Cmd+Shift+R 强制刷新（忽略缓存） =====
        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'R' || e.key === 'r')) {
            e.preventDefault();
            window.electronAPI.forceReload();
          }
        });

        // ── 系统右键菜单事件处理 ──
        // 主页是唯一 IPC 监听者（编辑器 iframe 可能尚未加载，编辑器内不再重复监听），
        // 统一读取文件内容 → 请求后端 → 通过 postMessage 转发到对应视图执行业务功能。

        // 添加到剪藏收件箱：读取文件内容 → 后端入库 → 映射到编辑区
        if (window.electronAPI.onClipFile) {
          window.electronAPI.onClipFile(async function(filePath) {
            console.log('[System] 收到剪藏文件请求:', filePath);
            try {
              var result = await window.electronAPI.openFileByPath(filePath);
              if (!result || result.canceled) return;
              // 首启场景后端可能尚未就绪，等待就绪后再请求
              if (!backendReadyFlag) {
                showToast('后端服务未就绪，请稍后重试', true);
                showGlobalNotification('后端服务未就绪，请在标题栏启动后端后再试', 'warning');
                return;
              }
              var response = await fetch('http://127.0.0.1:8081/api/clip/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  content: result.text,
                  source: filePath,
                  title: result.fileName,
                  type: 'store-only',
                  captureMethod: 'context-menu'
                })
              });
              var data = await response.json();
              if (data.status === 'success') {
                console.log('[System] 文件已添加到剪藏收件箱:', result.fileName);
                showToast('已添加到收件箱：' + result.fileName);
              } else {
                showToast('添加到收件箱失败：' + (data.error || '未知错误'), true);
              }
              // 映射到编辑区：新标签页打开文件内容
              renderView('editor');
              window.history.pushState({ view: 'editor' }, '', '/');
              sendToEditor({ type: 'openFileData', fileData: result });
            } catch (err) {
              console.error('[System] 剪藏文件失败:', err);
              showToast('添加到收件箱失败：' + friendlyError(err), true);
            }
          });
        }

        // AI 解析并添加：读取文件内容 → 后端 AI 解析入库 → 映射到编辑区
        if (window.electronAPI.onAiClipFile) {
          window.electronAPI.onAiClipFile(async function(filePath) {
            console.log('[System] 收到 AI 解析文件请求:', filePath);
            try {
              var result = await window.electronAPI.openFileByPath(filePath);
              if (!result || result.canceled) return;
              // 首启场景后端可能尚未就绪，等待就绪后再请求
              if (!backendReadyFlag) {
                showToast('后端服务未就绪，请稍后重试', true);
                showGlobalNotification('后端服务未就绪，请在标题栏启动后端后再试', 'warning');
                return;
              }
              // /api/ingest 需要 text 字段（AI 自动识别意图后路由入库）
              var response = await fetch('http://127.0.0.1:8081/api/ingest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: result.text,
                  source: filePath,
                  title: result.fileName
                })
              });
              var data = await response.json();
              if (data.success) {
                console.log('[System] AI 解析完成，已添加到剪藏:', result.fileName);
                showToast('AI 解析完成，已入库：' + result.fileName);
              } else {
                showToast('AI 解析失败：' + (data.error || '未知错误'), true);
              }
              // 映射到编辑区：新标签页打开文件内容
              renderView('editor');
              window.history.pushState({ view: 'editor' }, '', '/');
              sendToEditor({ type: 'openFileData', fileData: result });
            } catch (err) {
              console.error('[System] AI 解析文件失败:', err);
              showToast('AI 解析失败：' + friendlyError(err), true);
            }
          });
        }

        // 用编辑器打开：读取文件内容并在新标签页打开（Ctrl+T 风格，不覆盖当前编辑区）
        // 注：主进程已做 open-editor 分发去重，此处再加同文件短时间去重双保险，
        //     避免同一文件被重复打开导致出现两个编辑器画布（Bug 修复）。
        var lastOpenEditorPath = null;
        var lastOpenEditorAt = 0;
        if (window.electronAPI.onOpenFileRequest) {
          window.electronAPI.onOpenFileRequest(async function(filePath) {
            console.log('[System] 收到编辑器打开请求:', filePath);
            var now = Date.now();
            if (filePath && filePath === lastOpenEditorPath && (now - lastOpenEditorAt) < 500) {
              console.log('[System] 忽略重复的编辑器打开请求:', filePath);
              return;
            }
            lastOpenEditorPath = filePath || null;
            lastOpenEditorAt = now;
            try {
              var result = await window.electronAPI.openFileByPath(filePath);
              if (!result || result.canceled) return;
              renderView('editor');
              window.history.pushState({ view: 'editor' }, '', '/');
              sendToEditor({ type: 'openFileData', fileData: result });
            } catch (err) {
              console.error('[System] 打开文件失败:', err);
            }
          });
        }

        // PDF OCR 识别：请求后端 → 在新标签页打开识别结果
        if (window.electronAPI.onPdfOcr) {
          window.electronAPI.onPdfOcr(async function(filePath) {
            console.log('[System] 收到 PDF OCR 请求:', filePath);
            try {
              if (!backendReadyFlag) {
                showToast('后端服务未就绪，请稍后重试', true);
                showGlobalNotification('后端服务未就绪，请在标题栏启动后端后再试', 'warning');
                return;
              }
              var response = await fetch('http://127.0.0.1:8081/api/pdf/ocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filePath: filePath })
              });
              var data = await response.json();
              if (data.success) {
                console.log('[System] PDF OCR 完成');
                var title = 'OCR 识别结果 - ' + filePath.split(/[/\\]/).pop();
                if (!data.text || data.text.trim().length === 0) {
                  showToast('OCR 未识别到文字（可能为空白页或加密 PDF）', true);
                } else {
                  showToast('PDF OCR 完成：' + filePath.split(/[/\\]/).pop());
                }
                renderView('editor');
                window.history.pushState({ view: 'editor' }, '', '/');
                sendToEditor({ type: 'openTextData', text: data.text || '', title: title });
              } else {
                showToast('PDF OCR 失败：' + (data.error || '未知错误'), true);
              }
            } catch (err) {
              console.error('[System] PDF OCR 失败:', err);
              showToast('PDF OCR 失败：' + friendlyError(err), true);
            }
          });
        }

        // 打开设置页面
        if (window.electronAPI.onOpenSettings) {
          window.electronAPI.onOpenSettings(function() {
            console.log('[System] 收到打开设置请求');
            renderView('settings');
            window.history.pushState({ view: 'settings' }, '', '/settings');
          });
        }
      } else {
        // 浏览器环境：隐藏遮罩 + 直接加载 iframe
        lazyLoadIframes();
        document.getElementById('startupOverlay').style.display = 'none';
      }
  })();
</script>
<script>
  // ====== 全局统一搜索（右侧全局操作区） ======
  // 复用主框架既有消息跳转机制：clip→openClipInNewTab（新标签打开，不覆盖当前画布）、
  // knowledge→navigateKnowledge、learning-plan→navigateLearningPlan。数据优先走本地索引 IPC（localIndex.searchAll）。
  (function () {
    const input = document.getElementById('globalSearchInput');
    const panel = document.getElementById('globalSearchPanel');
    const wrap = document.querySelector('.gsearch-input-wrap');
    if (!input || !panel) return;

    const TYPE_META = {
      clip:        { label: '剪藏',       color: '#3f8cff', action: function (h) { deliver({ type: 'openClipInNewTab', clipId: numericId(h.id) }); } },
      knowledge:   { label: '知识',       color: '#8b5cf6', action: function (h) { window.postMessage({ type: 'navigateKnowledge', knowledgeId: numericId(h.id) }, '*'); } },
      'learning-plan': { label: '学习计划', color: '#10b981', action: function (h) { window.postMessage({ type: 'navigateLearningPlan', planId: numericId(h.id) }, '*'); } }
    };
    const ORDER = ['clip', 'knowledge', 'learning-plan'];
    let allHits = [];   // 全部命中（用于分组与总计数）
    let flatHits = [];  // 实际渲染的行（与 data-index 严格对齐，用于键盘/点击导航）
    let activeIndex = -1;

    // 命中 id 形如 'clip:1' / 'knowledge:39' / 'learning-plan:21'，抽离纯数字源 id。
    function numericId(id) {
      const m = String(id || '').match(/(:|-)(\d+)$/);
      return m ? m[2] : id;
    }
    // clip 在编辑器中打开需走主框架的待处理消息链路。
    function deliver(msg) { window.postMessage(msg, '*'); }

    function getBridge() { return (window.electronAPI && window.electronAPI.localIndex) || null; }

    // 命中词高亮（大小写不敏感，HTML 安全转义）
    function highlight(text, q) {
      let safe = String(text || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
      const rq = String(q || '').trim();
      if (!rq) return safe;
      try {
        const re = new RegExp('(' + rq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
        safe = safe.replace(re, '<em>$1</em>');
      } catch (e) {}
      return safe;
    }

    function setLoading(on) {
      panel.innerHTML = '';
      if (!on) return;
      const empty = document.createElement('div');
      empty.className = 'gsearch-empty';
      empty.innerHTML = '<div class="gsearch-empty-icon">…</div>搜索中';
      panel.appendChild(empty);
      panel.classList.add('open');
    }

    // 构建单个结果项（带 data-index 供键盘导航）
    function buildRow(h, index, q) {
      const row = document.createElement('div');
      row.className = 'gsearch-item';
      row.setAttribute('data-index', String(index));
      const t = document.createElement('div');
      t.className = 'gsearch-item-title';
      const titleInner = document.createElement('span');
      titleInner.className = 'gsearch-item-title-text';
      titleInner.innerHTML = highlight(h.title || '未命名', q);
      const badge = document.createElement('span');
      badge.className = 'gsearch-item-badge ' + (h.type || 'clip');
      badge.textContent = (TYPE_META[h.type] || {}).label || h.type;
      t.appendChild(titleInner);
      t.appendChild(badge);
      const sn = document.createElement('div');
      sn.className = 'gsearch-item-snippet';
      sn.innerHTML = highlight(h.snippet || '', q);
      row.appendChild(t);
      row.appendChild(sn);
      row.addEventListener('click', () => { activateHits(index); });
      row.addEventListener('pointerenter', () => setActive(index));
      return row;
    }

    function render(hits, q) {
      panel.innerHTML = '';
      allHits = hits || [];
      flatHits = [];
      activeIndex = -1;
      const groups = { clip: [], knowledge: [], 'learning-plan': [] };
      allHits.forEach(h => { if (groups[h.type]) groups[h.type].push(h); });

      const count = allHits.length;
      // 面板头部：查询 + 计数
      if (count) {
        const head = document.createElement('div');
        head.className = 'gsearch-panel-head';
        const verb = document.createElement('span');
        verb.textContent = '搜「';
        const qNode = document.createElement('strong');
        qNode.textContent = q || '';
        const tail = document.createElement('span');
        tail.textContent = '」 · 共 ' + count + ' 条';
        head.appendChild(verb);
        head.appendChild(qNode);
        head.appendChild(tail);
        panel.appendChild(head);
      }

      let hasAny = false;
      ORDER.forEach(type => {
        const items = groups[type];
        if (!items.length) return;
        hasAny = true;
        const meta = TYPE_META[type];
        const sec = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'gsearch-group-title';
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = meta.color;
        const typeLabel = document.createElement('span');
        typeLabel.className = 'gsearch-group-type';
        typeLabel.textContent = meta.label;
        const c = document.createElement('span');
        c.className = 'gsearch-group-count';
        c.textContent = items.length + ' 条';
        title.appendChild(dot);
        title.appendChild(typeLabel);
        title.appendChild(c);
        sec.appendChild(title);
        items.slice(0, 12).forEach(h => {
          flatHits.push(h);
          sec.appendChild(buildRow(h, flatHits.length - 1, q));
        });
        panel.appendChild(sec);
      });

      if (!hasAny) {
        const empty = document.createElement('div');
        empty.className = 'gsearch-empty';
        empty.innerHTML = '<div class="gsearch-empty-icon">∅</div>未找到「<strong>' + (q || '') + '</strong>」的相关内容';
        panel.appendChild(empty);
      } else {
        // 底部：快捷键提示
        const foot = document.createElement('div');
        foot.className = 'gsearch-panel-foot';
        foot.innerHTML = '<span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↵</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span>';
        panel.appendChild(foot);
      }
      panel.classList.add('open');
    }

    // 键盘导航：在 flatHits（已渲染行）上维护高亮
    function setActive(i) {
      if (!flatHits.length) return;
      if (i < 0 || i >= flatHits.length) i = -1;
      activeIndex = i;
      panel.querySelectorAll('.gsearch-item').forEach(el => {
        const idx = Number(el.getAttribute('data-index') || -1);
        el.classList.toggle('active', idx === activeIndex);
        if (idx === activeIndex) el.scrollIntoView({ block: 'nearest' });
      });
    }
    function activateHits(i) {
      const def = flatHits[i];
      if (!def) return;
      (TYPE_META[def.type] || {}).action && TYPE_META[def.type].action(def);
      closePanel();
    }
    function moveActive(delta) {
      if (!flatHits.length) return;
      // 未选中态从列表首/尾开始；已选中态在区间内循环
      let next;
      if (activeIndex < 0) {
        next = delta > 0 ? 0 : flatHits.length - 1;
      } else {
        next = (activeIndex + delta + flatHits.length) % flatHits.length;
      }
      setActive(next);
    }

    function openPanel() { if (input.value.trim()) doSearch(); else { setLoading(false); panel.classList.add('open'); } }
    function closePanel() { panel.classList.remove('open'); input.blur(); }
    function clearActive() { panel.querySelectorAll('.gsearch-item.active').forEach(el => el.classList.remove('active')); activeIndex = -1; }

    function doSearch() {
      const q = input.value.trim();
      const bridge = getBridge();
      if (!q) { render([], ''); return; }
      setLoading(true);
      if (bridge && typeof bridge.searchAll === 'function') {
        bridge.searchAll(q, { topK: 36 })
          .then(res => {
            if (String(input.value).trim() !== q) return; // 请求已过期
            if (!(res && res.success)) { render([], q); return; }
            render(res.results || [], q);
          })
          .catch(() => { if (String(input.value).trim() === q) render([], q); });
      } else {
        panel.innerHTML = '';
        panel.classList.add('open');
        const empty = document.createElement('div');
        empty.className = 'gsearch-empty';
        empty.innerHTML = '<div class="gsearch-empty-icon">⚠</div>本地索引不可用，无法全局搜索';
        panel.appendChild(empty);
      }
    }

    let debounceTimer = null;
    input.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      if (!input.value.trim()) { render([], ''); return; }
      setLoading(true);
      debounceTimer = setTimeout(doSearch, 200);
    });
    input.addEventListener('focus', () => {
      if (input.value.trim()) doSearch(); else { setLoading(false); panel.classList.add('open'); }
    });
    // 失焦：延迟收起结果面板，避免点击结果项被 mousedown 触发的失焦抢先关掉
    let blurTimer = null;
    function scheduleClose() { clearTimeout(blurTimer); blurTimer = setTimeout(closePanel, 150); }
    input.addEventListener('blur', scheduleClose);
    // 点击结果面板时阻止 input 失焦（guard close 不掉），保证 click 能触发 activateHits
    panel.addEventListener('mousedown', (e) => { e.preventDefault(); clearTimeout(blurTimer); });
    input.addEventListener('click', (e) => e.stopPropagation());
    panel.addEventListener('click', (e) => { e.stopPropagation(); clearTimeout(blurTimer); });
    document.addEventListener('click', (e) => {
      // 点击非全局搜索区：仅收起结果面板，搜索框保持长驻
      if (!e.target.closest || !e.target.closest('.global-search')) {
        closePanel();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); closePanel(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); if (activeIndex >= 0) activateHits(activeIndex); else doSearch(); }
    });
    // ⌘K / Ctrl+K：聚焦搜索框
    // 注意：主界面主体为 iframe，焦点落在 iframe 内时父页面收不到 keydown，
    // 因此主进程已通过菜单加速键（CmdOrCtrl+K）→ focus-global-search 事件兜底聚焦。
    function focusSearch() {
      input.focus();
      input.select();
      openPanel();
    }
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        focusSearch();
      }
    });
    // 主进程菜单加速键触发（iframe 焦点场景）
    if (window.electronAPI && window.electronAPI.onFocusGlobalSearch) {
      window.electronAPI.onFocusGlobalSearch(focusSearch);
    }

    // 平台自适应快捷键提示（macOS ⌘K / Windows・Linux Ctrl K）
    (function () {
      const isMac = navigator.platform && /Mac/i.test(navigator.platform);
      const kbd = document.querySelector('.gsearch-kbd');
      const searchWrap = document.querySelector('.gsearch-input-wrap');
      if (kbd) kbd.textContent = isMac ? '⌘K' : 'Ctrl K';
      if (searchWrap) searchWrap.title = isMac ? '全局搜索（⌘K）' : '全局搜索（Ctrl K）';
    })();
  })();

  // ===== 支持快捷键的功能：悬停提示快捷键（按平台区分） =====
  // 覆盖标题栏中与快捷键对应的入口；系统级快捷键（F1 截图 / F2 贴图 / Alt+⬆X）由托盘提示承载。
  (function () {
    const isMac = navigator.platform && /Mac/i.test(navigator.platform);
    // 设置：⌘, / Ctrl ,
    document.querySelectorAll('.nav-btn[data-view="settings"]').forEach(el => {
      const base = el.getAttribute('title') || '应用设置：调整偏好与全局配置';
      el.title = base + '（' + (isMac ? '⌘,' : 'Ctrl ,') + '）';
    });
  })();
</script>
<script src="js/ui-common.js"></script>
</body>
</html>
