<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习计划</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="libs/mermaid.min.js"></script>
    <script src="libs/marked.min.js"></script>
    <style>
        :root {
            --primary: var(--app-primary);
            --primary-light: var(--app-primary-soft);
            --primary-dark: var(--app-primary-hover);
            --background: var(--app-bg);
            --surface: var(--app-surface);
            --surface-hover: var(--app-surface-hover);
            --text: var(--app-text);
            --text-secondary: var(--app-text-secondary);
            --text-muted: var(--app-text-muted);
            --border: var(--app-border);
            --border-light: var(--app-border-strong);
            --success: var(--app-success);
            --warning: var(--app-warning);
            --error: var(--app-danger);
            --radius: var(--app-radius);
            --radius-sm: var(--app-radius-sm);
            --shadow: var(--app-shadow-sm);
            --shadow-hover: var(--app-shadow-md);
            --transition: var(--app-duration-normal) var(--app-ease-smooth);
        }



                /* ===== Obsidian 风格全局滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 999px;
            transition: background 0.2s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border-light) transparent;
        }






        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* ====== Header ====== */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.85);
        }




        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .header h1 span { color: var(--primary); }
        .header-spacer { flex: 1; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--surface-hover); }
        .btn-danger {
            background: transparent;
            color: var(--error);
            border: 1px solid var(--error);
        }
        .btn-danger:hover { background: var(--error); color: #fff; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

        /* ====== Content ====== */
        .content {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px;
        }

        /* ====== Empty State ====== */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
        }
        .empty-state svg { width: 80px; height: 80px; color: var(--text-muted); margin-bottom: 20px; }
        .empty-state h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
        .empty-state p { color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem; }

        /* ====== Plan Card ====== */
        .plan-list {
            display: grid;
            gap: 16px;
        }
        .batch-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .batch-toolbar .batch-select-all {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .batch-toolbar .batch-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            flex: 1;
        }
        .batch-toolbar .btn-sm { padding: 4px 12px; font-size: 0.82rem; }
        .plan-card-checkbox {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
            display: none;
        }
        .plan-card.batch-mode { position: relative; }
        .plan-card.batch-mode .plan-card-checkbox { display: block; }
        .plan-card.batch-mode { cursor: default; }
        .plan-card.selected { border-color: var(--primary); background: var(--primary-light); }
        .plan-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .plan-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
            border-color: var(--primary);
        }
        .plan-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }
        .plan-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
        }
        .plan-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .plan-card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .plan-card-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .progress-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            min-width: 36px;
            text-align: right;
        }

        /* ====== Modal ====== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            width: 90%;
            max-width: 520px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-size: 1.15rem; font-weight: 600; }
        .modal-close {
            width: 32px; height: 32px;
            border: none; background: transparent;
            cursor: pointer; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .modal-close:hover { background: var(--surface-hover); }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--background);
            color: var(--text);
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ====== Loading ====== */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .loading-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            min-width: 320px;
        }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 0.95rem; color: var(--text-secondary); }
        .loading-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }

        /* ====== Detail View ====== */
        .detail-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .back-btn {
            width: 36px; height: 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition);
            flex-shrink: 0;
        }
        .back-btn:hover { background: var(--surface-hover); color: var(--text); }
        .detail-title {
            font-size: 1.4rem;
            font-weight: 700;
            flex: 1;
        }
        .detail-actions { display: flex; gap: 8px; }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .detail-meta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .detail-meta-item .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .detail-meta-item .value { font-size: 0.9rem; font-weight: 500; }

        /* ====== Mermaid ====== */
        .mermaid-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            overflow-x: auto;
            text-align: center;
        }
        .mermaid-container svg { max-width: 100%; }

        /* ====== Phase Card ====== */
        .phases-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .phase-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .phase-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .phase-card-header:hover { background: var(--surface-hover); }
        .phase-number {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .phase-info { flex: 1; min-width: 0; }
        .phase-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
        .phase-info .phase-goal { font-size: 0.8rem; color: var(--text-secondary); }
        .phase-weeks {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--border-light);
            padding: 2px 10px;
            border-radius: 12px;
            flex-shrink: 0;
        }
        .phase-chevron {
            color: var(--text-muted);
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .phase-card.expanded .phase-chevron { transform: rotate(180deg); }
        .phase-card-body {
            display: none;
            padding: 0 20px 20px;
            border-top: 1px solid var(--border-light);
        }
        .phase-card.expanded .phase-card-body { display: block; }

        .phase-progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }
        .phase-progress-row .progress-bar { flex: 1; }
        .phase-progress-row .progress-text { min-width: 40px; }
        .phase-complete-btn {
            padding: 6px 14px;
            border: 1px solid var(--success);
            border-radius: 6px;
            background: transparent;
            color: var(--success);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .phase-complete-btn.completed {
            background: var(--success);
            color: #fff;
        }
        .phase-complete-btn:hover { background: var(--success); color: #fff; }

        /* ====== Resource Cards ====== */
        .section-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            margin-top: 16px;
        }
        .resource-list { display: flex; flex-direction: column; gap: 8px; }
        .resource-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background: var(--background);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
        }
        .resource-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(63,140,255,0.1);
        }
        .resource-icon {
            width: 32px; height: 32px;
            border-radius: 6px;
            background: var(--primary-light);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
        }
        .resource-info { flex: 1; min-width: 0; }
        .resource-title {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 2px;
            line-height: 1.3;
        }
        .resource-snippet {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .resource-source {
            display: inline-block;
            font-size: 0.7rem;
            padding: 1px 8px;
            border-radius: 10px;
            margin-top: 4px;
            font-weight: 500;
        }
        .source-exa { background: #dcfce7; color: #166534; }
        .source-ai { background: #fef3c7; color: #92400e; }

        /* ====== Quiz & Tasks ====== */
        .quiz-item, .task-item {
            padding: 10px 14px;
            background: var(--background);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .quiz-type {
            display: inline-block;
            font-size: 0.7rem;
            padding: 1px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .quiz-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .quiz-option {
            padding: 4px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .task-difficulty {
            display: inline-flex;
            gap: 2px;
            margin-bottom: 6px;
        }
        .task-difficulty .star { color: var(--warning); font-size: 0.8rem; }
        .task-difficulty .star.off { color: var(--border); }
        .task-criteria {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
            padding-left: 8px;
            border-left: 2px solid var(--success);
        }

        /* ====== Builtin Badge ====== */
        .builtin-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--primary);
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 0.02em;
        }
        .builtin-badge svg {
            width: 10px;
            height: 10px;
        }

        /* ====== Detail Markdown Button ====== */
        .detail-markdown-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border: 1px solid var(--primary);
            border-radius: 6px;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.78rem;
            font-family: inherit;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .detail-markdown-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ====== Phase Link Blocks ====== */
        .phase-links-block {
            margin-top: 16px;
            padding: 12px 14px;
            background: var(--background);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
        }
        .phase-links-block .links-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .phase-links-block .links-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .phase-links-block .links-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-knowledge { background: var(--primary); }
        .dot-clip { background: var(--warning); }
        .phase-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.76rem;
            font-family: inherit;
            font-weight: 500;
            transition: var(--transition);
        }
        .phase-link-btn:hover { border-color: var(--primary); color: var(--primary); }
        .links-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .link-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.78rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            max-width: 260px;
        }
        .link-chip.clip-chip { background: rgba(233,162,59,0.12); color: #b07a1f; }
        .link-chip:hover { border-color: var(--primary); }
        .link-chip .chip-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .link-chip .chip-arrow { font-size: 0.7rem; opacity: 0.6; }
        .links-empty {
            font-size: 0.78rem;
            color: var(--text-muted);
            padding: 6px 0;
            cursor: pointer;
            transition: color 0.2s;
        }
        .links-empty:hover { color: var(--primary); }

        /* ====== Editor Open Button ====== */
        .editor-open-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.78rem;
            font-family: inherit;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .editor-open-btn:hover { border-color: var(--success); color: var(--success); }

        /* ====== Link Picker Modal ====== */
        .link-picker-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            animation: fadeIn 0.2s ease;
        }
        .link-picker-modal {
            background: var(--surface);
            border-radius: var(--radius);
            width: 92%;
            max-width: 560px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-hover);
            overflow: hidden;
        }
        .link-picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;

<script>
// ====== API Base ======
const API_BASE = 'http://127.0.0.1:8081/api/learning-plan';

// ====== State ======
let currentView = 'list'; // list | detail
let currentPlanId = null;
let plans = [];

// ====== Theme ======
const THEME_KEY = 'app_theme_v1';
const APPEARANCE_KEY = 'app_appearance_v1';

function getEffectiveTheme() {
    const appearance = localStorage.getItem(APPEARANCE_KEY) || 'notion';
    if (appearance === 'system') {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'notion';
    }
    return appearance;
}

function applyTheme() {
    const theme = getEffectiveTheme();
    const dataTheme = theme === 'dark' ? 'dark' : (theme === 'regular' ? 'regular' : 'notion');
    document.documentElement.setAttribute('data-theme', dataTheme);
    if (typeof mermaid !== 'undefined') {
        mermaid.initialize({ startOnLoad: false, theme: 'default' });
    }
}
applyTheme();

window.addEventListener('storage', (e) => {
    if (e.key === THEME_KEY || e.key === APPEARANCE_KEY) {
        applyTheme();
    }
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if ((localStorage.getItem(APPEARANCE_KEY) || 'notion') === 'system') {
        applyTheme();
    }
});

window.addEventListener('message', (e) => {
    if (e.data && e.data.action === 'themeChange') {
        applyTheme();
    }
    if (e.data && e.data.action === 'refresh') {
        loadPlans();
    }
    if (e.data && e.data.action === 'workspaceChange') {
        const wsId = e.data.workspaceId;
        if (wsId) {
            localStorage.setItem('active_workspace_id', wsId);
        } else {
            localStorage.removeItem('active_workspace_id');
        }
        loadPlans();
    }
});

// ====== API Calls ======
async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || res.statusText);
    }
    if (res.status === 204) return null;
    return res.json();
}

async function loadPlans() {
    try {
        let url = API_BASE;
        const wsId = localStorage.getItem('active_workspace_id');
        if (wsId) url += '?workspaceId=' + encodeURIComponent(wsId);
        plans = await apiFetch(url.replace(API_BASE, ''));
        renderList();
    } catch (e) {
        console.error('Failed to load plans:', e);
    }
}

// ====== Render List ======
let batchMode = false;
let selectedIds = new Set();

function renderList() {
    currentView = 'list';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('btnNewPlan').style.display = '';

    const listEl = document.getElementById('planList');
    const emptyEl = document.getElementById('emptyState');
    const toolbarEl = document.getElementById('batchToolbar');

    if (!plans || plans.length === 0) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        toolbarEl.style.display = 'none';
        return;
    }

    emptyEl.style.display = 'none';
    toolbarEl.style.display = batchMode ? 'flex' : 'none';

    listEl.innerHTML = plans.map(p => {
        const totalProgress = calcTotalProgress(p);
        const phaseCount = p.phases ? p.phases.length : 0;
        const completedCount = p.phases ? p.phases.filter(ph => ph.completed).length : 0;
        const date = p.createdAt ? new Date(p.createdAt).toLocaleDateString('zh-CN') : '';
        const isSelected = selectedIds.has(p.id);
        return `
            <div class="plan-card ${batchMode ? 'batch-mode' : ''} ${isSelected ? 'selected' : ''}" onclick="${batchMode ? `toggleSelect(${p.id})` : `showDetail(${p.id})`}">
                <input type="checkbox" class="plan-card-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect(${p.id})">
                <div class="plan-card-header">
                    <div class="plan-card-title">${escHtml(p.title)}${p.builtin ? '<span class="builtin-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16l-6.4 4.8L8 14l-6-4.8h7.6z"/></svg>内置</span>' : ''}</div>
                </div>
                <div class="plan-card-meta">
                    <span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                        ${phaseCount} 个阶段
                    </span>
                    <span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        ${p.totalWeeks} 周
                    </span>
                    <span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                        ${p.level === 'zero' ? '零基础' : p.level === 'beginner' ? '入门' : '中级'}
                    </span>
                    ${date ? `<span>${date}</span>` : ''}
                </div>
                <div class="plan-card-footer">
                    <div class="progress-bar">
                        <div class="progress-bar-fill" style="width:${totalProgress}%"></div>
                    </div>
                    <div class="progress-text">${totalProgress}%</div>
                    <span style="font-size:0.8rem;color:var(--text-muted);">${completedCount}/${phaseCount}</span>
                </div>
            </div>`;
    }).join('');

    updateBatchCount();
}

function enterBatchMode() {
    batchMode = true;
    selectedIds.clear();
    document.getElementById('btnBatchMode').style.display = 'none';
    renderList();
}

function cancelBatch() {
    batchMode = false;
    selectedIds.clear();
    document.getElementById('btnBatchMode').style.display = '';
    renderList();
}

function toggleSelect(id) {
    if (selectedIds.has(id)) {
        selectedIds.delete(id);
    } else {
        selectedIds.add(id);
    }
    renderList();
}

function toggleSelectAll(checked) {
    if (checked) {
        plans.forEach(p => selectedIds.add(p.id));
    } else {
        selectedIds.clear();
    }
    renderList();
}

function updateBatchCount() {
    const el = document.getElementById('batchCount');
    if (el) el.textContent = `已选 ${selectedIds.size} 项`;
    const cb = document.getElementById('selectAllCheckbox');
    if (cb) cb.checked = plans.length > 0 && selectedIds.size === plans.length;
}

async function batchDelete() {
    if (selectedIds.size === 0) { alert('请先选择要删除的计划'); return; }
    if (!confirm(`确定要删除选中的 ${selectedIds.size} 个学习计划吗？此操作不可恢复。`)) return;
    try {
        await apiFetch('/batch-delete', {
            method: 'POST',
            body: JSON.stringify({ ids: Array.from(selectedIds) })
        });
        batchMode = false;
        selectedIds.clear();
        await loadPlans();
    } catch (e) {
        alert('批量删除失败：' + e.message);
    }
}

function calcTotalProgress(plan) {
    if (!plan.phases || plan.phases.length === 0) return 0;
    const total = plan.phases.reduce((sum, p) => sum + (p.progress || 0), 0);
    return Math.round(total / plan.phases.length);
}

// ====== Render Detail ======
function showDetail(planId) {
    const plan = plans.find(p => p.id === planId);
    if (!plan) return;

    currentView = 'detail';
    currentPlanId = planId;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('btnNewPlan').style.display = 'none';

    const totalProgress = calcTotalProgress(plan);
    const phaseCount = plan.phases ? plan.phases.length : 0;
    const completedCount = plan.phases ? plan.phases.filter(ph => ph.completed).length : 0;
    const levelLabel = plan.level === 'zero' ? '零基础' : plan.level === 'beginner' ? '入门' : '中级';
    const goalLabel = { intro: '了解入门', project: '完成项目', job: '求职面试', portfolio: '构建作品集' }[plan.goal] || plan.goal;
    const date = plan.createdAt ? new Date(plan.createdAt).toLocaleDateString('zh-CN') : '';

    let html = `
        <div class="detail-header">
            <button class="back-btn" onclick="backToList()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="detail-title">${escHtml(plan.title)}</div>
            <div class="detail-actions">
                <button class="btn btn-secondary btn-sm" onclick="exportMarkdown()" title="导出为Markdown文件">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    导出为Markdown
                </button>
                <button class="btn btn-secondary btn-sm" onclick="openFolder()" title="打开文件所在位置">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    打开目录
                </button>
                <button class="btn btn-danger btn-sm" onclick="deletePlan(${plan.id})">删除</button>
            </div>
        </div>

        <div class="detail-meta">
            <div class="detail-meta-item">
                <span class="label">当前水平</span>
                <span class="value">${levelLabel}</span>
            </div>
            <div class="detail-meta-item">
                <span class="label">学习目标</span>
                <span class="value">${goalLabel}</span>
            </div>
            <div class="detail-meta-item">
                <span class="label">每周投入</span>
                <span class="value">${plan.hoursPerWeek} 小时</span>
            </div>
            <div class="detail-meta-item">
                <span class="label">预计周期</span>
                <span class="value">${plan.totalWeeks} 周</span>
            </div>
            <div class="detail-meta-item">
                <span class="label">总进度</span>
                <span class="value">${totalProgress}% (${completedCount}/${phaseCount})</span>
            </div>
            <div class="detail-meta-item">
                <span class="label">创建时间</span>
                <span class="value">${date}</span>
            </div>
        </div>`;

    // Mermaid 图
    if (plan.mermaidDiagram) {
        html += `<div class="mermaid-container"><div class="mermaid" id="mermaidDiagram">${escHtml(plan.mermaidDiagram)}</div></div>`;
    }

    // 阶段列表
    html += `<div class="phases-title">学习阶段 (${phaseCount})</div>`;

    if (plan.phases) {
        plan.phases.forEach(phase => {
            html += renderPhaseCard(phase);
        });
    }

    document.getElementById('detailView').innerHTML = html;
    document.getElementById('detailView').style.display = 'block';

    // 渲染 Mermaid
    if (plan.mermaidDiagram) {
        setTimeout(() => {
            try {
                mermaid.run({ querySelector: '#mermaidDiagram' });
            } catch(e) { console.warn('Mermaid render failed:', e); }
        }, 100);
    }
}

// ====== Phase Linked Knowledge / Clip ======
const LINK_TITLE_CACHE = {}; // "knowledge:{id}" / "clip:{id}" -> title

function renderPhaseLinks(phase) {
    const knowIds = phase.linkedKnowledgeIds || [];
    const clipIds = phase.sourceClipIds || [];
    let html = '';

    html += `
        <div class="phase-links-block">
            <div class="links-head">
                <span class="links-label"><span class="dot dot-knowledge"></span>关联知识 (${knowIds.length})</span>
                <button class="phase-link-btn" onclick="event.stopPropagation(); openLinkPicker(${phase.phaseNumber}, 'knowledge')">+ 关联</button>
            </div>
            ${knowIds.length === 0
                ? `<div class="links-empty" onclick="openLinkPicker(${phase.phaseNumber}, 'knowledge')">+ 关联知识</div>`
                : `<div class="links-chips">${knowIds.map(id => `
                    <span class="link-chip" title="点击查看知识" onclick="event.stopPropagation(); navigateKnowledge(${id})">
                        <span class="chip-title">${escHtml(LINK_TITLE_CACHE['knowledge:' + id] || ('知识 #' + id))}</span>
                        <span class="chip-arrow">→</span>
                    </span>`).join('')}</div>`}
        </div>
        <div class="phase-links-block">
            <div class="links-head">
                <span class="links-label"><span class="dot dot-clip"></span>关联剪藏 (${clipIds.length})</span>
                <button class="phase-link-btn" onclick="event.stopPropagation(); openLinkPicker(${phase.phaseNumber}, 'clip')">+ 关联</button>
            </div>
            ${clipIds.length === 0
                ? `<div class="links-empty" onclick="openLinkPicker(${phase.phaseNumber}, 'clip')">+ 关联剪藏</div>`
                : `<div class="links-chips">${clipIds.map(id => `
                    <span class="link-chip clip-chip" title="点击打开剪藏" onclick="event.stopPropagation(); openClip(${id})">
                        <span class="chip-title">${escHtml(LINK_TITLE_CACHE['clip:' + id] || ('剪藏 #' + id))}</span>
                        <span class="chip-arrow">→</span>
                    </span>`).join('')}</div>`}
        </div>`;

    // 异步为未知标题的 chip 补全标题
    knowIds.forEach(id => { if (!LINK_TITLE_CACHE['knowledge:' + id]) fetchKnowledgeTitle(id); });
    clipIds.forEach(id => { if (!LINK_TITLE_CACHE['clip:' + id]) fetchClipTitle(id); });

    return html;
}

async function fetchKnowledgeTitle(id) {
    try {
        const res = await fetch('http://127.0.0.1:8081/api/knowledge/' + id);
        if (!res.ok) { LINK_TITLE_CACHE['knowledge:' + id] = '知识 #' + id; return; }
        const k = await res.json();
        LINK_TITLE_CACHE['knowledge:' + id] = k.title || ('知识 #' + id);
        refreshPhaseChips();
    } catch (e) {
        LINK_TITLE_CACHE['knowledge:' + id] = '知识 #' + id;
    }
}

async function fetchClipTitle(id) {
    try {
        const res = await fetch('http://127.0.0.1:8081/api/clip/' + id);
        if (!res.ok) { LINK_TITLE_CACHE['clip:' + id] = '剪藏 #' + id; return; }
        const c = await res.json();
        LINK_TITLE_CACHE['clip:' + id] = (c.title || c.originalTitle || (c.content ? c.content.slice(0, 20) : '')) || ('剪藏 #' + id);
        refreshPhaseChips();
    } catch (e) {
        LINK_TITLE_CACHE['clip:' + id] = '剪藏 #' + id;
    }
}

function refreshPhaseChips() {
    if (currentView !== 'detail' || !currentPlanId) return;
    showDetail(currentPlanId);
}

function openClip(id) {

// ====== Link Picker ======
let pickerPhaseNum = null;
let pickerType = 'knowledge'; // knowledge | clip
let pickerOptions = [];        // {id, title, sub}
let pickerSelected = new Set();

async function openLinkPicker(phaseNum, type) {
    const plan = plans.find(p => p.id === currentPlanId);
    if (!plan) return;
    const phase = plan.phases ? plan.phases.find(ph => ph.phaseNumber === phaseNum) : null;
    if (!phase) return;

    pickerPhaseNum = phaseNum;
    pickerType = type;
    pickerSelected = new Set(type === 'knowledge' ? (phase.linkedKnowledgeIds || []) : (phase.sourceClipIds || []));
    document.getElementById('linkPickerTitle').textContent = type === 'knowledge' ? '关联知识' : '关联剪藏';
    document.getElementById('linkPickerSearch').value = '';
    switchLinkTab(type);
    loadLinkPickerOptions();
    document.getElementById('linkPickerOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeLinkPicker() {
    document.getElementById('linkPickerOverlay').style.display = 'none';
    document.body.style.overflow = '';
}

function switchLinkTab(type) {
    pickerType = type;
    document.getElementById('linkPickerSearch').value = '';
    document.getElementById('linkTabKnowledge').classList.toggle('active', type === 'knowledge');
    document.getElementById('linkTabClip').classList.toggle('active', type === 'clip');
    loadLinkPickerOptions();
}

async function loadLinkPickerOptions() {
    const listEl = document.getElementById('linkPickerList');
    listEl.innerHTML = '<div class="link-picker-empty">加载中...</div>';
    try {
        const url = pickerType === 'knowledge'
            ? 'http://127.0.0.1:8081/api/knowledge/list'
            : 'http://127.0.0.1:8081/api/clip/list';
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        pickerOptions = (data || []).map(item => ({
            id: item.id,
            title: pickerType === 'knowledge'
                ? (item.title || ('知识 #' + item.id))
                : (item.title || item.originalTitle || (item.content ? item.content.slice(0, 30) : '')) || ('剪藏 #' + item.id),
            sub: pickerType === 'knowledge'
                ? (item.category || '')
                : (item.category || '')
        }));
    } catch (e) {
        listEl.innerHTML = '<div class="link-picker-empty">加载失败：' + escHtml(e.message) + '</div>';
        return;
    }
    renderLinkPickerList();
}

function renderLinkPickerList() {
    const kw = (document.getElementById('linkPickerSearch').value || '').trim().toLowerCase();
    const listEl = document.getElementById('linkPickerList');
    const filtered = pickerOptions.filter(o => !kw || String(o.title).toLowerCase().includes(kw));

    if (filtered.length === 0) {
        listEl.innerHTML = '<div class="link-picker-empty">无匹配项</div>';
    } else {
        listEl.innerHTML = filtered.map(o => `
            <label class="link-picker-item">
                <input type="checkbox" ${pickerSelected.has(o.id) ? 'checked' : ''}
                    onchange="togglePickerSelect(${o.id}, this.checked)">
                <div style="flex:1;min-width:0;">
                    <div class="item-title">${escHtml(o.title)}</div>
                    ${o.sub ? `<div class="item-sub">${escHtml(o.sub)}</div>` : ''}
                </div>
            </label>`).join('');
    }
    renderPickerSelected();
}

function togglePickerSelect(id, checked) {
    if (checked) pickerSelected.add(id);
    else pickerSelected.delete(id);
    renderPickerSelected();
}

function renderPickerSelected() {
    const el = document.getElementById('linkPickerSelected');
    if (pickerSelected.size === 0) {
        el.innerHTML = '<span style="font-size:0.78rem;color:var(--text-muted);">未选择</span>';
        return;
    }
    const titleMap = {};
    pickerOptions.forEach(o => titleMap[o.id] = o.title);
    el.innerHTML = Array.from(pickerSelected).map(id => `
        <span class="sel-capsule">${escHtml(titleMap[id] || ('#' + id))}
            <span class="x" onclick="togglePickerSelect(${id}, false); renderLinkPickerList()">×</span>
        </span>`).join('');
}

async function savePhaseLinks() {
    if (pickerPhaseNum == null || !currentPlanId) return;
    try {
        const plan = plans.find(p => p.id === currentPlanId);
        const phase = plan && plan.phases ? plan.phases.find(ph => ph.phaseNumber === pickerPhaseNum) : null;
        const existingKnow = phase ? (phase.linkedKnowledgeIds || []) : [];
        const existingClip = phase ? (phase.sourceClipIds || []) : [];
        const body = pickerType === 'knowledge'
            ? { linkedKnowledgeIds: Array.from(pickerSelected), sourceClipIds: existingClip }
            : { linkedKnowledgeIds: existingKnow, sourceClipIds: Array.from(pickerSelected) };
        const res = await fetch(`http://127.0.0.1:8081/api/learning-plan/${currentPlanId}/phase/${pickerPhaseNum}/links`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        closeLinkPicker();
        await loadPlans();
        showDetail(currentPlanId);
    } catch (e) {
        alert('保存失败：' + e.message);
    }
}

async function createPlan() {

    if (!title) { alert('请输入学习主题'); return; }

    const level = document.getElementById('planLevel').value;
    const goal = document.getElementById('planGoal').value;

    const totalWeeks = parseInt(document.getElementById('planWeeks').value) || 8;

    hideCreateModal();
    showLoading('AI 正在生成学习路线图...', '分析主题，规划学习阶段');

// ====== Export Markdown ======
async function exportMarkdown() {
    const plan = plans.find(p => p.id === currentPlanId);
    if (!plan) return;

    const levelLabel = plan.level === 'zero' ? '零基础' : plan.level === 'beginner' ? '入门' : '中级';
    const goalLabel = { intro: '了解入门', project: '完成项目', job: '求职面试', portfolio: '构建作品集' }[plan.goal] || plan.goal;
    const date = plan.createdAt ? new Date(plan.createdAt).toLocaleDateString('zh-CN') : '';
    const totalProgress = calcTotalProgress(plan);

    let md = `# ${plan.title}\n\n`;
    md += `> **水平**: ${levelLabel} | **目标**: ${goalLabel} | **每周**: ${plan.hoursPerWeek}h | **周期**: ${plan.totalWeeks}周 | **进度**: ${totalProgress}%`;
    if (date) md += ` | **创建**: ${date}`;
    md += `\n\n`;

    if (plan.mermaidDiagram) {
        md += `---\n\n`;
        md += `## 学习路径图\n\n`;
        md += '```mermaid\n' + plan.mermaidDiagram + '\n```\n\n';
    }

    md += `---\n\n`;
    md += `## 学习阶段 (${plan.phases ? plan.phases.length : 0})\n\n`;

    if (plan.phases) {
        plan.phases.forEach(phase => {
            md += `### 阶段 ${phase.phaseNumber}: ${phase.title}\n\n`;
            md += `> **目标**: ${phase.goal} | **周期**: ${phase.estimatedWeeks} 周 | **进度**: ${phase.progress || 0}% ${phase.completed ? '✓ 已完成' : ''}\n\n`;

            if (phase.videos && phase.videos.length > 0) {
                md += `#### 推荐资源\n\n`;
                phase.videos.forEach(v => {
                    const src = v.source === 'exa' ? 'Exa' : 'AI';
                    md += `- [${v.title}](${v.url}) *[${src}]*`;
                    if (v.reason) md += ` — ${v.reason}`;
                    md += `\n`;
                    if (v.snippet) md += `  > ${v.snippet}\n`;
                });
                md += `\n`;
            }

            if (phase.knowledgeQuiz && phase.knowledgeQuiz.length > 0) {
                md += `#### 知识作业\n\n`;
                phase.knowledgeQuiz.forEach((q, i) => {
                    const type = q.type === 'choice' ? '选择' : '问答';
                    md += `${i + 1}. **[${type}]** ${q.question}\n`;
                    if (q.options && q.options.length > 0) {
                        q.options.forEach((opt, j) => {
                            md += `   - ${String.fromCharCode(65 + j)}. ${opt}\n`;
                        });
                    }
                    md += `\n`;
                });
            }

            if (phase.practiceTasks && phase.practiceTasks.length > 0) {
                md += `#### 实战任务\n\n`;
                phase.practiceTasks.forEach((t, i) => {
                    md += `${i + 1}. ${t.description} ${'★'.repeat(t.difficulty || 1)}\n`;
                    if (t.acceptanceCriteria) md += `   > 验收: ${t.acceptanceCriteria}\n`;
                });
                md += `\n`;
            }

            md += `---\n\n`;
        });
    }

    md += `*由 CutShelter 学习计划模块生成 | ${new Date().toLocaleString('zh-CN')}*\n`;

    const suggestedName = plan.title.replace(/[\\/:*?"<>|]/g, '_') + '_学习计划';

    // 尝试通过 postMessage 调用主进程保存对话框（Electron 环境）
    try {
        if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({
                type: 'saveMarkdownFile',
                text: md,
                suggestedName: suggestedName
            }, '*');
        } else {
            // 降级：浏览器下载
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = suggestedName + '.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    } catch (e) {
        console.error('Markdown export failed:', e);
        alert('导出失败: ' + e.message);
    }
}

// ====== Utils ======
function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ====== Detail Markdown Modal ======
function openDetailMarkdown(phaseNum) {
    const plan = plans.find(p => p.id === currentPlanId);
    if (!plan) return;
    const phase = plan.phases ? plan.phases.find(ph => ph.phaseNumber === phaseNum) : null;
    if (!phase || !phase.detailMarkdown) return;

    document.getElementById('detailMarkdownTitle').textContent = phase.title + ' - 产品说明';
    const contentEl = document.getElementById('detailMarkdownContent');
    try {
        contentEl.innerHTML = marked.parse(phase.detailMarkdown);
    } catch (e) {
        console.warn('Marked parse failed, using raw text:', e);
        contentEl.textContent = phase.detailMarkdown;
    }
    document.getElementById('detailMarkdownOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeDetailMarkdown() {
    document.getElementById('detailMarkdownOverlay').style.display = 'none';
    document.body.style.overflow = '';
}

// ====== Init ======
mermaid.initialize({ startOnLoad: false, theme: 'default' });
loadPlans().then(() => {
    const params = new URLSearchParams(window.location.search);
    const planId = params.get('planId');
    if (planId) {
        const id = Number(planId);
        if (plans.some(p => p.id === id)) {
            showDetail(id);
        } else {
            // 计划可能尚未加载，等待 loadPlans 完成后再试一次
            setTimeout(() => {
                if (plans.some(p => p.id === id)) showDetail(id);
            }, 800);
        }
    }
});
</script>
