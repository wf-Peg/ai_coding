<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools Hub - CutShelter</title>
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/ui-common.css">
<link rel="stylesheet" href="styles/tools.css">
</head>
<body>
<!-- 主题化 Toast（无标题栏，贴合全局主题） -->
<div id="thToast" style="display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;max-width:70vw;padding:10px 18px;border-radius:10px;font-size:13px;line-height:1.6;background:var(--app-surface);color:var(--app-text);border:1px solid var(--app-border);box-shadow:0 8px 28px rgba(0,0,0,0.18);white-space:pre-wrap;text-align:center;pointer-events:auto;"></div>
<!-- 主题化确认弹窗 -->
<div id="thConfirmMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:var(--app-surface);color:var(--app-text);border:1px solid var(--app-border);border-radius:12px;padding:20px 24px;min-width:300px;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,0.3);">
    <div id="thConfirmText" style="font-size:13.5px;line-height:1.7;margin-bottom:16px;white-space:pre-wrap;"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="thConfirmCancel" style="padding:7px 16px;border-radius:8px;border:1px solid var(--app-border);background:transparent;color:var(--app-text);cursor:pointer;font-size:12.5px;">取消</button>
      <button id="thConfirmOk" style="padding:7px 18px;border-radius:8px;border:none;background:var(--app-primary,#3f8cff);color:#fff;cursor:pointer;font-size:12.5px;">确认</button>
    </div>
  </div>
</div>
<!-- AI干活：dsh 自助安装说明浮层（前置检测激活，未装时展示） -->
<div id="agentInstallMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:var(--app-surface);color:var(--app-text);border:1px solid var(--app-border);border-radius:14px;padding:22px 26px;min-width:340px;max-width:480px;box-shadow:0 12px 40px rgba(0,0,0,0.3);">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <span style="font-size:22px;">🤖</span>
      <div style="font-size:15px;font-weight:600;">启用 AI 干活</div>
      <div class="th-status-dot off" id="agentInstallDot" style="margin-left:auto;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--app-border);">未安装</div>
    </div>
    <div id="agentInstallHint" style="font-size:13px;line-height:1.7;color:var(--app-text-secondary);margin-bottom:12px;"></div>
    <div style="font-size:12.5px;color:var(--app-text-secondary);margin-bottom:6px;">AI 干活依赖 DeepSeek Harness（DSH）。CutShelter 不再代为联网安装，请你在终端自助执行以下命令（免安装，首次会下载依赖）：</div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <input id="agentInstallCmd" readonly value="npx @deepseek-ai/dsh web" style="flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--app-border);background:var(--app-bg);color:var(--app-text);font-family:monospace;font-size:12px;outline:none;" />
      <button id="agentCopyCmd" style="padding:0 12px;border-radius:8px;border:1px solid var(--app-border);background:transparent;color:var(--app-text);cursor:pointer;font-size:12px;white-space:nowrap;">复制命令</button>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="agentInstallClose" style="padding:7px 16px;border-radius:8px;border:1px solid var(--app-border);background:transparent;color:var(--app-text);cursor:pointer;font-size:12.5px;">稍后再说</button>
      <button id="agentRetryBtn" style="padding:7px 18px;border-radius:8px;border:none;background:var(--app-primary,#3f8cff);color:#fff;cursor:pointer;font-size:12.5px;">检测 / 重试</button>
    </div>
  </div>
</div>
<div id="app">
  <!-- 头部 -->
  <header class="th-header">
    <div class="th-header-left">
      <h1>🧰 工具</h1>
      <p class="th-subtitle">小工具合集，拔插式扩展，开箱即用</p>
    </div>
    <button class="th-btn th-btn-ghost" id="importToolBtn">+ 导入工具</button>
  </header>

  <!-- 搜索 & 筛选 -->
  <div class="th-toolbar">
    <div class="th-search-wrap">
      <svg class="th-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="th-search" id="searchInput" placeholder="搜索工具…" autocomplete="off">
      <span class="th-search-clear" id="searchClear">✕</span>
    </div>
    <div class="th-chips" id="chips"></div>
  </div>

  <!-- 卡片网格 -->
  <div class="th-grid" id="grid"></div>

  <!-- 空状态 -->
  <div class="th-empty" id="empty" style="display:none">
    <div class="th-empty-icon">🧰</div>
    <h3>暂无工具</h3>
    <p>点击右上角「导入工具」按钮，上传自包含 HTML 工具页面</p>
  </div>

  <!-- 加载中 -->
  <div class="th-loading" id="loading"><div class="th-spinner"></div></div>
</div>

<!-- 工具运行遮罩层 -->
<div class="th-overlay" id="overlay">
  <div class="th-overlay-header">
    <div class="th-overlay-leading">
      <button class="th-btn th-btn-ghost-sm th-overlay-back" id="overlayBackBtn" title="返回工具列表">←</button>
      <span class="th-overlay-title" id="overlayTitle">工具</span>
    </div>
    <div class="th-overlay-actions">
      <button class="th-btn th-btn-ghost-sm" id="viewPromptBtn" title="查看开发提示词">📋 提示词</button>
      <button class="th-btn th-btn-ghost-sm" id="overlayCloseBtn" title="返回工具列表">✕</button>
    </div>
  </div>
  <iframe class="th-overlay-frame" id="toolFrame"></iframe>
</div>

<!-- 提示词 Modal -->
<div class="th-modal-mask" id="promptModal" style="display:none">
  <div class="th-modal">
    <div class="th-modal-header">
      <span>📋 开发提示词</span>
      <button class="th-btn th-btn-ghost-sm" id="promptClose">✕</button>
    </div>
    <div class="th-modal-body">
      <div id="promptContent" style="max-height:60vh;overflow-y:auto;font-size:13px;line-height:1.8;color:var(--app-text);"></div>
    </div>
    <div class="th-modal-footer">
      <button class="th-btn th-btn-primary" id="copyPromptBtn">复制提示词</button>
    </div>
  </div>
</div>

<!-- 导入工具 Modal -->
<div class="th-modal-mask" id="importModal" style="display:none">
  <div class="th-modal th-modal-import">
    <div class="th-modal-header">
      <span>导入工具</span>
      <button class="th-btn th-btn-ghost-sm" id="importModalClose">✕</button>
    </div>
    <div class="th-modal-body">
      <div class="th-form">
        <label>名称 *</label>
        <input type="text" id="importName" placeholder="如：JSON 格式化" class="th-input">
        <label>分类</label>
        <input type="text" id="importCategory" placeholder="如：文件处理、文本工具" class="th-input">
        <label>描述</label>
        <input type="text" id="importDesc" placeholder="一句话描述工具功能" class="th-input">
        <label>开发提示词</label>
        <textarea id="importPrompt" placeholder="描述该工具的开发需求，方便日后复用" class="th-textarea"></textarea>
        <label>HTML 文件 *</label>
        <div class="th-file-zone" id="fileZone">
          <span>点击选择或拖拽 HTML 文件</span>
          <span class="th-file-name" id="fileName"></span>
        </div>
      </div>
    </div>
    <div class="th-modal-footer">
      <span class="th-form-msg" id="importMsg"></span>
      <button class="th-btn th-btn-primary" id="importConfirmBtn">导入</button>
    </div>
  </div>
</div>

<script src="js/tools-core.js"></script>
<script src="js/ui-common.js"></script>
</body>
</html>
