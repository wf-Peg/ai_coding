<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cShape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9E9E"/>
      <stop offset="100%" stop-color="#2D7D7D"/>
    </linearGradient>
    <linearGradient id="cInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BBDBD"/>
      <stop offset="100%" stop-color="#3A9B9B"/>
    </linearGradient>
  </defs>
  <!-- C形庇护（无背景，放大1.5倍，青色填充适配透明背景） -->
  <g transform="translate(55, 60) scale(1.5) translate(-55, -60)">
    <!-- 主庇护弧 -->
    <path d="M 38 94 C 26 88, 20 76, 20 64 C 20 52, 26 40, 38 34 L 44 42 C 36 46, 32 54, 32 64 C 32 74, 36 82, 44 86 Z" fill="url(#cShape)" opacity="0.95"/>
    <!-- 顶部庇护弧 -->
    <path d="M 38 34 C 48 28, 60 26, 72 28 C 80 30, 86 34, 90 40 L 84 48 C 80 44, 76 40, 70 38 C 60 36, 50 38, 44 42 Z" fill="url(#cInner)" opacity="0.85"/>
    <!-- 碎片（黄色、橙色、红色） -->
    <circle cx="54" cy="60" r="4.5" fill="#FFD93D" opacity="0.92"/>
    <circle cx="66" cy="55" r="3.5" fill="#FF9F45" opacity="0.88"/>
    <circle cx="62" cy="68" r="3" fill="#FF6B6B" opacity="0.85"/>
    <!-- 微光点缀 -->
    <circle cx="54" cy="60" r="2" fill="#FFF" opacity="0.5"/>
    <circle cx="66" cy="55" r="1.5" fill="#FFF" opacity="0.4"/>
    <circle cx="62" cy="68" r="1.2" fill="#FFF" opacity="0.3"/>
  </g>
</svg>