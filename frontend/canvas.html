<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画布 - 碎碎记</title>
    <script src="libs/d3.min.js"></script>
    <script src="libs/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: var(--app-primary);
            --primary-light: var(--app-primary-soft);
            --primary-dark: var(--app-primary-hover);
            --background: var(--app-bg);
            --surface: var(--app-surface);
            --text: var(--app-text);
            --text-secondary: var(--app-text-secondary);
            --text-muted: var(--app-text-muted);
            --border: var(--app-border);
            --radius: var(--app-radius);
            --radius-sm: var(--app-radius-sm);
            --shadow: var(--app-shadow-sm);
            --shadow-hover: var(--app-shadow-md);
            --transition: var(--app-duration-normal) var(--app-ease-smooth);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Nav */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            backdrop-filter: saturate(120%);
        }
        .nav .title {
            font-size: 1.15rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }
        .nav .nav-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* Graph Container */
        .graph-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--background);
        }
        .graph-container svg {
            width: 100%;
            height: 100%;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            z-index: 10;
        }
        .loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty State */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            z-index: 10;
            pointer-events: none; /* 穿透右键到容器，保证空态下「右键空白新建节点」可用 */
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.9rem;
        }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 16px;
            left: 16px;
            display: flex;
            gap: 14px;
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            z-index: 50;
            box-shadow: var(--shadow);
        }
        .legend-item { display: inline-flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .lmark { width: 16px; height: 0; display: inline-block; border-top: 2px solid; }

        /* 小地图 */
        .minimap {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 200px;
            height: 140px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow-hover);
            z-index: 60;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .minimap .minimap-head {
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 5px 10px;
            border-bottom: 1px solid var(--border);
        }
        .minimap .minimap-svg {
            flex: 1;
            width: 100%;
            height: calc(100% - 26px);
            display: block;
        }
        .minimap-node { fill: var(--app-primary); }
        .minimap-node.note-node { fill: #fbbf24; }
        .minimap-node.link-node { fill: #22d3ee; }
        .minimap-node.image-node { fill: #a78bfa; }
        .minimap-node.ref-node { fill: #14b8a6; }
        .minimap-link { stroke: var(--app-border); stroke-width: 1; opacity: 0.6; }
        .minimap-viewport {
            fill: rgba(86, 156, 255, 0.12);
            stroke: var(--primary);
            stroke-width: 1.5;
            cursor: grab;
        }
        .minimap-viewport.dragging { cursor: grabbing; }

        /* 画布卡片节点 */
        .node { cursor: pointer; }
        .node-card-rect {
            stroke: var(--border-strong, var(--border));
            stroke-width: 1px;
            filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.04));
            cursor: pointer;
            transform-box: fill-box;
            transform-origin: center;
            transition:
                stroke var(--app-duration-fast) var(--app-ease-smooth),
                stroke-width var(--app-duration-fast) var(--app-ease-smooth),
                filter var(--app-duration-fast) var(--app-ease-smooth),
                transform var(--app-duration-fast) var(--app-ease-smooth);
        }
        .node:hover .node-card-rect {
            stroke: var(--primary);
            stroke-width: 1.5px;
            filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.08));
            transform: scale(1.02);
        }
        .node-focus-ring {
            stroke: var(--app-primary-soft);
            stroke-width: 0;
            fill: none;
            pointer-events: none;
            transition: stroke-width var(--app-duration-fast) var(--app-ease-smooth);
        }
        .node.selected-node .node-card-rect {
            stroke: var(--primary);
            stroke-width: 2px;
        }
        .node.selected-node .node-focus-ring { stroke-width: 3px; }
        .node.linking .node-card-rect {
            stroke: var(--primary) !important;
            stroke-width: 2px !important;
            stroke-dasharray: 4 3;
        }
        .node-image-frame { stroke: var(--border); stroke-opacity: 0.6; stroke-width: 1px; pointer-events: none; }
        .node-type-icon { pointer-events: none; }
        .node-type-icon svg { color: rgba(15, 23, 42, 0.55); }
        .node .canvas-card-text {
            font-size: 11px;
            fill: #1f2937;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }
        .node .canvas-ref-text { fill: #0f766e; }
        .node .node-card-title { font-size: 12px; font-weight: 700; }
        .node .node-card-domain { font-size: 10px; fill: #6b7280; }

        /* 手动连线：幕布式轻细发丝线，hover 才加厚重 */
        .link-manual {
            stroke: var(--border-strong, var(--border));
            stroke-opacity: 0.85;
            stroke-width: 1.25px;
            cursor: pointer;
            transition:
                stroke var(--app-duration-fast) var(--app-ease-smooth),
                stroke-width var(--app-duration-fast) var(--app-ease-smooth),
                stroke-opacity var(--app-duration-fast) var(--app-ease-smooth);
        }
        .link-manual:hover { stroke: var(--primary); stroke-width: 1.75px; stroke-opacity: 1; }
        .link-manual.dimmed { stroke-opacity: 0.06; }
        .canvas-arrow-path { fill: var(--app-text-muted); }
        .temp-link { stroke: var(--primary); stroke-width: 1.4px; stroke-dasharray: 4 4; pointer-events: none; opacity: 0.9; }

        /* 分组 frame */
        .group-frame-rect {
            fill: var(--app-primary-soft);
            fill-opacity: 0.18;
            stroke: var(--border);
            stroke-opacity: 0.8;
            stroke-width: 1.2px;
            stroke-dasharray: 6 4;
            pointer-events: none;
            transition: stroke var(--app-duration-fast) var(--app-ease-smooth);
        }
        .group-frame:hover .group-frame-rect { stroke: var(--primary); stroke-opacity: 1; }
        .group-frame-chip {
            fill: var(--surface);
            stroke: var(--border);
            stroke-width: 1px;
            pointer-events: none;
        }
        .group-frame-title {
            font-size: 11px;
            fill: var(--primary);
            font-weight: 600;
            text-anchor: start;
            user-select: none;
            cursor: grab;
        }
        .group-frame.selected-frame .group-frame-rect {
            stroke-opacity: 1;
            fill-opacity: 0.3;
        }

        /* 框选矩形 */
        .box-select-rect {
            fill: var(--primary);
            fill-opacity: 0.08;
            stroke: var(--primary);
            stroke-dasharray: 5 4;
            stroke-width: 1.2px;
            pointer-events: none;
        }

        /* Canvas context menu */
        .canvas-menu {
            position: fixed;
            z-index: 300;
            min-width: 180px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow-hover);
            padding: 6px;
            display: flex;
            flex-direction: column;
        }
        .canvas-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.85rem;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            transition:
                background var(--app-duration-fast) var(--app-ease-smooth),
                color var(--app-duration-fast) var(--app-ease-smooth);
        }
        .canvas-menu button .menu-icon { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
        .canvas-menu button:hover { background: var(--app-primary-soft); color: var(--primary); }
        .canvas-menu button:hover .menu-icon { color: var(--primary); }
        .canvas-menu button.danger { color: #ef4444; }
        .canvas-menu button.danger .menu-icon { color: #ef4444; }
        .canvas-menu button.danger:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .canvas-menu .divider { height: 1px; background: var(--border); margin: 4px 6px; }

        /* Canvas modal */
        .canvas-modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .canvas-modal {
            width: 380px;
            max-width: calc(100vw - 40px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            padding: 18px 20px;
        }
        .canvas-modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 14px; }
        .canvas-modal-body { margin-bottom: 16px; }
        .canvas-modal-body input, .canvas-modal-body textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--background);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            resize: none;
        }
        .canvas-modal-body input:focus, .canvas-modal-body textarea:focus { border-color: var(--primary); }
        .canvas-modal-body textarea { min-height: 80px; line-height: 1.5; }
        .canvas-modal-body .field-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
        .ref-picker-list { max-height: 220px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; }
        .ref-picker-item { padding: 8px 12px; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
        .ref-picker-item:last-child { border-bottom: none; }
        .ref-picker-item:hover, .ref-picker-item.selected { background: var(--border); }
        .ref-picker-item .rtype { color: var(--text-muted); font-size: 0.72rem; flex-shrink: 0; }
        .ref-picker-item .rtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .canvas-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .clear-all-tip { font-size: 0.85rem; line-height: 1.7; color: var(--text-secondary); }
        .clear-all-tip b { color: #ef4444; }
        .modal-btn { padding: 7px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: var(--transition); }
        .modal-btn:hover { border-color: var(--primary); color: var(--primary); }
        .modal-btn.ok { background: var(--primary); color: #fff; border-color: var(--primary); }
        .modal-btn.ok:hover { background: var(--primary-dark); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

        /* 手绘画笔工具条 */
        .draw-toolbar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            padding: 6px 10px;
            background: var(--app-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--app-shadow-md);
            max-width: calc(100% - 24px);
            overflow-x: auto;
        }
        .draw-toolbar button {
            border: none;
            border-radius: 8px;
            padding: 5px 9px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition:
                background var(--app-duration-fast) var(--app-ease-smooth),
                color var(--app-duration-fast) var(--app-ease-smooth);
        }
        .draw-toolbar button:hover { background: var(--app-primary-soft); color: var(--primary); }
        .draw-toolbar button.is-active { background: var(--app-primary); color: #fff; }
        .draw-toolbar button.primary { background: var(--app-primary); color: #fff; }
        .draw-toolbar button.primary:hover { background: var(--app-primary-hover); color: #fff; }
        .draw-toolbar .divider { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
        .draw-toolbar .swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid var(--border);
            padding: 0;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .draw-toolbar .swatch.selected { outline: 2px solid var(--primary); outline-offset: 1px; }

        /* 手绘输入覆盖层（画板工具激活时全屏截获指针） */
        .draw-overlay {
            position: absolute;
            inset: 0;
            z-index: 85;
            cursor: crosshair;
            display: none;
            pointer-events: none;
            touch-action: none;
        }
        .draw-overlay.active {
            display: block;
            pointer-events: all;
        }

        /* 手绘工具条内图标按钮（抓手的小手图标等） */
        .draw-toolbar button.active-icon {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .draw-toolbar .tool-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }
        /* 抓手模式激活：画布光标变小手（grab → 拖动 grabbing） */
        .graph-container.is-panning { cursor: grab; }
        .graph-container.is-panning * { cursor: grab; }
        .graph-container.is-panning:active { cursor: grabbing; }
        .graph-container.is-panning:active * { cursor: grabbing; }
        /* 默认态（未选画笔等工具）即抓手：空白处平移，但节点/连线 hover 仍是指针可交互 */
        .graph-container.is-node-interactive svg .node:hover,
        .graph-container.is-node-interactive svg .node:hover .node-card-rect,
        .graph-container.is-node-interactive svg .link-manual:hover { cursor: pointer; }

        @media (max-width: 768px) {
            .nav { padding: 10px 16px; gap: 6px 8px; flex-wrap: wrap; }
            .nav .nav-hint { display: none; }
            .draw-toolbar { left: 12px; transform: none; right: 12px; justify-content: flex-start; }
        }
    </style>
    <link rel="stylesheet" href="styles/design-tokens.css">
    <link rel="stylesheet" href="styles/ui-common.css">
    <link rel="stylesheet" href="styles/canvas.css">

    <script src="js/theme-bridge.js"></script>
    <script src="js/menu-tab-shortcut.js"></script>

<body>
    <nav class="nav">
        <span class="title">画布</span>

        <!-- 文档切换器（多画布，对标幕布文档列表） -->
        <div class="doc-switcher" id="docSwitcher">
            <button class="doc-switcher-btn" id="docSwitcherBtn" title="切换 / 管理画布文档">
                <span class="doc-switcher-name" id="docSwitcherName">我的画布</span>
                <svg class="doc-switcher-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="doc-switcher-menu" id="docSwitcherMenu" style="display:none;">
                <div class="doc-switcher-list" id="docSwitcherList"></div>
                <div class="divider"></div>
                <button class="menu-action" data-action="new-doc">新建画布</button>
                <button class="menu-action" data-action="open-doc-list">打开文档列表</button>
            </div>
        </div>

        <!-- 视图三态：大纲 / 分栏 / 画布 -->
        <div class="view-switch" id="viewSwitch" role="group" aria-label="视图切换">
            <button data-mode="outline" title="仅大纲">大纲</button>
            <button data-mode="split" class="is-active" title="左大纲 + 右画布">分栏</button>
            <button data-mode="canvas" title="仅画布">画布</button>
        </div>

        <button class="nav-action" id="layoutByOutlineBtn" title="按大纲层级重新排布画布卡片（Reingold–Tilford 整洁树）">按大纲排版</button>
        <span class="nav-warn" id="scaleWarn" style="display:none;"></span>

        <span class="nav-hint">空白双击新建便签 · 右键新建节点 · 双击编辑 · 选中节点右键连线 · 拖动吸附网格 · 空格拖动平移 · 滚轮缩放 · 大纲内 Enter 同级 / Tab 缩进 / Shift+Tab 反缩进 / Alt+↑↓ 换序 / Ctrl+↑↓ 折叠</span>
    </nav>

    <div class="canvas-body" id="canvasBody" data-view-mode="split">

        <!-- 左侧大纲面板（幕布式层级大纲） -->
        <aside class="outline-panel" id="outlinePanel">
            <div class="outline-head">
                <span class="outline-head-title">大纲</span>
                <div class="outline-head-actions">
                    <button class="outline-icon-btn ai-highlight" id="aiOutlineBtn" title="用 AI 智能生成大纲（对标幕布：输主题/选示例 → 生成 → 一键作为画布）">✨ 智能生成</button>
                    <button class="outline-icon-btn" id="importOutlineBtn" title="导入 Markdown / OPML 大纲（粘贴或选文件 → 预览 → 一键作为画布）">导入</button>
                    <button class="outline-icon-btn" id="outlineSearchBtn" title="在大纲中搜索并定位（Ctrl+F / Enter 下一个 / Shift+Enter 上一个 / Esc 关闭）">搜索</button>
                    <button class="outline-icon-btn" id="outlineExpandBtn" title="展开全部">展开</button>
                    <button class="outline-icon-btn" id="outlineCollapseBtn" title="折叠全部">折叠</button>
                    <button class="outline-icon-btn" id="outlineExportBtn" title="导出为 Markdown 大纲">导出 MD</button>
                    <button class="outline-icon-btn" id="outlineOPMLBtn" title="导出为 OPML（幕布 / 大纲工具互通）">导出 OPML</button>
                </div>
            </div>
            <!-- 大纲搜索浮层（7.5：输入 + 命中计数 + 关闭；Esc 关闭复位） -->
            <div class="outline-search" id="outlineSearch" style="display:none;">
                <input class="outline-search-input" type="text" placeholder="在大纲中搜索…" spellcheck="false">
                <span class="outline-search-count"></span>
                <button class="outline-search-close" title="关闭（Esc）">✕</button>
            </div>
            <div class="outline-tree" id="outlineTree"></div>
            <div class="outline-empty" id="outlineEmpty" style="display:none;">
                还没有内容<br>点击这里或用右键菜单新建节点，即可开始列大纲
                <button class="outline-empty-action" id="aiOutlineEmptyBtn">✨ 用 AI 生成大纲</button>
            </div>
        </aside>

        <!-- 分栏分隔线：可拖拽调整左大纲面板宽度（双击复位），仅分栏视图显示 -->
        <div class="split-resizer" id="splitResizer" title="拖拽调整大纲宽度 · 双击复位"></div>

        <div class="graph-container" id="graphContainer">
            <div class="loading" id="loadingEl">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
            <div class="empty-state" id="emptyEl" style="display:none;">
                <div class="icon">🪧</div>
                <h3 id="emptyTitle">暂无画布节点</h3>
                <p id="emptyDesc">双击空白处新建便签，或右键空白处新建便签 / 链接 / 图片 / 引用</p>
                <button class="empty-state-action" id="aiOutlineCanvasEmptyBtn">✨ 用 AI 生成大纲</button>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="dot" style="background:#fbbf24;"></span>便签</div>
                <div class="legend-item"><span class="dot" style="background:#22d3ee;"></span>链接</div>
                <div class="legend-item"><span class="dot" style="background:#a78bfa;"></span>图片</div>
                <div class="legend-item"><span class="dot" style="background:#14b8a6;"></span>引用</div>
                <div class="legend-item"><span class="lmark" style="border-top-color:#a78bfa;"></span>手动连线</div>
            </div>

            <!-- 手绘画笔工具条（临时擦写板） -->
            <div class="draw-toolbar" id="drawToolbar" title="手绘为临时擦写，刷新即清空，不做存储/导出 · 再次点击已选工具或按 Esc 退出画板">
                <button data-tool="pen">画笔</button>
                <button data-tool="highlighter">荧光</button>
                <button data-tool="eraser">橡皮</button>
                <button class="active-icon" data-pan="pan" title="抓手：选中后左键直接拖动画布平移，按 Esc 或再次点击退出">
                    <svg class="tool-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M9.5 2.5a1.5 1.5 0 0 1 3 0v5.6a.9.9 0 0 0 1.8 0V4.5a1.5 1.5 0 0 1 3 0v4.1a.9.9 0 0 0 1.8 0V7a1.5 1.5 0 0 1 3 0v6.1c0 4.6-3 8.4-7.6 8.4h-1.2a8.6 8.6 0 0 1-7.3-4l-1.7-3a1.5 1.5 0 0 1 2.5-1.6L9.5 13.9V5.5a.9.9 0 0 1 3-1.1V2.5Z M13 13.6a1 1 0 0 1 2 0v2.2a1 1 0 0 1-2 0v-2.2Zm4-1.4a1 1 0 0 1 2 0v3a1 1 0 0 1-2 0v-3Z"/></svg>
                    <span>抓手</span>
                </button>
                <div class="divider"></div>
                <button data-size="thin" class="is-active" title="细">细</button>
                <button data-size="bold" title="粗">粗</button>
                <div class="divider"></div>
                <button class="swatch selected" data-color="#222" style="background-color:#222;"></button>
                <button class="swatch" data-color="#6b7280" style="background-color:#6b7280;"></button>
                <button class="swatch" data-color="#1a73e8" style="background-color:#1a73e8;"></button>
                <button class="swatch" data-color="#e5484d" style="background-color:#e5484d;"></button>
                <button class="swatch" data-color="#30a46c" style="background-color:#30a46c;"></button>
                <button class="swatch" data-color="#f76b15" style="background-color:#f76b15;"></button>
                <div class="divider"></div>
                <button id="undoBtn">撤销</button>
                <button id="clearBtn">清空</button>
                <div class="divider"></div>
                <button id="exportBtn" class="primary" title="将当前画布（含墨迹）导出为 PNG 图片">导出图片</button>
            </div>

            <!-- 手绘输入覆盖层 -->
            <div class="draw-overlay" id="drawOverlay"></div>

            <!-- 小地图：大画布快速定位 -->
            <div class="minimap" id="minimap" style="display:none;">
                <div class="minimap-head">定位</div>
                <svg class="minimap-svg" id="minimapSvg"></svg>
            </div>
        </div>
    </div>

    <!-- 文档列表（画布页内部视图，对标幕布首页文档列表） -->
    <div class="doc-list-mask" id="docListMask" style="display:none;">
        <div class="doc-list-panel">
            <div class="doc-list-head">
                <span class="doc-list-title">我的画布</span>
                <span class="doc-list-sub" id="docListSub"></span>
                <div class="doc-list-head-actions">
                    <button class="modal-btn ok" id="docListNewBtn">新建画布</button>
                    <button class="modal-btn" id="docListCloseBtn">关闭</button>
                </div>
            </div>
            <div class="doc-list-grid" id="docListGrid"></div>
        </div>
    </div>

    <!-- 画布右键菜单（空白处） -->
    <div class="canvas-menu" id="canvasMenu" style="display:none;">
        <button data-action="add-note"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>新建便签</button>
        <button data-action="add-link"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>新建链接</button>
        <button data-action="add-image"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>新建图片</button>
        <div class="divider"></div>
        <button data-action="add-ref"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>引用已有节点</button>
        <div class="divider"></div>
        <button data-action="clear-all" class="danger"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>清空全部内容</button>
    </div>
    <!-- 节点右键菜单 -->
    <div class="canvas-menu" id="nodeMenu" style="display:none;">
        <button data-action="link-from"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>从此节点连线</button>
        <button data-action="edit-node"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>编辑内容</button>
        <button data-action="open-in-editor" id="nodeOpenInEditorAction" style="display:none;" title="把节点内容落为临时 Markdown 文件，在编辑器新标签打开（方向性跳转，不回写画布）"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m10 9 3 3-3 3"/><path d="M14 15h4"/></svg>在编辑器中打开</button>
        <div class="divider"></div>
        <button data-action="group" id="groupAction" style="display:none;"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>组成分组</button>
        <button data-action="delete-node" class="danger"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除节点</button>
    </div>
    <!-- 连线右键菜单 -->
    <div class="canvas-menu" id="edgeMenu" style="display:none;">
        <button data-action="delete-edge" class="danger"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除连线</button>
    </div>
    <!-- 分组 frame 右键菜单 -->
    <div class="canvas-menu" id="groupMenu" style="display:none;">
        <button data-action="rename-group"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>重命名分组</button>
        <div class="divider"></div>
        <button data-action="dissolve-group" class="danger"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>解散分组</button>
    </div>

    <!-- 画布节点 新建/编辑/引用 弹窗 -->
    <div class="canvas-modal-mask" id="canvasModalMask" style="display:none;">
        <div class="canvas-modal">
            <div class="canvas-modal-title" id="canvasModalTitle"></div>
            <div class="canvas-modal-body" id="canvasModalBody"></div>
            <div class="canvas-modal-actions">
                <button class="modal-btn" id="canvasModalCancel">取消</button>
                <button class="modal-btn ok" id="canvasModalOk">确定</button>
            </div>
        </div>
    </div>

    <script src="js/canvas-outline-md.js"></script>
    <script src="js/canvas-outline.js"></script>
    <script src="js/canvas-ai-outline.js"></script>
    <script src="canvas.js"></script>
    <script>
      (function() {
        const THEME_KEY = 'app_theme_v1';
        const APPEARANCE_KEY = 'app_appearance_v1';
        function getEffective() {
          const app = localStorage.getItem(APPEARANCE_KEY) || 'notion';
          if (app === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'notion';
          return app;
        }
        function apply() {
          const t = getEffective();
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : (t === 'regular' ? 'regular' : 'notion'));
          if (typeof window.onThemeChange === 'function') window.onThemeChange();
        }
        window.applyTheme = apply;
        apply();
        window.addEventListener('storage', function(e) {
          if (e.key === THEME_KEY || e.key === APPEARANCE_KEY) apply();
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
          if ((localStorage.getItem(APPEARANCE_KEY) || 'notion') === 'system') apply();
        });
      })();
    </script>
</body>
</html>
