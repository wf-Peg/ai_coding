# 剪藏Demo项目配置文件
# 参考阿里巴巴Java开发手册，添加详细注释

# Spring配置
spring:
  # 应用配置
  application:
    name: clip-demo  # 应用名称
  
  # 邮件配置（可选，在Electron设置页面配置）
  mail:
    host: smtp.qq.com  # 邮件服务器主机
    port: 465  # 邮件服务器端口
    username: your@qq.com  # 邮箱用户名
    password: your-smtp-auth-code  # 邮箱SMTP授权码
    properties:
      mail:
        smtp:
          starttls:
            enable: true  # 启用STARTTLS
            required: true  # 要求STARTTLS
          auth: true  # 启用认证
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory  # SSL套接字工厂
  
  # AI配置
  ai:
    dashscope:
      # 阿里云DashScope API Key
      # 从 `https://dashscope.console.aliyun.com/apiKey` 获取
      api-key: your-dashscope-api-key
      # 可选：配置模型参数
      chat:
        options:
          # 模型名称，默认使用 qwen-turbo
          # 可选值: qwen-turbo, qwen-plus, qwen-max, qwen-max-longcontext,qwen-flash
          model: qwen-plus

# 服务器配置
server:
  port: 8080  # 服务器端口

# 剪藏配置
clip:
  # 存储配置
  storage:
    path: ./clip-storage  # 剪藏文件存放目录
  # 整理存储配置
  organized-storage:
    path: ./clip-organized  # 日报总结文件存放目录
  clip-weekly-report:
    path: ./weeklyReport   # 周报文件存放目录

