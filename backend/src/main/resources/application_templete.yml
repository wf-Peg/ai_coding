spring:
  application:
    name: clip-demo
  # Mail configuration (optional, configure in Electron settings page)
  mail:
    host: smtp.qq.com
    port: 465
    username: your@qq.com
    password: your-smtp-auth-code
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
  ai:
    dashscope:
      # 阿里云 DashScope API Key
      # 从 `https://dashscope.console.aliyun.com/apiKey` 获取
      api-key: your-dashscope-api-key
      # 可选：配置模型参数
      chat:
        options:
          # 模型名称，默认使用 qwen-turbo
          # 可选值: qwen-turbo, qwen-plus, qwen-max, qwen-max-longcontext,qwen-flash
          model: qwen-plus

server:
  port: 8080

clip:
  storage:
    path: ./clip-storage  # 剪藏文件存放目录
  organized-storage:
    path: ./clip-organized  # 总结文件存放目录

