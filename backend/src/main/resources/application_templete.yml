# 剪藏Demo项目配置文件
# 参考阿里巴巴Java开发手册，添加详细注释

# Spring配置
spring:
  # 应用配置
  application:
    name: clip-demo  # 应用名称
  
  # 邮件配置（可选，在Electron设置页面配置）
  mail:
    host: smtp.qq.com  # 邮件服务器主机
    port: 465  # 邮件服务器端口
    username: your@qq.com  # 邮箱用户名
    password: your-smtp-auth-code  # 邮箱SMTP授权码
    properties:
      mail:
        smtp:
          starttls:
            enable: true  # 启用STARTTLS
            required: true  # 要求STARTTLS
          auth: true  # 启用认证
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory  # SSL套接字工厂
  
  # AI配置
  ai:
    dashscope:
      # 阿里云DashScope API Key
      # 从 `https://dashscope.console.aliyun.com/apiKey` 获取
      api-key: your-dashscope-api-key
      # 可选：配置模型参数
      chat:
        options:
          # 模型名称，默认使用 qwen-turbo
          # 可选值: qwen-turbo, qwen-plus, qwen-max, qwen-max-longcontext,qwen-flash
          model: qwen-plus
    openai:
      # DeepSeek API Key（OpenAI 兼容API）
      # 从 `https://platform.deepseek.com/api_keys` 获取
      api-key: your-deepseek-api-key
      base-url: https://api.deepseek.com
      chat:
        options:
          # DeepSeek 模型名称
          # 可选值: deepseek-chat, deepseek-reasoner
          model: deepseek-chat

# 服务器配置
server:
  port: 8080  # 服务器端口

# 剪藏配置
clip:
  # 存储配置
  storage:
    path: ./clip-storage  # 剪藏文件存放目录
  # 整理存储配置
  organized-storage:
    path: ./clip-organized  # 日报总结文件存放目录
  clip-weekly-report:
    path: ./weeklyReport   # 周报文件存放目录

# Exa 搜索配置（用于学习计划模块资源搜索）
exa:
  # 从 https://dashboard.exa.ai/api-keys 获取
  api-key: your-exa-api-key
  # 是否启用 Exa 搜索，false 时降级为 AI 生成资源
  enabled: true

# Obsidian 导出格式配置（归档 Markdown 兼容 Obsidian）
obsidian:
  export:
    # frontmatter 中包含的字段列表
    # 默认 7 字段，兼容 Obsidian properties 与 Dataview 查询
    frontmatter-fields:
      - date
      - updated
      - type
      - tags
      - aliases
      - category
      - source
    # Callout 类型映射（key=逻辑键, value=Obsidian Callout 类型）
    callout-types:
      analysis: note
      thoughts: quote
    # 归档文件名中的日期格式
    file-name-date-format: yyyy-MM-dd

# LLM Wiki 配置（基于 Obsidian Vault 的 LLM 知识库）
wiki:
  vault-path: ./obsidian-vault  # Obsidian Vault 根路径
  wiki-dir-name: wiki  # Vault 内 Wiki 目录名
  sources-dir-name: sources  # Vault 内 sources 目录名（待入库的原始 Markdown）
  batch-size: 5  # 批量入库窗口大小
  batch-timeout-minutes: 30  # 批量入库触发超时（分钟）
  lint-cache-enabled: true  # 是否启用增量 lint 缓存
  extraction-model: deepseek  # 抽取阶段使用的模型标识
  synthesis-model: dashscope  # 合成阶段使用的模型标识
  page-types: [entity, concept, synthesis, source]  # 支持的页面类型列表
  sync-enabled: true  # 是否启用 Web Clipper 源文件同步
  sync-interval-seconds: 60  # Web Clipper 同步扫描间隔（秒）

