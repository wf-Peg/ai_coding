<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片转换</title>
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --surface-subtle:#f1f1ef; --surface-hover:#ececea;
  --border:#e3e3df; --border-strong:#d2d2cd; --text:#2f3437; --text-secondary:#6b6f76;
  --text-muted:#92969d; --primary:#2383e2; --primary-hover:#1f76c9; --primary-soft:rgba(35,131,226,.1);
  --success:#238b63; --danger:#d14343; --danger-soft:rgba(209,67,67,.1);
  --radius-sm:6px; --radius:9px; --radius-lg:12px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 10px 24px rgba(15,23,42,.06);
  --ease-out-expo:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1f2224; --surface:#2a2e31; --surface-subtle:#33373a; --surface-hover:#3a3f42;
    --border:#3a3f42; --border-strong:#4a4f53; --text:#e8eaec; --text-secondary:#a6acb2;
    --text-muted:#7d8389; --primary:#4b9cf0; --primary-hover:#5fa8f2; --primary-soft:rgba(75,156,240,.15);
    --success:#3aa97c; --danger:#e05b5b; --danger-soft:rgba(224,91,91,.15);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.25); }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;padding:28px 20px 56px}
.header{margin-bottom:22px;animation:slideDown .4s var(--ease-out-expo)}
.header h1{font-size:1.4rem;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.header p{font-size:.9rem;color:var(--text-secondary)}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.dropzone{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:38px 20px;text-align:center;cursor:pointer;transition:all .25s var(--ease-out-expo);background:var(--surface)}
.dropzone:hover,.dropzone.drag{border-color:var(--primary);background:var(--primary-soft)}
.dropzone .icon{font-size:2rem;margin-bottom:10px}
.dropzone p{color:var(--text-secondary);font-size:.9rem}
.dropzone .hint{color:var(--text-muted);font-size:.8rem;margin-top:6px}

.preview{display:none;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.preview.show{display:block;animation:fade .25s ease}
.preview img{max-width:100%;max-height:220px;border-radius:var(--radius-sm);object-fit:contain}
.preview .name{font-size:.82rem;color:var(--text-secondary);margin-top:8px}
@keyframes fade{from{opacity:0}to{opacity:1}}

.controls{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row label{font-size:.85rem;color:var(--text-secondary);min-width:72px}
select,input[type=range]{accent-color:var(--primary)}
select{padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:.85rem;outline:none;min-width:140px}
select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.quality-value{font-size:.82rem;color:var(--text-secondary);min-width:36px}

.btn{border:none;border-radius:var(--radius);padding:11px 20px;font-size:.88rem;font-weight:500;cursor:pointer;transition:all .2s var(--ease-out-expo)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

.message{font-size:.85rem;padding:10px 14px;border-radius:var(--radius);margin-top:14px}
.message.error{background:var(--danger-soft);color:var(--danger)}
.message.info{background:var(--primary-soft);color:var(--primary)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🖼️ 图片转换</h1>
    <p>格式转换与压缩，支持 png / jpg / webp / gif 互转</p>
  </div>

  <div class="dropzone" id="zone">
    <div class="icon">🖼️</div>
    <p>拖拽或点击选择一张图片</p>
    <div class="hint">支持 png、jpg、webp、gif</div>
  </div>

  <div class="preview" id="preview">
    <img id="previewImg" alt="预览">
    <div class="name" id="previewName"></div>
  </div>

  <div class="controls">
    <div class="row">
      <label>目标格式</label>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="webp">WEBP</option>
        <option value="gif">GIF</option>
      </select>
    </div>
    <div class="row" id="qualityRow">
      <label>质量</label>
      <input type="range" id="quality" min="10" max="100" value="90" style="flex:1">
      <span class="quality-value" id="qualityVal">90%</span>
    </div>
    <button class="btn btn-primary" id="convertBtn" disabled>转换并下载</button>
  </div>
  <div id="msg"></div>
</div>

<script>
const API_BASE = (window.location.protocol === 'file:') ? 'http://127.0.0.1:8081' : '';
const $ = id => document.getElementById(id);
let currentFile = null;

$('quality').addEventListener('input', e => $('qualityVal').textContent = e.target.value + '%');
$('format').addEventListener('change', e => {
  $('qualityRow').style.display = (e.target.value === 'jpg' || e.target.value === 'webp') ? 'flex' : 'none';
});

const zone = $('zone');
zone.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => selectFile(input.files[0]);
  input.click();
});
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); selectFile(e.dataTransfer.files[0]); });

function selectFile(file) {
  if (!file) return;
  currentFile = file;
  $('previewImg').src = URL.createObjectURL(file);
  $('previewName').textContent = file.name;
  $('preview').classList.add('show');
  $('convertBtn').disabled = false;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (['jpg','jpeg','webp'].includes(ext)) { $('format').value = 'png'; $('qualityRow').style.display = 'none'; }
}

$('convertBtn').addEventListener('click', async () => {
  if (!currentFile) return;
  const btn = $('convertBtn');
  btn.disabled = true;
  btn.textContent = '<span class="spinner"></span>转换中…';
  const fd = new FormData();
  fd.append('file', currentFile);
  fd.append('format', $('format').value);
  fd.append('quality', $('quality').value);
  try {
    const res = await fetch(API_BASE + '/api/tools/image/convert', { method: 'POST', body: fd });
    if (!res.ok) { const err = await res.json().catch(() => ({})); showMsg(err.error || '转换失败', 'error'); return; }
    const blob = await res.blob();
    const base = currentFile.name.replace(/\.[^.]+$/, '');
    triggerDownload(blob, base + '.' + $('format').value);
    showMsg('✅ 转换成功，已开始下载', 'info');
  } catch (e) { showMsg('转换失败: ' + e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '转换并下载'; }
});

function showMsg(text, type) {
  $('msg').innerHTML = `<div class="message ${type}">${text}</div>`;
}
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
</script>
</body>
</html>
